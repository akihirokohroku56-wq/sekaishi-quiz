ような措置をとったか。", "事実上の保護国化", 5], ["15", 299, "エジプトでのウラービー運動と同じ1881年、その南のスーダンでおこった運動を何と呼ぶか。", "マフディー運動", 3], ["15", 299, "アラビア語の「救世主」を称し、マフディー運動を指導したイスラームの説教師は誰か。", "ムハンマド＝アフマド", 2], ["15", 299, "スーダンの知事・総督を歴任し、1885年にハルツームでムハンマド＝アフマドの軍と戦い戦死したイギリス軍人は誰か。", "ゴードン", 2], ["15", 300, "ガージャール朝がイギリス商人にタバコに関する独占的利権を与えたことに抗議して、1891年におこったイランの抵抗運動は何か。", "タバコ＝ボイコット運動", 6], ["15", 300, "1906年にいったん成功したが、イギリス・ロシア両国の干渉で挫折したイランの運動は何と呼ばれるか。", "立憲革命", 6], ["15", 300, "イランの立憲革命を挫折させる一因となった、1907年にイギリスとロシアが結んだ協約は何か。", "英露協商", 6], ["15", 300, "19世紀末に結成された、トルコでの立憲政治の確立を掲げた、青年将校や知識人たちの総称は何か。", "「青年トルコ人」", 6], ["15", 300, "「青年トルコ人」の中心的組織となった憲法復活をめざした政治組織は何か。", "「統一と進歩団」", 4], ["15", 300, "1908年、「青年トルコ人」がサロニカで成功し、ミドハト憲法（オスマン帝国憲法）を復活させた無血革命を何と呼ぶか。", "青年トルコ革命", 6], ["15", 300, "オスマン主義やパン＝イスラーム主義と異なり、「民族」としてのトルコ人を優先する考え方は何か。", "トルコ民族主義", 4], ["16", 302, "ロシアの帝国主義政策と結びついた、スラヴ系民族の統一と連帯をめざす思想と運動を何と呼ぶか。", "パン＝スラヴ主義", 5], ["16", 302, "隣国のオーストリアと対立を深め、バルカンでパン＝スラヴ主義の先頭に立った1878年独立の小国はどこか。", "セルビア", 5], ["16", 302, "1908年、青年トルコ革命による混乱に乗じて、完全独立を達成した自治国はどこか。", "ブルガリア", 3], ["16", 302, "1908年、青年トルコ革命による混乱に乗じて、オーストリアが併合した地域はどこか。", "ボスニア・ヘルツェゴヴィナ", 6], ["16", 302, "1912年、セルビア・モンテネグロ・ギリシア・ブルガリアが結成した反オーストリアの同盟は何か。", "バルカン同盟", 6], ["16", 302, "1912～13年、バルカン同盟とオスマン帝国とのあいだで勃発した戦争は何か。", "第1次バルカン戦争", 6], ["16", 302, "1913年、領土分配問題からセルビア・モンテネグロ・ギリシア・ルーマニア・オスマン帝国と、ブルガリアとのあいだでおこった戦争は何か。", "第2次バルカン戦争", 6], ["16", 302, "列強の利害や諸民族の要求などが絡み合った、第一次世界大戦前のバルカン半島の情勢を示す表現は何か。", "「ヨーロッパの火薬庫」", 6], ["16", 302, "1914年6月28日、オーストリア帝位継承者夫妻が暗殺されたボスニア・ヘルツェゴヴィナの中心都市はどこか。", "サライェヴォ", 6], ["16", 302, "1914年7月28日、オーストリアがどこの国に宣戦したことで第一次世界大戦が勃発したか。", "セルビア", 5], ["16", 303, "第一次世界大戦で協商国（連合国）側と戦った側のグループを何と呼ぶか。", "同盟国", 6], ["16", 303, "1914年8月、ドイツは短期決戦をめざし、どこの国の中立を侵犯してフランスへ侵入を開始したか。", "ベルギー", 5], ["16", 303, "1914年8月末の東部戦線で、ドイツが、侵入したロシアの大軍を撃破した戦場はどこか。", "タンネンベルク", 5], ["16", 303, "1914年9月、西部戦線では、侵入してきたドイツ軍をフランスがある戦場でくいとめた。それはどこか。", "マルヌ", 5], ["16", 303, "1916年、ドイツの強襲をフランス軍が守り抜いた、西部戦線における最大の激戦地はどこか。", "ヴェルダン", 3], ["16", 303, "1916年、英仏連合軍がドイツ軍に大攻勢をかけた戦場はどこか。", "ソンム", 2], ["16", 303, "ソンムの戦いで、塹壕戦に対応するためにイギリスが使用した新兵器は何か。", "戦車", 6], ["16", 303, "1915年のイープルの戦いで、ドイツが使用した新兵器は何か。", "毒ガス", 7], ["16", 303, "偵察用から始まり、爆撃用・戦闘用へと分化・発達した新兵器は何か。", "航空機", 6], ["16", 303, "開戦当初中立を宣言していたイタリアは、1915年に協商国側で参戦した。それはイギリス・フランス・ロシアと何という条約を結んだ結果か。", "ロンドン秘密条約", 4], ["16", 303, "イタリアはロンドン秘密条約を結んでの参戦によって、戦後における何の割譲を約束されたか。", "「未回収のイタリア」", 6], ["16", 303, "1915年、対オスマン帝国戦のための戦争協力を条件に、イギリスがアラブ人居住区の独占と独立をアラブ人指導者に約束した書簡は、何と通称されるか。", "フセイン（フサイン）・マクマホン協定（書簡）", 7], ["16", 303, "1916年、イギリス・フランス・ロシアがオスマン帝国領の分割や、パレスチナの国際管理などを秘密裏に結んだ協定は何か。", "サイクス・ピコ協定", 6], ["16", 304, "1917年、ユダヤ系金融資本の協力を得るため、イギリス外相がパレスチナにおけるユダヤ人の民族的郷土の設立を約束したものは、何と呼ばれるか。", "バルフォア宣言", 7], ["16", 304, "第一次世界大戦が長期化するなか、参戦国が全国民を動員して生産し、補給を整えていった体制を何と呼ぶか。", "総力戦", 7], ["16", 304, "大戦中に多くの国で実施された、物資の供給・分配を政府が統制するしくみは何か。", "配給制", 4], ["16", 304, "長びく戦争に勝利するため、1916年にイギリスで成立した内閣のように、諸政党が結束して政府を支持する体制を何と呼ぶか。", "挙国一致体制", 4], ["16", 304, "オスマン帝国が同盟国側で参戦した結果、1914年にイギリスはエジプトの地位をどのように変化させたか。", "正式保護国化", 3], ["16", 304, "1915年5月に発生した、イギリス客船がドイツの潜水艦によって撃沈されて100人以上のアメリカ人乗客が犠牲となった事件は何か。", "ルシタニア号事件", 3], ["16", 304, "第一次世界大戦中の1916年に挙国一致内閣をつくった、イギリスの自由党首相（政治家）は誰か。", "ロイド＝ジョージ", 3], ["16", 304, "ハノーヴァー朝は1901年に改称していたが、第一次世界大戦中の17年、ドイツ風の名前をきらって現在使われている王朝名に改称した。その名称は何か。", "ウィンザー朝", 3], ["16", 304, "第一次世界大戦中の1917年に挙国一致内閣をつくった、フランスの首相は誰か。", "クレマンソー", 2], ["16", 304, "第一次世界大戦が始まった1914年に実質的に活動を停止し、1920年に事実上解散した国際的労働者組織は何か。", "第2インターナショナル", 3], ["16", 304, "第一次世界大戦中には滞在先のスイスで反戦・平和を訴えた、フランスの作家・思想家は誰か。", "ロマン＝ロラン", 1], ["16", 304, "1917年、ドイツが開始した通商破壊作戦を何と呼ぶか。", "無制限潜水艦作戦", 7], ["16", 304, "ドイツによる無制限潜水艦作戦の開始を理由として第一次世界大戦に参戦した国はどこか。", "アメリカ合衆国", 7], ["16", 305, "1918年3月に調印され、ロシアが第一次世界大戦から離脱した、ドイツとの単独講和条約は何か。", "ブレスト＝リトフスク条約", 7], ["16", 305, "同盟国のうち、1918年9月に協商国に降伏した国はどこか。", "ブルガリア", 3], ["16", 305, "同盟国のうち、1918年10月に協商国に降伏した国はどこか。", "オスマン帝国", 3], ["16", 305, "1918年10月末、領内のハンガリー人やスラヴ人の分離独立宣言が出され、11月に降伏した国はどこか。", "オーストリア", 4], ["16", 305, "1918年11月、ドイツ帝国崩壊のきっかけとなる水兵の反乱がおきた。それはどこでおこったか。", "キール軍港", 7], ["16", 305, "1918年にドイツで、皇帝ヴィルヘルム2世を退位させて帝政を打倒し、ドイツ社会民主党を中心とする臨時政府による共和政が誕生したできごとを何と呼ぶか。", "ドイツ革命", 7], ["16", 305, "ドイツ革命の際、労働者と兵士が組織した評議会は、ドイツ語で何と呼ばれるか。", "レーテ", 4], ["16", 305, "1918～22年に『西洋の没落』を著し、大きな反響を呼んだドイツの歴史哲学者は誰か。", "シュペングラー", 1], ["16", 305, "女性参政権運動や第一次世界大戦での女性の貢献を背景に、アメリカ、イギリスなどで実現した権利は何か。", "女性参政権", 5], ["16", 305, "1918年にアメリカから世界中に広まったインフルエンザの、ある国での流行が大きく報道されたことに由来する呼称は何か。", "スペイン風邪", 4], ["16", 305, "1917年3月、市民や労働者が参加したペトログラード蜂起により、皇帝が退位してロマノフ朝が崩壊した。この革命をロシア暦では何と称するか。", "二月革命", 7], ["16", 305, "二月革命で退位した皇帝は誰か。", "ニコライ2世", 6], ["16", 305, "蜂起の際に労働者や兵士が組織し、その後の革命の中心となったものは何か。", "ソヴィエト（評議会）", 7], ["16", 306, "二月革命のあとに成立した臨時政府の中心となった政党は何か。", "立憲民主党", 4], ["16", 306, "ロシアの二月革命後、亡命先のスイスから帰国したボリシェヴィキの指導者は誰か。", "レーニン", 7], ["16", 306, "「すべての権力をソヴィエトへ」をスローガンとして、レーニンが発表した基本方針は何と呼ばれるか。", "四月テーゼ", 7], ["16", 306, "臨時政府に加わった唯一の社会主義者で、7月の改組で首相となった社会革命党右派の指導者は誰か。", "ケレンスキー", 7], ["16", 306, "二月革命後、社会革命党とともにソヴィエト内の多数派を形成したが、その後の革命前後に影響力を失った勢力は何か。", "メンシェヴィキ", 5], ["16", 306, "二月革命後の、ソヴィエトと臨時政府が政治権力として併存していた状況を何と呼ぶか。", "二重権力", 6], ["16", 306, "1917年11月、ボリシェヴィキ派の労働者や兵士の武装蜂起で、社会主義政権を樹立した革命をロシア暦では何と称するか。", "十月革命", 7], ["16", 306, "二月革命後にメンシェヴィキからボリシェヴィキに移って十月革命を指導し、その後外務人民委員になった人物は誰か。", "トロツキー", 6], ["16", 306, "1917年11月、成立したロシアの新政権は何を出して、全交戦国に講和を呼びかけたか。", "「平和に関する布告」", 7], ["16", 306, "1917年11月、ロシアの新政権が「平和に関する布告」で示した原則的考えは何か。", "無併合・無償金・民族自決", 7], ["16", 306, "ロシアの新政権が「平和に関する布告」と同時に採択した土地の私的所有廃止を内容とする布告は何か。", "「土地に関する布告」", 6], ["16", 306, "1917年11月の普通選挙で社会革命党が約6割の議席を占め、18年1月に開催された会議は何か。", "憲法制定会議", 7], ["16", 306, "憲法制定会議初日の冒頭でソヴィエト提出の宣言が否決されたため、翌日レーニンが武力で会議を解散させた。これによって実現された支配形態を何と呼ぶか。", "ボリシェヴィキの一党支配", 7], ["16", 307, "1918年3月の政権掌握後、党大会でボリシェヴィキから改称し、一党独裁体制を確立した政党は何か。", "ロシア共産党", 7], ["16", 307, "1918年3月、ソヴィエト政権はどこへ遷都したか。", "モスクワ", 4], ["16", 307, "革命後、サボタージュや反革命の動きに対処するためにつくられた全ロシア非常委員会の略称は何か。", "チェカ", 5], ["16", 307, "反革命軍（白軍）や外国干渉軍と戦った、労働者や兵士からなるソヴィエト政権の軍隊は何か。", "赤軍", 7], ["16", 307, "外国軍による対ソ干渉戦争のうち、チェコ兵救出を名目に日本軍が主力でおこなったものを何と呼ぶか。", "シベリア出兵", 4], ["16", 307, "1918～21年、内戦と干渉戦争に対処するため、ソヴィエト政権がとった極端な統制経済政策を何と呼ぶか。", "戦時共産主義", 6], ["16", 307, "1919年にモスクワで結成され、別名、第3インターナショナルとも呼ばれた組織は何か。", "コミンテルン（共産主義インターナショナル）", 7], ["16", 307, "ロシアで1921年に採用された、資本主義経済の一部復活を認めた新経済政策の略称は何か。", "ネップ（NEP）", 6], ["16", 307, "1919年1月に開会され、第一次世界大戦の連合国が同盟国との講和会議を開いた都市はどこか。", "パリ", 7], ["16", 307, "パリ講和会議を主導したアメリカ大統領は誰か。", "ウィルソン", 7], ["16", 307, "1918年1月にウィルソンによって発表されたのち、パリ講和会議の原則とされたものは何か。", "十四カ条", 7], ["16", 307, "パリ講和会議を主導したイギリス首相は誰か。", "ロイド＝ジョージ", 5], ["16", 308, "パリ講和会議を主導したフランス首相は誰か。", "クレマンソー", 5], ["16", 308, "パリ講和会議で、ドイツに巨額の賠償金・全植民地の放棄・大幅な軍備制限などを課した条約は何か。", "ヴェルサイユ条約", 7], ["16", 308, "ヴェルサイユ条約でドイツからフランスに割譲された地域はどこか。", "（A）アルザス　（B）ロレーヌ", 6], ["16", 308, "ヴェルサイユ条約で非武装地帯とされた地域は何と呼ばれるか。", "（C）ラインラント", 7], ["16", 308, "1919年に結ばれた、連合国とオーストリアとの講和条約は何か。", "サン＝ジェルマン条約", 5], ["16", 308, "1919年に結ばれた、連合国とブルガリアとの講和条約は何か。", "ヌイイ条約", 5], ["16", 308, "1920年に結ばれた、連合国とハンガリーとの講和条約は何か。", "トリアノン条約", 5], ["16", 308, "1920年に結ばれた、連合国とオスマン帝国との講和条約は何か。", "セーヴル条約", 5], ["16", 308, "パリ講和会議での一連の講和条約がもとになってつくられたヨーロッパの国際体制を何と呼ぶか。", "ヴェルサイユ体制", 7], ["16", 308, "東欧諸国の独立を促した、十四カ条の理念は何か。", "民族自決", 6], ["16", 308, "第一次世界大戦末期に二重帝国からの分離を宣言し、1918年11月に共和政を宣言した国はどこか。", "ハンガリー", 4], ["16", 308, "サン＝ジェルマン条約によって独立が承認され、のちにユーゴスラヴィアと改称した王国は何か。", "セルブ＝クロアート＝スロヴェーン王国", 6], ["16", 308, "1918年10月にオーストリアからの独立を宣言し、翌年サン＝ジェルマン条約で正式に承認された国はどこか。", "チェコスロヴァキア", 4], ["16", 309, "1918年11月、ピウスツキを指導者にして独立復活を宣言した国はどこか。", "ポーランド", 4], ["16", 309, "ロシア革命の際、ロシアからの独立を宣言した北ヨーロッパの国はどこか。", "フィンランド", 1], ["16", 309, "ロシア革命の際、ロシアからの独立を宣言し、1920年に独立を承認されたバルト3国の一番北の国はどこか。", "エストニア", 3], ["16", 309, "1918年にロシアからの独立を宣言し、1920年に独立を承認されたバルト3国の中央の国はどこか。", "ラトヴィア", 3], ["16", 309, "1918年にロシアからの独立を宣言し、1920年に独立を承認されたバルト3国の一番南の国はどこか。", "リトアニア", 3], ["16", 309, "ウィルソンの十四カ条にもとづき、1920年に正式に発足した史上初の集団国際安全保障機構は何か。", "国際連盟", 7], ["16", 309, "国際連盟の理事会の設置当初、イギリス・フランス・イタリア・日本の4カ国に与えられた地位は何か。", "常任理事国", 5], ["16", 309, "全加盟国によって構成され、原則、全会一致の議決方法を採用した国際連盟の最高機関は何か。", "総会", 6], ["16", 309, "国際連盟に付設された、各国の労働問題の調整機関は何か。", "国際労働機関（ILO）", 5], ["16", 309, "19 const CHAPTER_NAMES = {
  "00":"序章","01":"第1章","02":"第2章","03":"第3章","04":"第4章",
  "05":"第5章","06":"第6章","07":"第7章","08":"第8章","09":"第9章",
  "10":"第10章","11":"第11章","12":"第12章","13":"第13章","14":"第14章",
  "15":"第15章","16":"第16章","17":"第17章","18":"第18章","19":"第19章"
};

const CHAPTERS_ORDERED = Object.keys(CHAPTER_NAMES).sort((a, b) => parseInt(a) - parseInt(b));

// State
let selectedChapters = new Set(CHAPTERS_ORDERED);
let selectedImportance = new Set([1,2,3,4,5,6,7]);
let mode = 'seq';
let dir = 'qa';
let session = [];
let currentIdx = 0;
let flipped = false;
let score = {o:0, x:0, skip:0};
let wrongQuestions = [];

// Init chapter grid
function initUI() {
  const grid = document.getElementById('chapterGrid');
  CHAPTERS_ORDERED.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn active';
    btn.id = 'ch_' + c;
    btn.textContent = c === '00' ? '序' : String(parseInt(c));
    btn.title = CHAPTER_NAMES[c];
    btn.onclick = () => toggleChapter(c);
    grid.appendChild(btn);
  });

  const impGrid = document.getElementById('impGrid');
  for(let i=1;i<=7;i++){
    const btn = document.createElement('button');
    btn.className = 'imp-btn active';
    btn.id = 'imp_' + i;
    btn.textContent = i;
    btn.onclick = () => toggleImp(i);
    impGrid.appendChild(btn);
  }

  updateCount();
}

function toggleChapter(c) {
  if(selectedChapters.has(c)) selectedChapters.delete(c);
  else selectedChapters.add(c);
  document.getElementById('ch_'+c).classList.toggle('active', selectedChapters.has(c));
  updateCount();
}
function selectAllChapters() {
  CHAPTERS_ORDERED.forEach(c => { selectedChapters.add(c); document.getElementById('ch_'+c).classList.add('active'); });
  updateCount();
}
function clearChapters() {
  selectedChapters.clear();
  CHAPTERS_ORDERED.forEach(c => document.getElementById('ch_'+c).classList.remove('active'));
  updateCount();
}

function toggleImp(i) {
  if(selectedImportance.has(i)) selectedImportance.delete(i);
  else selectedImportance.add(i);
  document.getElementById('imp_'+i).classList.toggle('active', selectedImportance.has(i));
  updateCount();
}

function setMode(m) {
  mode = m;
  document.getElementById('modeSeq').classList.toggle('active', m==='seq');
  document.getElementById('modeShuffle').classList.toggle('active', m==='shuffle');
}
function setDir(d) {
  dir = d;
  document.getElementById('dirQA').classList.toggle('active', d==='qa');
  document.getElementById('dirAQ').classList.toggle('active', d==='aq');
}

function getFiltered() {
  const pMin = parseInt(document.getElementById('pageMin').value) || 0;
  const pMax = parseInt(document.getElementById('pageMax').value) || 9999;
  return RAW.filter(q =>
    selectedChapters.has(q[0]) &&
    q[1] >= (pMin || 0) &&
    q[1] <= (pMax || 9999) &&
    selectedImportance.has(q[4])
  );
}

function updateCount() {
  const n = getFiltered().length;
  document.getElementById('countNum').textContent = n.toLocaleString();
}

function startSession() {
  let filtered = getFiltered();
  if(!filtered.length) { alert('条件に合う問題がありません。'); return; }
  if(mode === 'shuffle') {
    filtered = [...filtered].sort(() => Math.random() - .5);
  }
  session = filtered;
  currentIdx = 0;
  score = {o:0, x:0, skip:0};
  wrongQuestions = [];
  flipped = false;
  renderCard();
}

function renderCard() {
  if(currentIdx >= session.length) {
    renderResult();
    return;
  }
  const q = session[currentIdx];
  const total = session.length;
  const pct = (currentIdx / total * 100).toFixed(1);

  const isQA = dir === 'qa';
  const front = isQA ? q[2] : q[3];
  const back = isQA ? q[3] : q[2];

  const stars = Array.from({length:7}, (_,i) =>
    `<div class="imp-star ${i < q[4] ? 'filled' : ''}"></div>`
  ).join('');

  document.getElementById('mainArea').innerHTML = `
    <div class="progress-area">
      <div class="progress-info">
        <span class="pos">${currentIdx + 1} / ${total}</span>
        <div class="score-mini">
          <span class="score-o">○ ${score.o}</span>
          <span class="score-x">✕ ${score.x}</span>
        </div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
    </div>

    <div class="card-scene" id="cardScene" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face">
          <div class="card-meta">
            <span class="card-chapter-tag">${CHAPTER_NAMES[q[0]]} p.${q[1]}</span>
            <div class="card-imp">${stars}</div>
          </div>
          <div class="card-question">${front}</div>
          <div class="card-hint">${isQA ? 'タップで答えを見る' : 'タップで問題文を見る'}</div>
        </div>
        <div class="card-face card-back">
          <div class="card-meta">
            <span class="card-chapter-tag">${CHAPTER_NAMES[q[0]]} p.${q[1]}</span>
            <div class="card-imp">${stars}</div>
          </div>
          <div class="card-answer">${back}</div>
          <div class="card-page">${isQA ? '← 問題文' : '← 答え'}</div>
        </div>
      </div>
    </div>

    <p class="flip-hint">カードをタップして${isQA ? '答え' : '問題'}を確認</p>

    <div class="answer-btns">
      <button class="ans-btn ans-btn-o" id="btnO" onclick="answer('o')" disabled>○ 正解</button>
      <button class="ans-btn ans-btn-x" id="btnX" onclick="answer('x')" disabled>✕ 不正解</button>
      <button class="ans-btn ans-btn-skip" onclick="answer('skip')">→</button>
    </div>
  `;
  flipped = false;
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('cardScene').classList.toggle('flipped', flipped);
  if(flipped) {
    document.getElementById('btnO').disabled = false;
    document.getElementById('btnX').disabled = false;
  }
}

function answer(type) {
  if(type === 'skip') {
    score.skip++;
  } else if(type === 'o') {
    score.o++;
  } else {
    score.x++;
    wrongQuestions.push(session[currentIdx]);
  }
  currentIdx++;
  flipped = false;
  renderCard();
}

function renderResult() {
  const total = session.length;
  const pct = total > 0 ? Math.round(score.o / total * 100) : 0;
  document.getElementById('mainArea').innerHTML = `
    <div class="result-screen">
      <div class="result-title">結果発表</div>
      <div class="result-score-circle">
        <div class="result-pct">${pct}%</div>
        <div class="result-pct-label">正答率</div>
      </div>
      <div class="result-details">
        <div class="result-detail o">
          <div class="num">${score.o}</div>
          <div class="lbl">○ 正解</div>
        </div>
        <div class="result-detail x">
          <div class="num">${score.x}</div>
          <div class="lbl">✕ 不正解</div>
        </div>
        <div class="result-detail skip">
          <div class="num">${score.skip}</div>
          <div class="lbl">→ スキップ</div>
        </div>
      </div>
      <div class="result-btns">
        <button class="result-btn result-btn-primary" onclick="startSession()">▶ もう一度</button>
        <button class="result-btn result-btn-secondary" onclick="retryWrong()" ${score.x === 0 ? 'disabled style="opacity:.4;cursor:default;"' : ''}>✕ 不正解のみ再挑戦（${score.x}問）</button>
      </div>
    </div>
  `;
}

function retryWrong() {
  if(!wrongQuestions.length) return;
  session = [...wrongQuestions].sort(() => Math.random() - .5);
  currentIdx = 0;
  score = {o:0, x:0, skip:0};
  wrongQuestions = [];
  flipped = false;
  renderCard();
}

// Add input listeners
document.addEventListener('DOMContentLoaded', () => {
  initUI();
  document.getElementById('pageMin').addEventListener('input', updateCount);
  document.getElementById('pageMax').addEventListener('input', updateCount);
});
</script>
</body>
</html>
