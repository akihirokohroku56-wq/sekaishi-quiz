<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界史 一問一答</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0e0c;
  --surface: #1a1815;
  --surface2: #231f1b;
  --border: #2e2a25;
  --gold: #c9a84c;
  --gold-light: #e4c97a;
  --gold-dim: #7a6430;
  --text: #e8dcc8;
  --text-dim: #8a7d68;
  --text-muted: #534a3f;
  --correct: #4a9b6f;
  --correct-bg: #1a3328;
  --wrong: #9b4a4a;
  --wrong-bg: #331a1a;
  --accent: #b87333;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
}
.header-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 1.1rem;
  color: var(--gold);
  letter-spacing: .12em;
}
.header-sub {
  font-size: .7rem;
  color: var(--text-dim);
  margin-top: 2px;
  letter-spacing: .08em;
}
.header-stats {
  font-size: .75rem;
  color: var(--text-dim);
  text-align: right;
}
.header-stats span { color: var(--gold); font-weight: 600; }

/* Layout */
.app {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 53px);
}

/* Sidebar */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.filter-section { display: flex; flex-direction: column; gap: 8px; }
.filter-label {
  font-size: .65rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--gold-dim);
  font-weight: 600;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* Chapter buttons */
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.chapter-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: .7rem;
  padding: 5px 2px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
}
.chapter-btn:hover { border-color: var(--gold-dim); color: var(--text); }
.chapter-btn.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold-light);
  font-weight: 600;
}
.chapter-select-btns {
  display: flex; gap: 4px;
}
.small-btn {
  flex: 1;
  font-size: .65rem;
  padding: 4px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 3px;
  cursor: pointer;
  transition: all .15s;
  font-family: 'Noto Sans JP', sans-serif;
}
.small-btn:hover { border-color: var(--gold-dim); color: var(--text); }

/* Page range */
.range-inputs {
  display: flex; align-items: center; gap: 6px;
}
.range-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: .8rem;
  padding: 5px 8px;
  border-radius: 4px;
  font-family: 'Noto Sans JP', sans-serif;
  outline: none;
  transition: border-color .15s;
  width: 60px;
}
.range-input:focus { border-color: var(--gold-dim); }
.range-sep { color: var(--text-muted); font-size: .8rem; }

/* Importance */
.imp-grid {
  display: flex; gap: 4px;
}
.imp-btn {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: .8rem;
  padding: 5px 2px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .15s;
  font-family: 'Noto Sans JP', sans-serif;
}
.imp-btn:hover { border-color: var(--gold-dim); }
.imp-btn.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold-light);
  font-weight: 600;
}

/* Mode */
.mode-btns { display: flex; gap: 4px; }
.mode-btn {
  flex: 1;
  padding: 6px;
  font-size: .72rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  transition: all .15s;
  font-family: 'Noto Sans JP', sans-serif;
  text-align: center;
}
.mode-btn.active {
  background: rgba(201,168,76,.15);
  border-color: var(--gold);
  color: var(--gold);
}

/* Start button */
.start-btn {
  background: linear-gradient(135deg, var(--gold-dim), var(--accent));
  border: none;
  color: var(--gold-light);
  font-family: 'Shippori Mincho', serif;
  font-size: .9rem;
  letter-spacing: .1em;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
  width: 100%;
  margin-top: 4px;
}
.start-btn:hover { opacity: .85; transform: translateY(-1px); }
.start-btn:active { transform: translateY(0); }

.question-count-preview {
  text-align: center;
  font-size: .72rem;
  color: var(--text-muted);
  margin-top: -8px;
}
.question-count-preview span { color: var(--gold); }

/* Main area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
}

/* Start screen */
.start-screen {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.start-screen .big-icon {
  font-size: 3rem;
  margin-bottom: 8px;
}
.start-screen h2 {
  font-family: 'Shippori Mincho', serif;
  font-size: 1.4rem;
  color: var(--gold);
  letter-spacing: .1em;
}
.start-screen p {
  font-size: .85rem;
  color: var(--text-dim);
  max-width: 280px;
  line-height: 1.7;
}

/* Progress bar */
.progress-area {
  width: 100%;
  max-width: 640px;
  margin-bottom: 16px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: .75rem;
  color: var(--text-dim);
}
.progress-info .pos { color: var(--text); font-weight: 500; }
.progress-bar-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 2px;
  transition: width .3s ease;
}

/* Score mini */
.score-mini {
  display: flex; gap: 12px;
  font-size: .75rem;
}
.score-o { color: var(--correct); }
.score-x { color: var(--wrong); }

/* Flashcard */
.card-scene {
  width: 100%;
  max-width: 640px;
  height: 260px;
  perspective: 1000px;
  cursor: pointer;
  margin-bottom: 20px;
}
.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .45s cubic-bezier(.4,0,.2,1);
}
.card-scene.flipped .card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  inset: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 32px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card-back {
  transform: rotateY(180deg);
  background: var(--surface2);
  border-color: var(--gold-dim);
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.card-chapter-tag {
  font-size: .65rem;
  letter-spacing: .12em;
  color: var(--text-muted);
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.card-imp {
  display: flex; gap: 2px;
}
.imp-star {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
}
.imp-star.filled { background: var(--gold); }

.card-question {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.05rem;
  line-height: 1.8;
  color: var(--text);
  flex: 1;
  display: flex;
  align-items: center;
}
.card-answer {
  font-family: 'Shippori Mincho', serif;
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--gold-light);
  text-align: center;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: .05em;
}
.card-hint {
  font-size: .7rem;
  color: var(--text-muted);
  text-align: right;
}
.card-page {
  font-size: .65rem;
  color: var(--text-muted);
}

/* Answer buttons */
.answer-btns {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 640px;
}
.ans-btn {
  flex: 1;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .05em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.ans-btn:disabled { opacity: .4; cursor: default; }
.ans-btn-o {
  background: var(--correct-bg);
  border-color: var(--correct);
  color: var(--correct);
}
.ans-btn-o:hover:not(:disabled) { background: var(--correct); color: #fff; }
.ans-btn-x {
  background: var(--wrong-bg);
  border-color: var(--wrong);
  color: var(--wrong);
}
.ans-btn-x:hover:not(:disabled) { background: var(--wrong); color: #fff; }
.ans-btn-skip {
  flex: .5;
  background: var(--surface2);
  border-color: var(--border);
  color: var(--text-muted);
  font-size: .8rem;
}
.ans-btn-skip:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text); }

/* Result screen */
.result-screen {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
  max-width: 480px;
}
.result-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 1.6rem;
  color: var(--gold);
  letter-spacing: .1em;
}
.result-score-circle {
  width: 140px; height: 140px;
  border-radius: 50%;
  border: 3px solid var(--gold-dim);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--surface);
}
.result-pct {
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--gold-light);
  font-family: 'Shippori Mincho', serif;
}
.result-pct-label {
  font-size: .7rem;
  color: var(--text-muted);
  letter-spacing: .1em;
}
.result-details {
  display: flex; gap: 32px;
}
.result-detail { text-align: center; }
.result-detail .num {
  font-size: 1.8rem;
  font-weight: 700;
  font-family: 'Shippori Mincho', serif;
}
.result-detail .lbl {
  font-size: .7rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.result-detail.o .num { color: var(--correct); }
.result-detail.x .num { color: var(--wrong); }
.result-detail.skip .num { color: var(--text-dim); }

.result-btns {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
}
.result-btn {
  padding: 9px 20px;
  border-radius: 6px;
  font-size: .82rem;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .04em;
}
.result-btn-primary {
  background: linear-gradient(135deg, var(--gold-dim), var(--accent));
  border: none;
  color: var(--gold-light);
  font-weight: 600;
}
.result-btn-primary:hover { opacity: .85; }
.result-btn-secondary {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.result-btn-secondary:hover { border-color: var(--gold-dim); color: var(--text); }

/* Flip hint */
.flip-hint {
  font-size: .68rem;
  color: var(--text-muted);
  margin-top: -8px;
  letter-spacing: .08em;
}

/* scroll */
.sidebar::-webkit-scrollbar-thumb { background: var(--surface2); }

/* Responsive */
@media (max-width: 600px) {
  .sidebar { width: 220px; min-width: 220px; }
  .card-scene { height: 220px; }
  .card-answer { font-size: 1.3rem; }
  .card-question { font-size: .95rem; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">世界史 一問一答</div>
    <div class="header-sub">WORLD HISTORY FLASHCARDS</div>
  </div>
  <div class="header-stats" id="headerStats">
    全 <span>4706</span> 問
  </div>
</div>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">

    <div class="filter-section">
      <div class="filter-label">章を選択</div>
      <div class="chapter-select-btns">
        <button class="small-btn" onclick="selectAllChapters()">全選択</button>
        <button class="small-btn" onclick="clearChapters()">クリア</button>
      </div>
      <div class="chapter-grid" id="chapterGrid"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">ページ範囲</div>
      <div class="range-inputs">
        <input type="number" class="range-input" id="pageMin" placeholder="2" min="2" max="393" value="">
        <span class="range-sep">〜</span>
        <input type="number" class="range-input" id="pageMax" placeholder="393" min="2" max="393" value="">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-label">重要度（複数可）</div>
      <div class="imp-grid" id="impGrid"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">出題モード</div>
      <div class="mode-btns">
        <button class="mode-btn active" id="modeSeq" onclick="setMode('seq')">順番通り</button>
        <button class="mode-btn" id="modeShuffle" onclick="setMode('shuffle')">ランダム</button>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-label">出題方向</div>
      <div class="mode-btns">
        <button class="mode-btn active" id="dirQA" onclick="setDir('qa')">問→答</button>
        <button class="mode-btn" id="dirAQ" onclick="setDir('aq')">答→問</button>
      </div>
    </div>

    <div>
      <div class="question-count-preview" id="countPreview">対象: <span id="countNum">0</span> 問</div>
      <br>
      <button class="start-btn" onclick="startSession()">▶ 開始する</button>
    </div>

  </div>

  <!-- Main -->
  <div class="main" id="mainArea">
    <div class="start-screen">
      <div class="big-icon">📖</div>
      <h2>学習をはじめましょう</h2>
      <p>左のパネルで章・ページ・重要度を設定し、「開始する」ボタンを押してください。</p>
    </div>
  </div>
</div>

<script>
const RAW = [["00", 2, "文字の発明以前の時代を、歴史時代に対して何というか。", "先史時代", 6], ["00", 2, "化石人類のうち、直立二足歩行をしていたと推定される、約700万年前に出現した初期の人類を何と総称するか。", "猿人", 6], ["00", 2, "猿人のうち、半樹上生活ではあるが、地上では直立二足歩行をしていた、中央アフリカのチャドで発見された現在最古と考えられる700万～600万年前の化石人類は何か。", "サヘラントロプス", 5], ["00", 2, "猿人のうち、エチオピアで発見された、約440万年前に現れたとされる化石人類は何か。", "ラミダス猿人", 3], ["00", 2, "猿人のうち、南・東アフリカで発見された、約420万年前に出現した「南のサル」を意味する化石人類は何か。", "アウストラロピテクス", 3], ["00", 2, "猿人が用いたもっとも原始的な打製石器を何と呼ぶか。", "礫石器", 3], ["00", 2, "人類が打製石器や骨角器を道具として、狩猟・採集を中心に生活を営んだ、約250万～約1万3000年前の石器時代前期を何と呼ぶか。", "旧石器時代", 6], ["00", 2, "約240万年前に出現した、猿人よりも発達した知力をもつ化石人類を何と総称するか。", "原人", 6], ["00", 2, "猿人と原人の中間に位置し、東アフリカで発見された、「器用な人」を意味する、240万～180万年前頃の化石人類は何か。", "ホモ＝ハビリス", 3], ["00", 2, "180万～20万年前に東アフリカに現れ、ユーラシア大陸に拡散した原人の学名は何か。", "ホモ＝エレクトゥス", 5], ["00", 2, "原人のうち、19世紀末、オランダ人のデュボワがジャワ島のトリニールで発見した化石人類は何か。", "ジャワ原人", 5], ["00", 2, "原人のうち、1920～30年代に中国の周口店で発見され、火の使用が確認されている化石人類は何か。", "北京原人", 6], ["00", 2, "原人が木を伐ったり削ったりするために用いた、全体を整形した打製石器を何と呼ぶか。", "ハンドアックス（握斧）", 6], ["00", 2, "約60万年前に出現したと推定され、原人より発達した知力をもつ、旧大陸各地から出土している化石人類を何と総称するか。", "旧人", 6], ["00", 3, "旧人のうち、19世紀半ばにドイツのある渓谷で発見された、ヨーロッパから中央アジアおよび西アジア一帯に分布していた化石人類は何か。", "ネアンデルタール人", 6], ["00", 3, "ネアンデルタール人の発掘によって確認された、宗教的行為あるいは精神文化とは何か。", "埋葬の習慣", 6], ["00", 3, "ネアンデルタール人が肉を切ったり、骨を削いだりするために用いた打製石器は何か。", "剝片石器", 6], ["00", 3, "約20万年前にアフリカに出現し、5万年前頃から世界各地に広がった、現生人類（ホモ＝サピエンス）に属する化石人類を何と総称するか。", "新人", 7], ["00", 3, "新人のうち、4万2000年ほど前に現れ、南西フランスで発見された現生人類の名称は何か。", "クロマニョン人", 6], ["00", 3, "新人のうち、3万5000年前に現れ、中国の北京郊外で発見された現生人類の名称は何か。", "周口店上洞人", 5], ["00", 3, "新人のうち、2万5000年前に現れ、イタリア領地中海沿岸の洞穴群でみつかった現生人類の名称は何か。", "グリマルディ人", 2], ["00", 3, "新人が出現した旧石器時代後期から、動物の骨や角で製作し、銛・槍・針などに使われはじめた道具は何か。", "骨角器", 6], ["00", 3, "新人らが残した、旧石器時代後期の洞穴絵画で知られる、1940年に南西フランスで発見された遺跡の名称は何か。", "ラスコー", 7], ["00", 3, "新人らが残した、旧石器時代後期の洞穴絵画で知られる、1879年にスペイン北部で発見された遺跡の名称は何か。", "アルタミラ", 4], ["00", 3, "旧石器時代後期につくられた、多産や豊作を祈るためと考えられる、小さな石のヴィーナス像を何と呼ぶか。", "女性裸像", 2], ["00", 3, "旧石器時代と新石器時代との中間の文化段階で、考古学的には細石器の使用を指標とする時代を何と呼ぶか。", "中石器時代", 1], ["00", 3, "中石器時代から新石器時代の初め、矢・ナイフ・鎌などの刃として使用された、小型の剝片石器を何と呼ぶか。", "細石器", 3], ["00", 4, "新生代後期のうち、約260万年前から約1万1700年ほど前までの氷河時代を、地質学上では何と呼ぶか。", "更新世", 4], ["00", 4, "新生代末期（約1万1700年前）から現在までの、温暖化した後氷期を、地質学上では何と呼ぶか。", "完新世", 2], ["00", 4, "19世紀に興隆した、皮膚色などの身体的特徴から人類を区分した分類のことで、生物学的根拠がなく、今日では差別意識の原因ともなっている集団概念を何と呼ぶか。", "人種", 5], ["00", 4, "人間の話す言語や風俗、政治・経済の形態や同属意識など、おもに帰属する文化によって分類した集団概念を何と呼ぶか。", "民族", 7], ["00", 4, "人類を同系統の言語を話す人々で分類・設定した集団概念を何と呼ぶか。", "語族", 6], ["00", 4, "ヨーロッパのゲルマン語派・イタリック語派や、アジアのインド＝イラン語派などを含む一大語群を、何と総称するか。", "インド＝ヨーロッパ語族", 4], ["00", 4, "アジア地域に広がるトルコ語・モンゴル語・ツングース語などを話す人々の語群を何と総称するか。", "アルタイ語族", 3], ["00", 4, "西アジアから北アフリカ地域に分布するセム語派やエジプト語派などの語群を何と総称するか。", "アフロ＝アジア語族", 4], ["01", 6, "棒や簡単な武器を用いて鳥獣・魚類・植物などを食料として手に入れる、旧石器時代の食料獲得方法とは何か。", "狩猟・採集", 6], ["01", 6, "約1万年前に氷期が終わり、地球が温暖化するなか、約9000年前の西アジアで開始された、画期的な食料生産方法とは何か。", "農耕・牧畜", 6], ["01", 6, "イラク東北部のジャルモとならんで最古の初期農耕集落とされる、パレスチナのヨルダン川西岸で発見された遺跡の名は何か。", "イェリコ", 1], ["01", 6, "農耕・牧畜開始以前の、人類が食料として自然界の鳥獣・魚類・植物などを手に入れて営む経済活動を何と呼ぶか。", "獲得経済", 5], ["01", 6, "農耕・牧畜開始以降の、人類が食料など生活に必要なものをつくり出す経済活動を何というか。", "生産経済", 5], ["01", 6, "農耕・牧畜の開始にともなう人類史上の一大変革を何というか。", "食料生産革命（新石器革命）", 2], ["01", 6, "農耕の開始とともに発達した、石臼・石斧などの、砂や砥石を使って表面を磨いた石器を何というか。", "磨製石器", 6], ["01", 6, "約9000年前から、人類が道具として磨製石器を使用した時代を何と呼ぶか。", "新石器時代", 6], ["01", 6, "メソポタミアをはじめ各地でつくられた、顔料で模様を施した土器を何と呼ぶか。", "彩文土器", 6], ["01", 6, "自然の雨水に頼る、初期の農法を何と呼ぶか。", "乾地農法", 2], ["01", 7, "村落から都市の成立に向かう頃、水を人工的に供給する農業が開始された。この農業を何と呼ぶか。", "灌漑農業", 5], ["01", 7, "約6000年前から、西アジア・ヨーロッパ・インド・中国などで製作・使用されはじめた、銅と錫の合金である金属器は何か。", "青銅器", 4], ["01", 7, "金属器時代、貧富の差や職業分化によって、人々のあいだに形成された上下区分を何と呼ぶか。", "階級", 3], ["01", 7, "金属器時代、支配階級の居住する都市が周辺地域を支配する、最初の国家形態が生まれたが、これを何と呼ぶか。", "都市国家", 5], ["01", 7, "国家の成立とほぼ同じ頃、人類が言語を記録するために発明したものは何か。", "文字", 6], ["01", 7, "文字の登場以降の、文字史料によって歴史を研究することができる時代を何と呼ぶか。", "歴史時代", 6], ["01", 7, "千年を単位とした時代の区画法を何と呼ぶか。", "千年紀", 4], ["01", 8, "ラテン語で「日の昇るところ」を意味し、西アジアからエジプトにかけての地域を指す言葉は何か。", "オリエント", 5], ["01", 8, "「川のあいだの土地」を意味する、北のティグリス川と南のユーフラテス川との流域を指す言葉は何か。", "メソポタミア", 7], ["01", 8, "メソポタミアからシリア・パレスチナに至る、農耕文明が早くから成立した地帯を何と呼ぶか。", "「肥沃な三日月地帯」", 6], ["01", 8, "古代オリエントで話されたアッカド語・アラム語・ヘブライ語や、今日のアラビア語を話す人々は、言語分類上、何語系の民族と呼ばれるか。", "セム語系", 4], ["01", 8, "古代文明に多くみられる、神の権威を借りておこなわれた政治を何と呼ぶか。", "神権政治", 5], ["01", 8, "民族系統は不詳だが、メソポタミア南部に最古の文明を築いた人々の名称は何か。", "シュメール人", 7], ["01", 8, "シュメール人がユーフラテス川下流域に建設し、王墓が発見された都市国家遺跡はどこか。", "ウル", 6], ["01", 8, "戦争や貢納の場面を表したとみられるモザイクがほどこされている、ウルから出土した箱状の工芸品は何か。", "ウルのスタンダード", 2], ["01", 8, "ウルの遺跡の上流部に位置し、最初の文字記録が発見されたシュメール人の都市国家遺跡はどこか。", "ウルク", 6], ["01", 8, "ウルの遺跡の北方、ティグリス川河口近くのシュメール人の都市国家遺跡はどこか。", "ラガシュ", 3], ["01", 8, "古代メソポタミアの都市国家で建設された、煉瓦でつくられ、基壇の上に神殿が建っていた聖塔を何と呼ぶか。", "ジッグラト", 6], ["01", 8, "シュメール人の都市国家を征服し、前24世紀頃にメソポタミア最初の統一国家を建てたセム語系の人々の名称は何か。", "アッカド人", 6], ["01", 8, "前24世紀頃、メソポタミア最初の統一国家であるアッカド王国を建てた王は誰か。", "サルゴン（1世）", 3], ["01", 9, "前22世紀末～前21世紀末、アッカド人を追放して、シュメール人が建てた最後の王朝を何と呼ぶか。", "ウル第3王朝", 6], ["01", 9, "前19世紀初めにセム語系遊牧民がユーフラテス川中流域を中心に建てた王朝は何か。", "バビロン第1王朝", 7], ["01", 9, "メソポタミアに進出し、前19世紀初めにバビロン第1王朝を建てたセム語系遊牧民は何か。", "アムル人", 6], ["01", 9, "マルドゥクを守護神とし、前19世紀以降、メソポタミアの中心として栄えた都市はどこか。", "バビロン", 5], ["01", 9, "前18世紀前半に全メソポタミアを統一し、運河を含む交通網を整備し商業を発展させた、バビロン第1王朝第6代の王は誰か。", "ハンムラビ王", 7], ["01", 9, "ハンムラビ王がシュメール法などを継承して集大成した、楔形文字で石碑に刻まれた282条の法典の名称は何か。", "ハンムラビ法典", 7], ["01", 9, "ハンムラビ法典の刑法は（同害）復讐法と身分法を特色とする。この（同害）復讐法の原則を表す有名な成句は何か。", "「目には目を、歯には歯を」", 4], ["01", 9, "前17世紀半ば頃アナトリアに王国を建て、はじめて鉄器を本格的に使用し、バビロン第1王朝を滅ぼしたインド＝ヨーロッパ語系の民族は何か。", "ヒッタイト人", 6], ["01", 9, "ザグロス山脈方面から南メソポタミアに侵入し、前16世紀にバビロン第3王朝を建てたが、前12世紀にエラム人によって滅ぼされた、民族系統不明の民族は何か。", "カッシート人", 5], ["01", 9, "前2千年紀後半に成立して、北メソポタミアからシリアを制圧して栄えた、住民の多くをフルリ人が占めていた王国の名称は何か。", "ミタンニ王国", 5], ["01", 9, "シュメール人が粘土板に刻んだ文字は何か。", "楔形文字", 7], ["01", 9, "シュメール人が発明した、天文学・角度・時間の単位となった記数法は何か。", "六十進法", 7], ["01", 10, "シュメールに始まり、古代メソポタミアで広く用いられた、月の満ち欠けの周期を基準とする暦は何か。", "太陰暦", 7], ["01", 10, "古代メソポタミアなどで用いられた、太陰暦を基本に、月の満ち欠けと太陽の運行を組み合わせ、閏月を挿入して、季節とのずれを解消した暦は何か。", "太陰太陽暦", 4], ["01", 10, "ノアの洪水伝説の原型とされ、ウルクの王を題材とした古代メソポタミアの伝説的叙事詩は何か。", "『ギルガメシュ叙事詩』", 3], ["01", 10, "シュメールに始まり、バビロニアで盛んとなった、天体の運行から様々な事象を説明しようとする考え（術）は何か。", "占星術", 3], ["01", 10, "古代ギリシアの歴史家ヘロドトスがその著書『歴史』に書いた、古代エジプトの繁栄を表現した言葉は何か。", "「エジプトはナイルのたまもの」", 6], ["01", 10, "統一以前の各地の集落群をもとに形成されたと考えられている古代エジプトの地方行政単位を何と呼ぶか。", "ノモス", 1], ["01", 10, "もとは「大きな家」を意味し、太陽神ラーの子とされる、古代エジプトの王の称号を何と呼ぶか。", "ファラオ", 7], ["01", 10, "前27～前22世紀の古代エジプトの第3～6王朝期を何時代と呼ぶか。", "古王国時代", 6], ["01", 10, "ナイル川デルタの南端にある古王国時代の都はどこか。", "メンフィス", 6], ["01", 10, "古王国時代に多く建設された、王の権威を象徴する石造建築物は何か。", "ピラミッド", 7], ["01", 10, "ギザに最大のピラミッドを建設させた、第4王朝の王は誰か。", "クフ王", 5], ["01", 10, "ピラミッドの入口におかれた、人頭獣身の石像は何か。", "スフィンクス", 5], ["01", 10, "前21～前18世紀の古代エジプトの第11～12王朝期を何時代と呼ぶか。", "中王国時代", 6], ["01", 10, "ナイル川中流東岸にある中王国時代とのちの新王国時代の都はどこか。", "テーベ", 6], ["01", 11, "中王国末期にシリア方面から流入し、その滅亡後に下エジプトを支配したアジア系民族を何と呼ぶか。", "ヒクソス", 6], ["01", 11, "前16世紀前半～前11世紀前半の古代エジプトの第18～20王朝期を何時代と呼ぶか。", "新王国時代", 6], ["01", 11, "前14世紀にテーベの守護神アメン（アモン）を奉じる神官団をおさえるため、唯一神アテン（アトン）の信仰を強制する宗教改革をおこなった、第18王朝の王は誰か。", "アメンヘテプ4世（アクエンアテン）", 6], ["01", 11, "アメンヘテプ4世の時に遷都されて都となったが、この王の死後放棄された都市はどこか。", "テル＝エル＝アマルナ", 6], ["01", 11, "アメンヘテプ4世の時代の、写実的な芸術を何と呼ぶか。", "アマルナ美術", 4], ["01", 11, "美しく彩色されたアマルナ美術の彫像で知られる、アメンヘテプ4世の妃は誰か。", "ネフェルティティ", 4], ["01", 11, "多数の神殿を建設し、対外的にはシリアやナイル川上流のヌビアなどに領土を拡大して、大王と称された新王国時代の王は誰か。", "ラメス（ラメセス）2世", 2], ["01", 11, "ラメス2世が、前13世紀前半にヒッタイトと戦った場所はシリアのどこか。", "カデシュ", 2], ["01", 11, "古代エジプトの主神である太陽神を何と呼ぶか。", "ラー", 6], ["01", 11, "テーベの都市神が、太陽神と結合して新王国時代に広く普及した神の名称は何か。", "アメン（アモン）＝ラー", 6], ["01", 11, "古代エジプト人が霊魂不滅を信じて、加工保存した遺体を何と呼ぶか。", "ミイラ", 6], ["01", 11, "人間の死後の世界をつかさどり、冥界の王とみなされ、死後の審判をおこなうとされた神の名称は何か。", "オシリス", 7], ["01", 11, "古代エジプト人が、死後の世界の案内書として、オシリスの審判を受けるために必要な呪文を記した副葬品は何か。", "「死者の書」", 7], ["01", 11, "ヒエログリフと称される、神殿・墓などに刻まれたエジプトの象形文字を何と呼ぶか。", "神聖文字", 7], ["01", 12, "神聖文字を簡略化し、宗教文書・行政文書・文学作品に用いられた文字を何と呼ぶか。", "神官文字（ヒエラティック）", 2], ["01", 12, "神官文字をさらに簡略化した文字を何と呼ぶか。", "民用文字（デモティック）", 5], ["01", 12, "古代エジプトで使用された、カヤツリ草を材料とした一種の紙のことを何と呼ぶか。", "パピルス", 7], ["01", 12, "ナイル川の氾濫後、荒れた土地をもと通りに区画するため、古代エジプトで発達した技術とは何か。", "測地術", 5], ["01", 12, "エジプト人が用いた、ナイル川の氾濫の規則性から考案されたとされる暦は何か。" ドロスの死後、「後継者」をめざして分立・抗争した部下の有力者たちは何と呼ばれたか。", "ディアドコイ", 5], ["04", 71, "大帝国の分裂後、アレクサンドロスの部下の孫が建てたマケドニア王国の王朝名は何か。", "アンティゴノス朝", 5], ["04", 71, "大帝国の分裂後、アレクサンドロスの部下の1人が建てたシリア王国の王朝名は何か。", "セレウコス朝", 6], ["04", 71, "大帝国の分裂後、アレクサンドロスの部下の1人が建てたエジプト王国の王朝名は何か。", "プトレマイオス朝", 6], ["04", 71, "プトレマイオス朝の都で、ヘレニズム世界の中心として栄えた、ナイル川河口の都市はどこか。", "アレクサンドリア", 6], ["04", 72, "前334年のアレクサンドロスの東方遠征開始から、プトレマイオス朝の滅亡までの約300年間を何時代と呼ぶか。", "ヘレニズム時代", 6], ["04", 72, "前3世紀半ば、アム川上流域でセレウコス朝のもとから自立した、ギリシア系住民の建てた王国は何か。", "バクトリア", 4], ["04", 72, "前3世紀半ば、イラン高原でセレウコス朝のもとから自立した、イラン系遊牧民の建てた王国は何か。", "パルティア", 3], ["04", 72, "ギリシア神話の中心となった、主神ゼウスをはじめとする12神は何と総称されるか。", "オリンポス12神", 7], ["04", 72, "ギリシア人の同胞意識の1つにもなっている、二大叙事詩の作者または編者とされる詩人は誰か。", "ホメロス", 6], ["04", 72, "トロイア戦争における英雄の活躍を描いた、ホメロスの叙事詩は何か。", "『イリアス』", 5], ["04", 72, "トロイア戦争を勝利に導いた知将の、トロイア攻略後の冒険などを描いた、ホメロスの叙事詩は何か。", "『オデュッセイア』", 5], ["04", 72, "『労働と日々』で、実際の農業の様子を描き、勤労の大切さを説いた詩人は誰か。", "ヘシオドス", 4], ["04", 72, "ヘシオドスが、神々の系譜を語った叙事詩は何か。", "『神統記』", 4], ["04", 72, "レスボス島出身の、前7世紀末～前6世紀の女性叙情詩人は誰か。", "サッフォー", 5], ["04", 72, "オリンピアなどの競技会の優勝者をたたえる祝勝歌を多く残した、前6～前5世紀の叙情詩人は誰か。", "ピンダロス", 2], ["04", 72, "前6世紀、イオニア地方のミレトスを中心におこった、自然現象を合理的に解釈しようとした哲学を何と呼ぶか。", "イオニア自然哲学", 6], ["04", 72, "「哲学の父」と称される、万物の根源を「水」と考え、また日食を予言したとされる哲学者は誰か。", "タレス", 6], ["04", 72, "万物の根源を「数」とした哲学者・数学者は誰か。", "ピタゴラス", 6], ["04", 73, "「万物は流転する」の言葉を残し、「火」を変化の象徴とした哲学者は誰か。", "ヘラクレイトス", 3], ["04", 73, "万物の根源を等質不変の「原子（アトム）」と主張した哲学者は誰か。", "デモクリトス", 4], ["04", 73, "代表作『アガメムノン』を著した、アテネ三大悲劇詩人の1人は誰か。", "アイスキュロス", 6], ["04", 73, "代表作『オイディプス王』を著した、アテネ三大悲劇詩人の1人は誰か。", "ソフォクレス", 6], ["04", 73, "代表作『メデイア』を著した、アテネ三大悲劇詩人の1人は誰か。", "エウリピデス", 6], ["04", 73, "ペロポネソス戦争期に活躍し、『女の平和』などの作品を残した、アテネ最大の喜劇作家は誰か。", "アリストファネス", 6], ["04", 73, "前5世紀の民主政最盛期のアテネで活躍した、弁論・修辞の職業教師を何と呼ぶか。", "ソフィスト", 6], ["04", 73, "「万物の尺度は人間」といった言葉を残したソフィストの代表的な人物は誰か。", "プロタゴラス", 6], ["04", 73, "問答法を通じて「無知の知」を自覚させる方法を実践し、普遍的真理の存在を説いた哲学者は誰か。", "ソクラテス", 7], ["04", 73, "ソクラテスの弟子で、真に存在するのは善や美というイデアであると説いた哲学者は誰か。", "プラトン", 7], ["04", 73, "哲人政治を理想とした、プラトンの主著は何か。", "『国家』", 3], ["04", 73, "プラトンの弟子で、諸学の集大成者として「万学の祖」と呼ばれ、後世に大きな影響を及ぼした哲学者は誰か。", "アリストテレス", 7], ["04", 73, "アナトリア出身で、病気の原因を科学的に究明し、「西洋医学の祖」と呼ばれる人物は誰か。", "ヒッポクラテス", 5], ["04", 73, "アナトリア出身で、ペルシア戦争を物語的に叙述し、『歴史』を著して「歴史の父」と呼ばれる人物は誰か。", "ヘロドトス", 6], ["04", 73, "ペロポネソス戦争を史料批判にもとづいた『歴史』に著した、アテネ出身の歴史家は誰か。", "トゥキディデス", 6], ["04", 74, "ペリクレスによって再建された、アテネのアクロポリスにあるアテナ女神神殿は一般に何と呼ばれるか。", "パルテノン神殿", 7], ["04", 74, "荘重な印象を与える、パルテノン神殿の建築様式は何か。", "ドーリア式", 2], ["04", 74, "ペリクレスと親交があり、パルテノン神殿再建工事の総監督で、「アテナ女神像」をつくった彫刻家は誰か。", "フェイディアス", 4], ["04", 74, "前4世紀のアテネの彫刻家で、「ヘルメス神像」など人間美を追求した作品を残したとされるのは誰か。", "プラクシテレス", 2], ["04", 74, "柱頭に渦巻装飾がつけられ、優雅な印象を与える、ギリシア中期の建築様式名は何か。", "イオニア式", 2], ["04", 74, "柱は細く、装飾も複雑化して華麗・繊細な印象を与える、ギリシア後期の建築様式名は何か。", "コリント式", 2], ["04", 74, "前334年のアレクサンドロスの東方遠征以降成立した、オリエント的要素とギリシア的要素の融合した文化を何と呼ぶか。", "ヘレニズム文化", 7], ["04", 74, "ポリス社会の枠をこえた、より普遍的かつ個人主義的な傾向をもつヘレニズムの考え方を何と呼ぶか。", "世界市民主義（コスモポリタニズム）", 6], ["04", 74, "精神的な快楽を得ることを重視した哲学者の名前に由来する、ヘレニズム哲学の一派を何と呼ぶか。", "エピクロス派", 6], ["04", 74, "禁欲による幸福の追求と、理性によって生きることの大切さを説いた、ヘレニズム哲学の一派を何と呼ぶか。", "ストア派", 6], ["04", 74, "ストア派の創始者は誰か。", "ゼノン", 5], ["04", 74, "ヘレニズム世界で広範に使用された共通ギリシア語は何と呼ばれるか。", "コイネー", 4], ["04", 74, "エジプトのアレクサンドリアに開設され、自然科学研究の中心となった王立研究所は何と呼ばれるか。", "ムセイオン", 6], ["04", 74, "ムセイオンで学び、平面幾何学を大成したギリシアの数学者は誰か。", "エウクレイデス", 6], ["04", 74, "ムセイオンで学び、浮力の原理を発見した、シチリア島のシラクサ出身の数学・物理学者は誰か。", "アルキメデス", 6], ["04", 75, "ムセイオンの館長をつとめ、地球の周囲の長さを計測した、北アフリカ出身のギリシア人天文学者は誰か。", "エラトステネス", 5], ["04", 75, "地球の自転と公転（太陽中心説・地動説）を主張した、ギリシア出身の天文学者は誰か。", "アリスタルコス", 5], ["04", 75, "1820年にミロス（ミロ）島で発見された、美の女神の大理石像の名称は何か。", "「ミロのヴィーナス」", 6], ["04", 75, "1506年にローマで発見された、トロイアの神官を主題とする、ヘレニズム時代の代表的彫刻の名称は何か。", "「ラオコーン」", 4], ["04", 75, "ギリシア人の南下とほぼ並行して、イタリア半島に南下したインド＝ヨーロッパ語系の人々を何と呼ぶか。", "イタリア人（古代イタリア人）", 4], ["04", 75, "南下したイタリア人（古代イタリア人）のうち、前8世紀に都市国家ローマを建設したとされる人々を何と呼ぶか。", "ラテン人", 6], ["04", 75, "都市国家ローマの象徴で、市内を流れる川は何か。", "ティベル川", 4], ["04", 75, "トスカナ地方に定住し、前7世紀末にローマを支配した、系統不明のイタリア半島の先住民は何と呼ばれるか。", "エトルリア人", 6], ["04", 75, "前509年、エトルリア人の王を追放して、貴族が実権を握り公職を独占したと伝えられる、世襲の君主を戴かない政治形態は何か。", "共和政", 7], ["04", 75, "共和政の要職を独占した、完全な市民権をもつ大土地所有者であるローマの貴族を何というか。", "パトリキ", 6], ["04", 75, "中小土地所有農民と商工業者からなり、パトリキに対して身分闘争を展開したローマの平民を何というか。", "プレブス", 7], ["04", 76, "任期終身の300人の貴族で構成された、ローマ共和政最高の諮問機関を何と呼ぶか。", "元老院", 7], ["04", 76, "2名で構成され、任期1年で無給の、行政・軍事を担当した最高公職者は何と呼ばれたか。", "コンスル（執政官・統領）", 7], ["04", 76, "平民たちで構成され、ローマ軍の中心となった歩兵は何と呼ばれるか。", "重装歩兵", 6], ["04", 76, "民会の1つで、前5世紀前半に開設され、平民のみで構成された議決機関を何と呼ぶか。", "平民会", 6], ["04", 76, "伝承では前494年の設置とされる、平民会で選出された、平民保護のための官職を何と呼ぶか。", "護民官", 6], ["04", 76, "貴族に対する平民の闘争のなか、前5世紀半ばに旧来の慣習法を明文化し、公開したローマ最古の成文法は何か。", "十二表法", 6], ["04", 76, "前367年、コンスルの1人を平民から選出することを制定した法は何か。", "リキニウス・セクスティウス法", 6], ["04", 76, "前287年、平民会の決議は元老院の承認がなくとも国法とされることを定めた法は何か。", "ホルテンシウス法", 6], ["04", 76, "元老院の提案でコンスルが1人を指名し、非常時に6カ月の任期で全権を委任された官職を何というか。", "独裁官（ディクタトル）", 7], ["04", 76, "征服したイタリア半島の諸都市を支配するために、ローマが用いた統治方法を何というか。", "分割統治", 5], ["04", 76, "分割統治のうち、占領した地域にローマ市民を移住させて建設した都市は何か。", "植民市", 2], ["04", 76, "分割統治のうち、軍事援助の義務を負わされ、市民権が与えられなかった都市は何か。", "同盟市", 2], ["04", 76, "前9世紀にフェニキア人が北アフリカに建てた植民市で、西地中海交易を独占して繁栄した海洋国家は何か。", "カルタゴ", 7], ["04", 76, "前264年からの、西地中海の覇権をめぐるカルタゴとローマとの3回にわたる戦争を何と呼ぶか。", "ポエニ戦争", 6], ["04", 77, "当時、西地中海最大の穀物生産地で、カルタゴとローマとの第1回ポエニ戦争の原因となった島はどこか。", "シチリア島", 5], ["04", 77, "第1回ポエニ戦争の結果、ローマがシチリア島を獲得した。こうしたイタリア半島以外の征服地をローマは何と呼んだか。", "属州", 7], ["04", 77, "第2回ポエニ戦争の際、現在のスペインから出発し、カンネーの戦いでローマ軍に大勝したカルタゴの将軍は誰か。", "ハンニバル", 6], ["04", 77, "前202年、カルタゴの本拠地を襲い、カルタゴ軍に圧勝して第2回ポエニ戦争をローマの勝利に導いた将軍は誰か。", "スキピオ", 5], ["04", 77, "第2回ポエニ戦争で、スキピオがカルタゴ軍を破った戦いは何と呼ばれるか。", "ザマの戦い", 2], ["04", 77, "属州の徴税請負や土木事業などで台頭し、元老院貴族につぐ階層身分とされた新興富裕市民を何と呼ぶか。", "騎士（エクイテス）", 4], ["04", 77, "富裕なパトリキと上層プレブスからなる、新しい支配階級は何と呼ばれたか。", "新貴族（ノビレス）", 4], ["04", 77, "第2回ポエニ戦争以降急速に発達した、奴隷を使用してブドウ・オリーヴなどの果樹栽培をおこなった、大土地所有の経営を何と呼ぶか。", "ラティフンディア（ラティフンディウム）", 6], ["04", 77, "共和政末期に、元老院中心の政治体制を維持しようとした、保守的なグループを何と呼ぶか。", "閥族派", 5], ["04", 77, "共和政末期に、民会を基盤に民衆の支持を背景として政界に進出した、反元老院派のグループを何と呼ぶか。", "平民派", 5], ["04", 77, "前135～前132年と前104～前100年に、大規模な奴隷反乱がおこった場所はどこか。", "シチリア島", 5], ["04", 77, "前2世紀後半、ともに護民官となり、大土地所有の制限、ローマ軍再建などの改革をこころみた兄弟は誰か。", "グラックス兄弟", 6], ["04", 78, "グラックス兄弟の改革からプリンキパトゥス（元首政）成立までのローマの混乱期を何と呼ぶか。", "「内乱の1世紀」", 5], ["04", 78, "軍制改革をおこない、ユグルタ戦争を鎮圧して台頭すると、平民派を形成して一時政権を握った政治家は誰か。", "マリウス", 5], ["04", 78, "前1世紀初め、イタリア半島内の同盟市がローマ市民権を要求しておこした反乱を何と呼ぶか。", "同盟市戦争", 4], ["04", 78, "同盟市戦争を鎮圧し、さらにアナトリアから帰国したのち平民派を弾圧した、閥族派の政治家は誰か。", "スラ", 5], ["04", 78, "前73～前71年におこった、トラキア出身の剣闘士が指導した大奴隷反乱を何と呼ぶか。", "スパルタクスの反乱", 6], ["04", 78, "ローマの東方支配を確立したのち、元老院と対立して第1回三頭政治に参加した人物は誰か。", "ポンペイウス", 6], ["04", 78, "騎士階級出身の政治家で、第1回三頭政治に参加した人物は誰か。", "クラッスス", 6], ["04", 78, "平民派の政治家で、第1回三頭政治に参加し、前58年からガリア遠征をおこなった人物は誰か。", "カエサル", 7], ["04", 78, "カエサルの独裁に反対し、前44年に彼を暗殺した共和主義者は誰か。", "ブルートゥス", 4], ["04", 78, "カエサルの部下で、第2回三頭政治に参加し、エジプトに赴いて、その女王と結んだ人物は誰か。", "アントニウス", 6], ["04", 78, "カエサルの部下で、第2回三頭政治に参加し、エジプトを除く北アフリカを勢力圏とした人物は誰か。", "レピドゥス", 6], ["04", 78, "カエサルの養子で、第2回三頭政治に参加し、前30年に全地中海域の平定を完成した人物は誰か。", "オクタウィアヌス", 7], ["04", 78, "前31年、オクタウィアヌスがアントニウスとエジプトの連合軍を撃破した戦いは何か。", "アクティウムの海戦", 6], ["04", 78, "オクタウィアヌスに敗れ、その後自殺した、プトレマイオス朝エジプト最後の女王は誰か。", "クレオパトラ", 6], ["04", 79, "前27年、元老院がオクタウィアヌスに贈った尊称で、以後、歴代皇帝の称号とされたものは何か。", "アウグストゥス（尊厳者）", 7], ["04", 79, "アウグストゥスに対して、オクタウィアヌスは「市民のなかの第一人者」を自称した。「元首」と訳されるこの称号は何か。", "プリンケプス", 7], ["04", 79, "名目上は元老院や共和政の伝統を尊重したが、実質上の帝政である元首政をラテン語で何と呼ぶか。", "プリンキパトゥス", 7], ["04", 79, "アウグストゥスから五賢帝末期までの約200年の、ローマの黄金時代を意味する「ローマの平和」をラテン語で何と呼ぶか。", "パクス＝ロマーナ", 7], ["04", 79, "ローマの最盛期を現出したネルウァからマルクス＝アウレリウス＝アントニヌスにいたる5人の皇帝を何と呼ぶか。", "五賢帝", 6], ["04", 79, "五賢帝の最初の皇帝は誰か。", "ネルウァ帝", 6], ["04", 79, "ダキアを属州とし、ローマ帝国の最大版図を実現した五賢帝の2番目の皇帝は誰か。", "トラヤヌス帝", 6], ["04", 79, "内政整備のほか、辺境防衛のためブリタニアに長城を築いた五賢帝の3番目の皇帝は誰か。", "ハドリアヌス帝", 6], ["04", 79, "貧民救済事業と財政改革につとめた、五賢帝の4番目の皇帝は誰か。", "アントニヌス＝ピウス帝", 6], ["04", 79, "ストア哲学を学び「哲人皇帝」と呼ばれ、中国史書では「大秦王安敦」と記された五賢帝最後の皇帝は誰か。", "マルクス＝アウレリウス＝アントニヌス帝", 6], ["04", 79, "五賢帝時代に栄えた、ヒッパロスの風とも呼ばれた気候現象を利用した貿易は何と呼ばれるか。", "季節風（モンスーン）貿易", 6], ["04", 79, "212年に勅令を発布して、帝国内の全自由人にローマ市民権を付与した皇帝は誰か。", "カラカラ帝", 4], ["04", 79, "235～284年のあいだに、各地の軍団によって擁立された皇帝たちを何というか。", "軍人皇帝", 6], ["04", 80, "軍人皇帝の頃からあらわれた、土地にしばりつけられた隷属的小作人を何と呼ぶか。", "コロヌス", 6], ["04", 80, "ラティフンディアにかわり拡大した、コロヌスを使用する土地経営形態を何と呼ぶか。", "コロナトゥス", 6], ["04", 80, "軍人皇帝の時代の混乱を収拾した皇帝は誰か。", "ディオクレティアヌス帝", 7], ["04", 80, "ディオクレティアヌス帝は、広大なローマ帝国をどのような方法で統治しようとしたか。", "四帝分治制（テトラルキア）", 7], ["04", 80, "ディオクレティアヌス帝に始まる、共和政の伝統を完全に無視した、帝政後期の専制君主政を何と呼ぶか。", "ドミナトゥス", 7], ["04", 80, "313年にキリスト教の公認をおこない、その後324年に帝国を再統一した皇帝は誰か。", "コンスタンティヌス帝", 7], ["04", 80, "330年、コンスタンティヌス帝は旧ビザンティウムに遷都した。遷都後、この都市は何と改称されたか。", "コンスタンティノープル", 7], ["04", 80, "コンスタンティヌス帝の時に鋳造され、以後数百年間にわたって金の含有量がかわらず、基軸通貨とされた金貨の名称は何か。", "ソリドゥス金貨（ノミスマ）", 3], ["04", 80, "4世紀末にキリスト教を国教化し、また死に際して帝国を東西に分けた皇帝は誰か。", "テオドシウス帝", 4], ["04", 80, "476年に西ローマ帝国を滅ぼした、帝国に仕えていたゲルマン人傭兵隊長は誰か。", "オドアケル", 4], ["04", 80, "ローマ人の日常語で、ローマの拡大につれて南欧から全ヨーロッパに普及した、ローマ帝国の公用語は何か。", "ラテン語", 7], ["04", 80, "ラテン語を表記するための文字は何か。", "ローマ字", 3], ["04", 80, "カラカラ帝建造のものが有名な、図書館や運動場なども備えた大娯楽施設は何か。", "浴場", 7], ["04", 81, "ローマ市のコンスタンティヌス帝の門などが代表例の、戦勝を記念して造られた大きな石造門を何と呼ぶか。", "凱旋門", 6], ["04", 81, "剣闘士の試合などがおこなわれた、ローマの円形闘技場を何と呼ぶか。", "コロッセウム", 7], ["04", 81, "万神殿とも呼ばれ、ローマの神々をまつった神殿は何と呼ばれるか。", "パンテオン", 2], ["04", 81, "ローマ人の市民生活の中心だった広場の遺跡は何か。", "フォロ＝ロマーノ", 6], ["04", 81, "ローマでは道路網が整備されたが、ローマから南東部にのびる、最古の軍用道路の名称は何か。", "アッピア街道", 7], ["04", 81, "南フランスに建築された、3層アーチからなり、上が水道、中・下が人馬道の水道橋の名称は何か。", "ガール水道橋", 6], ["04", 81, "無産市民となって都市へ流入した農民に、ローマの為政者が与えた施策を示す言葉は何か。", "「パンと見世物」", 6], ["04", 81, "ローマ領の拡大にともない、市民法から発達し、すべての人に適用されるようになった法を何と呼ぶか。", "万民法", 6], ["04", 81, "6世紀、東ローマ（ビザンツ）皇帝ユスティニアヌス大帝の命によって編纂された、古代ローマ法の集大成を何と呼ぶか。", "『ローマ法大全』", 6], ["04", 81, "ユスティニアヌス大帝に命じられ、『ローマ法大全』の編纂事業の中心となった東ローマ（ビザンツ）の法学者は誰か。", "トリボニアヌス", 3], ["04", 81, "エジプトの太陽暦をもとに、カエサルが制定した暦を何と呼ぶか。", "ユリウス暦", 5], ["04", 81, "1582年に教皇グレゴリウス13世がユリウス暦を修正して制定した、現在も用いられている暦を何と呼ぶか。", "グレゴリウス暦", 4], ["04", 81, "アウグストゥス時代に黄金時代を迎えた文学は何か。", "ラテン文学", 6], ["04", 81, "ローマ建国にまつわる叙事詩『アエネイス』を著した、古代ローマ最大の詩人は誰か。", "ウェルギリウス", 6], ["04", 81, "『叙情詩集』を著した、前1世紀の叙情詩人は誰か。", "ホラティウス", 4], ["04", 82, "『転身譜』を著した、前1～後1世紀の叙情詩人は誰か。", "オウィディウス", 4], ["04", 82, "古ケルト・古ゲルマン研究の重要史料でもある、カエサルが前1世紀に著した遠征記録を何というか。", "『ガリア戦記』", 6], ["04", 82, "騎士ながら雄弁でもって出世する一方、文体がラテン語散文の模範とされた散文家は誰か。", "キケロ", 6], ["04", 82, "アウグストゥスに委嘱されて『ローマ建国史』を著した、ローマの歴史家は誰か。", "リウィウス", 6], ["04", 82, "古ゲルマン研究の最重要史料である著書や、ローマ政治史の『年代記』の著者は誰か。", "タキトゥス", 7], ["04", 82, "民族大移動前のゲルマン人社会を、後1世紀に記したタキトゥスの著作名は何か。", "『ゲルマニア』", 7], ["04", 82, "前2世紀後半、政体循環史観に立って『歴史』を著した、ギリシア人の歴史家は誰か。", "ポリビオス", 5], ["04", 82, "ギリシアとローマの英雄的人物を比較評論した伝記の『対比列伝』（『英雄伝』）を著した、ギリシア人作家は誰か。", "プルタルコス", 6], ["04", 82, "前1～後1世紀の、史料的な地誌の『地理誌』を著したギリシア人地理学者は誰か。", "ストラボン", 5], ["04", 82, "ネロ帝の師で、のちに死を強制された、ストア派哲学者は誰か。", "セネカ", 5], ["04", 82, "奴隷出身のギリシア人ストア派哲学者は誰か。", "エピクテトス", 4], ["04", 82, "哲人皇帝マルクス＝アウレリウス＝アントニヌスが、ギリシア語で書いた著作の名称は何か。", "『自省録』", 5], ["04", 82, "1世紀に、百科全書的な『博物誌』を著し、ヴェスヴィオ火山噴火の際に殉職した人物は誰か。", "プリニウス", 4], ["04", 82, "『天文学大全』を著し、天動説をとなえて中世までの宇宙観に決定的な影響を与えたギリシア人天文学者は誰か。", "プトレマイオス", 6], ["04", 83, "ユダヤ教において、神から授けられたとされる宗教上の教えや生活規範を何と呼ぶか。", "律法", 5], ["04", 83, "ユダヤ教徒のなかで、モーセの律法の遵守を主張し、宗教儀礼を極端に重視した一派は何と呼ばれたか。", "パリサイ派", 4], ["04", 83, "新約聖書の伝承によればイエスが成長した場所と伝えられる、パレスチナ北部ガリラヤ地方の村はどこか。", "ナザレ", 2], ["04", 83, "神の絶対愛と隣人愛を説き、形式主義のパリサイ派を批判したのは誰か。", "イエス", 7], ["04", 83, "ユダヤ教で、世界の終末の際にあらわれ、信者を救済する存在を何と呼ぶか。", "救世主（メシア）", 7], ["04", 83, "救世主（メシア）をギリシア語で何というか。", "キリスト", 6], ["04", 83, "ユダヤ人の圧力のもと、イエスを帝国への反逆者として処刑した、ローマ属州ユダヤの総督は誰か。", "ピラト（ピラトゥス）", 5], ["04", 83, "イエスの処刑後、彼の弟子たちから生まれた、彼を救世主であると信じる宗教は何か。", "キリスト教", 7], ["04", 83, "イエスが選んだ12人の直弟子で、のちに布教・伝道や聖書の成立などに大きく貢献した者を何と呼ぶか。", "使徒", 6], ["04", 83, "「第1使徒」と呼ばれ、ローマ伝道に力をつくしたがネロ帝の迫害で殉教した人物は誰か。", "ペテロ（ペトロ）", 7], ["04", 83, "ユダヤ教のパリサイ派に属していたが回心してキリスト教徒となり、「異邦人伝道の使徒」と呼ばれた人物は誰か。", "パウロ", 7], ["04", 83, "コイネーで書かれた、キリスト教の教典は何か。", "『新約聖書』", 7], ["04", 83, "『新約聖書』の中心となる、イエスの言行を記録した四書を何と呼ぶか。", "『福音書』", 4], ["04", 84, "『新約聖書』中で、とくにペテロ・パウロの伝道を記述した部分を何と呼ぶか。", "『使徒行伝』", 2], ["04", 84, "1世紀後半、ローマの大火の責任をキリスト教徒に課し、彼らを迫害した皇帝は誰か。", "ネロ帝", 5], ["04", 84, "皇帝崇拝を拒否するキリスト教徒に対して、4世紀初めに最大級の迫害をおこなった皇帝は誰か。", "ディオクレティアヌス帝", 5], ["04", 84, "初期キリスト教時代の信徒たちが集会所・礼拝堂としても利用した地下墓所を何というか。", "カタコンベ", 7], ["04", 84, "313年、コンスタンティヌス帝がキリスト教を公認した際に発布したものは何か。", "ミラノ勅令", 7], ["04", 84, "325年、教義統一のためコンスタンティヌス帝が招集した、キリスト教会最初の公会議の名称は何か。", "ニケーア公会議", 6], ["04", 84, "ニケーア公会議で、正統教義と認められたのは何派か。", "アタナシウス派", 5], ["04", 84, "アタナシウス派はイエスの神性を強く認め、のちにある説へと発展するが、この説は何と呼ばれるか。", "三位一体説", 7], ["04", 84, "カトリックの教義で父なる神と子なるイエスとともに三位一体をなす存在で、神の意志を人に伝えて、精神的な活動を促す力を何と呼ぶか。", "聖霊", 5], ["04", 84, "ニケーア公会議で異端とされた、イエスを人間であるとするキリスト教の一派は何か。", "アリウス派", 7], ["04", 84, "正統教義の確立につとめた、古代および中世初期のキリスト教の著作家たちを何というか。", "教父", 6], ["04", 84, "コンスタンティヌス帝時代、キリスト教最初の『教会史』をはじめ、『年代記』などを著した教父は誰か。", "エウセビオス", 2], ["04", 84, "北アフリカの司教で、カトリックの教義確立に大きく貢献した、ローマ帝政末期最大の教父は誰か。", "アウグスティヌス", 6], ["04", 84, "5世紀前半、西ゴート人のローマ侵入を契機に執筆された、アウグスティヌスのキリスト教的歴史哲学書の名称は何か。", "『神の国』（『神国論』）", 4], ["04", 85, "アウグスティヌスが、青年期に帰依したマニ教から回心してキリスト教にたどりつくまでを描いた自伝の名称は何か。", "『告白録』", 3], ["04", 85, "帝政期のローマに広まった、古代エジプトの女神を信仰する密儀宗教は何か。", "イシス教", 3], ["04", 85, "ローマ帝政期に軍人を中心に流行した、光明神を崇拝するインド・イラン起源の密儀宗教の名称は何か。", "ミトラ教（ミトラス教）", 4], ["04", 85, "ギリシア古典とミトラ教に心酔し、異教復興を企て、教会から「背教者」と呼ばれた4世紀の皇帝は誰か。", "ユリアヌス帝", 5], ["04", 85, "380年にキリスト教を国教とする勅令を出し、392年に異教の信仰を全面的に禁止した皇帝は誰か。", "テオドシウス帝", 6], ["04", 85, "431年、アナトリア半島西岸の町で開かれた公会議の名称は何か。", "エフェソス公会議", 6], ["04", 85, "エフェソス公会議で異端とされた、イエスの神性と人性を分離して考えるキリスト教の一派は何か。", "ネストリウス派", 7], ["04", 85, "ネストリウス派はのちに中国にも伝わり、唐代には何と呼ばれたか。", "景教", 6], ["04", 85, "451年、コンスタンティノープルの対岸の町で開かれた公会議の名称は何か。", "カルケドン公会議", 3], ["04", 85, "カルケドン公会議で異端とされた、イエスの神性と人性は融合して一つであるとする考え方を何と呼ぶか。", "単性論", 4], ["04", 85, "シリアを中心として、単性論を信奉する教会の名称は何か。", "シリア教会", 4], ["04", 85, "6世紀以降、単性論を受け入れた、アルメニアを中心に広がった教会の名称は何か。", "アルメニア教会", 4], ["04", 85, "単性論を信奉するエジプトの教会の名称は何か。", "コプト教会", 4], ["04", 85, "ローマ帝国末期以降信徒たちを指導した、ローマ・コンスタンティノープル・アンティオキア・イェルサレム・アレクサンドリアの有力な5つの総大司教座教会の総称を何と呼ぶか。", "五本山", 5], ["05", 88, "セム語派のアラビア語を母語とした、アラビア半島の先住民は何か。", "アラブ人", 7], ["05", 88, "多くはアラビア半島を故地とし、ラクダなどの遊牧で生活している、アラブ系遊牧民を何と呼ぶか。", "ベドウィン", 2], ["05", 88, "ラクダなどに荷を積んだ商人たちが一団を組んでおこなった長距離交易を何というか。", "隊商交易", 2], ["05", 88, "アラビア半島南西部に位置し、農耕にめぐまれ、海上交易路にもあたっていた地域はどこか。", "イエメン", 1], ["05", 88, "アラビア半島西部のヒジャーズ地方に位置し、古来から宗教都市・商業都市として栄えていたのはどこか。", "メッカ（マッカ）", 7], ["05", 88, "5世紀末にメッカを征服し定住した、名門一族は何か。", "クライシュ族", 5], ["05", 88, "クライシュ族のハーシム家出身で、神の啓示を受けて610年頃に新宗教を創始した人物は誰か。", "ムハンマド", 7], ["05", 88, "ムハンマドのように神の言葉（啓示）を受けた人を何と呼ぶか。", "預言者", 7], ["05", 88, "ムハンマドが創始した、「神への絶対的帰依」を意味する宗教は何か。", "イスラーム教", 6], ["05", 88, "イスラーム教における唯一神をアラビア語で何と呼ぶか。", "アッラー", 7], ["05", 88, "イスラーム教徒のことを指し、「神に帰依する者」を意味するアラビア語は何か。", "ムスリム", 7], ["05", 88, "622年、ムハンマドがメッカの有力者から迫害を受けて移住した、メッカ北方に位置する旧名ヤスリブの都市は何か。", "メディナ", 7], ["05", 89, "イスラーム暦の紀元（元年）とされた、西暦622年にムハンマドがメッカからメディナへ移住したできごとを何と呼ぶか。", "ヒジュラ（聖遷）", 7], ["05", 89, "ムハンマドの移住後、メディナで成立したイスラーム教徒の共同体（宗教共同体）を何と呼ぶか。", "ウンマ", 7], ["05", 89, "古来アラブ人の多神教の神殿であったがムハンマドによってイスラーム教の聖殿とされた、メッカの聖殿は何か。", "カーバ聖殿", 7], ["05", 89, "ムハンマドの後継者にして、ウンマの代表者を何と呼ぶか。", "カリフ", 7], ["05", 89, "ムハンマドの死後、信徒の選挙で選出された4代にわたる後継者は、とくに何と呼ばれるか。", "正統カリフ", 7], ["05", 89, "ムハンマドの義父で、初代後継者（カリフ）として選出されたのは誰か。", "アブー＝バクル", 6], ["05", 89, "異教徒に対する、イスラーム教徒の戦いを何と呼ぶか。", "ジハード（聖戦）", 5], ["05", 89, "第2代正統カリフは誰か。", "ウマル", 5], ["05", 89, "642年、ウマルの時、アラブ軍がササン朝軍を撃破した戦いは何か。", "ニハーヴァンドの戦い", 2], ["05", 89, "『コーラン』を現在のかたちにまとめたとされる、第3代正統カリフは誰か。", "ウスマーン", 4], ["05", 89, "イスラーム世界の成立・発展期に、アラブ人イスラーム教徒が家族をともなって移住し建設した軍営都市は、何と呼ばれるか。", "ミスル", 5], ["05", 89, "ウマイヤ朝とアッバース朝の初期に、軍人や官僚に現金で支払われた俸給を何と呼ぶか。", "アター", 3], ["05", 89, "ムハンマドの娘婿で、暗殺された第4代正統カリフは誰か。", "アリー", 7], ["05", 90, "アリーと戦い、彼が暗殺されたのち、新王朝を開いたシリア総督は誰か。", "ムアーウィヤ", 7], ["05", 90, "ムアーウィヤが開いた新王朝は、何朝と呼ばれるか。", "ウマイヤ朝", 7], ["05", 90, "ウマイヤ朝が都とした、シリアの中心都市はどこか。", "ダマスクス", 6], ["05", 90, "アリーとその子孫のみをムハンマドの正統な後継者と認める、イスラーム教少数派の分派名は何か。", "シーア派", 7], ["05", 90, "イスラーム世界における指導者を指すが、シーア派ではアリー以後の最高指導者を指す称号は何か。", "イマーム", 3], ["05", 90, "シーア派の最大宗派は何か。", "十二イマーム派", 2], ["05", 90, "慣行・慣習を意味し、イスラームでは「ムハンマドの言行」を指す呼称は何か。", "スンナ", 5], ["05", 90, "ムハンマドの言行に従う者という意味で、代々のカリフを正統と認めるイスラーム教の多数派は何か。", "スンナ派（スンニー）", 7], ["05", 90, "711年、ウマイヤ朝が滅ぼしたイベリア半島のゲルマン人国家は何か。", "西ゴート王国", 5], ["05", 90, "732年、ウマイヤ朝が宮宰カール＝マルテル率い 回した、イスラーム勢力側の指導者は誰か。", "サラーフ＝アッディーン（サラディン）", 5], ["07", 118, "1169年、サラーフ＝アッディーンが建てたイスラーム王朝の名前は何か。", "アイユーブ朝", 5], ["07", 118, "神聖ローマ帝国・フランス・イギリスの君主が参加した最大規模の十字軍は、第何回十字軍か。", "第3回十字軍", 5], ["07", 118, "サラーフ＝アッディーンと戦った、「獅子心王」の名で呼ばれたイギリス国王は誰か。", "リチャード1世", 3], ["07", 118, "「バルバロッサ」のあだ名をもち、第3回十字軍に参加した神聖ローマ皇帝は誰か。", "フリードリヒ1世", 3], ["07", 118, "第3回十字軍に参加したフランス国王は誰か。", "フィリップ2世", 6], ["07", 118, "教皇権の絶頂期を現出した教皇の提唱でおこなわれた遠征は、第何回十字軍か。", "第4回十字軍", 6], ["07", 118, "第4回十字軍を提唱したローマ教皇は誰か。", "インノケンティウス3世", 6], ["07", 118, "第4回十字軍がビザンツ帝国の首都コンスタンティノープルを占領したのは、どこの都市の商人の要求か。", "ヴェネツィア", 6], ["07", 119, "第4回十字軍がコンスタンティノープルを占領して建てた国は何か。", "ラテン帝国", 5], ["07", 119, "第5回十字軍の際、外交交渉でイェルサレムを一時回復した神聖ローマ皇帝は誰か。", "フリードリヒ2世", 5], ["07", 119, "第6回・第7回の十字軍を指揮したがチュニスで病死した、聖王と称されたフランス王は誰か。", "ルイ9世", 2], ["07", 119, "1291年、イェルサレム王国の最後の拠点であった都市が陥落し、十字軍時代が終了した。その都市はどこか。", "アッコン", 3], ["07", 119, "巡礼の護衛など、十字軍運動を支えた教皇直属の修道会を何というか。", "宗教騎士団", 4], ["07", 119, "第1回十字軍後に結成された三大宗教騎士団の1つで、拠点をロードス島、さらにはマルタ島へと移した騎士団は何か。", "ヨハネ騎士団", 3], ["07", 119, "第1回十字軍後に設立された三大宗教騎士団の1つで、莫大な富を蓄えたが、フランス国王フィリップ4世に財産を没収されたのち壊滅した騎士団は何か。", "テンプル騎士団", 3], ["07", 119, "第3回十字軍の際に設立された三大宗教騎士団の1つで、帰国後にエルベ川以東の東方植民を推進した騎士団は何か。", "ドイツ騎士団", 4], ["07", 119, "11世紀以降の西欧での農業生産力の上昇は余剰生産物を生み、その結果、定期市などの交換手段を通して普及していった経済の形態は何か。", "貨幣経済", 5], ["07", 119, "中世ヨーロッパの地中海商業圏や北ヨーロッパ商業圏に代表される、遠方の他の経済圏や地域との商業活動を何と呼ぶか。", "遠隔地貿易", 5], ["07", 119, "北イタリア諸都市が地中海東岸（レヴァント）地域とおこなった貿易を何と呼ぶか。", "東方貿易（レヴァント貿易）", 5], ["07", 119, "東方貿易を柱とする商業圏を何と呼ぶか。", "地中海商業圏", 7], ["07", 120, "東方貿易で繁栄して「アドリア海の女王」と呼ばれ、第4回十字軍をコンスタンティノープルへ誘導した、イタリア北東部の港市はどこか。", "ヴェネツィア", 7], ["07", 120, "東方貿易でヴェネツィアのライバルだった、地中海に面したイタリア北西部の港市はどこか。", "ジェノヴァ", 6], ["07", 120, "ロマネスク様式の聖堂でも有名な、東方貿易で繁栄したイタリア中西部の港市はどこか。", "ピサ", 6], ["07", 120, "イタリアにおける都市同盟の中心都市ともなった、ロンバルディア地方の都市はどこか。", "ミラノ", 5], ["07", 120, "トスカナ平野にあって毛織物業と金融業で繁栄し、一時メディチ家が市政を独裁した都市はどこか。", "フィレンツェ", 6], ["07", 120, "北海・バルト海を中心として北ヨーロッパに形成された商業圏を何と呼ぶか。", "北ヨーロッパ商業圏（北海・バルト海交易圏）", 6], ["07", 120, "バルト海沿岸に位置し、ハンザ同盟の盟主だった都市はどこか。", "リューベック", 7], [" 5, "イヴァン3世がツァーリをはじめて自称したことから、モスクワ大公国でとなえられはじめた政治理論は何か。", "「第3のローマ」", 1], ["07", 125, "モスクワ大公として正式に全ロシアのツァーリを称し、諸侯をおさえ、農奴制を強化し、「雷帝」と呼ばれた君主は誰か。", "イヴァン4世", 3], ["07", 125, "7世紀頃バルカン半島南西部に入り、9世紀頃までにギリシア正教を受け入れ、東方教会に属し、12世紀に王国を建てた南スラヴ人は何か。", "セルビア人", 5], ["07", 125, "8世紀末からフランク王国（カール大帝）に服属してカトリックに改宗し、その後独立したが、12世紀初めからハンガリーに支配された南スラヴ人は何か。", "クロアティア人", 5], ["07", 125, "南スラヴ人でもっとも西に進んだが、クロアティア人と同じ頃フランク王国（カール大帝）に服属してカトリックに改宗した民族は何か。", "スロヴェニア人", 2], ["07", 125, "10世紀に王国を建て、まもなくカトリックを受容し、13世紀にモンゴル人の侵入で打撃を受けた、西スラヴ人は何か。", "ポーランド人", 5], ["07", 125, "ユダヤ人を保護して経済を発展させ、クラクフ大学設立などの事業をおこない、14世紀半ばにピアスト朝の全盛期を現出したポーランド国王は誰か。", "カジミェシュ（カシミール）大王", 2], ["07", 125, "13世紀、ドイツ騎士団の侵入に対抗して国家を統一した、インド＝ヨーロッパ語系のバルト語派の民族は何か。", "リトアニア人", 6], ["07", 125, "14世紀後半、ドイツ騎士団の進出に対抗するため、東ヨーロッパで成立した同君連合国家は何か。", "リトアニア＝ポーランド王国", 5], ["07", 126, "クラクフを首都とした、リトアニア＝ポーランド王国の王朝名は何か。", "ヤゲウォ（ヤゲロー）朝", 6], ["07", 126, "10世紀にベーメン王国を形成した、西スラヴ人は何か。", "チェック人", 5], ["07", 126, "チェック人が9世紀にスラヴ人王国として建てたが、マジャール人の進出で10世紀に衰退した国は何か。", "モラヴィア王国", 2], ["07", 126, "現在のプラハを中心とする地域の名称は何か。", "ベーメン（ボヘミア）", 5], ["07", 126, "チェック人と同じ起源をもつ西スラヴ人だが、モラヴィア王国衰退後、マジャール人に支配された民族は何か。", "スロヴァキア人", 1], ["07", 126, "バルカン半島東南部に入り7世紀末に建国し、その後先住のスラヴ人と同化したトルコ系遊牧民は何か。", "ブルガール人", 5], ["07", 126, "9世紀末から第1次帝国、12世紀末から第2次帝国として最盛期をむかえた、ブルガール人の国は何か。", "ブルガリア帝国（ブルガリア王国）", 4], ["07", 126, "9世紀末パンノニアに定住したウラル語系民族は何か。", "マジャール人", 7], ["07", 126, "10世紀末にマジャール人がパンノニアに建て、11世紀にカトリックを受容した国は何か。", "ハンガリー王国", 5], ["07", 126, "古ダキアの先住民とローマ帝国からの植民者、およびスラヴ人との混血によって形成された民族は何か。", "ルーマニア人", 2], ["07", 126, "のちのルーマニア人にあたるラテン系の人々が、14世紀初めに建てた国は何か。", "ワラキア公国", 2], ["07", 126, "ワラキア公国と同じく、14世紀中頃にラテン系の人々が建てた国は何か。", "モルダヴィア公国", 2], ["07", 126, "9世紀後半モラヴィア王国で、スラヴ人への布教のため、グラゴール文字を用い、布教活動をおこなったギリシア人宣教師は誰か。", "キュリロス", 2], ["07", 126, "グラゴール文字から発展し、今日のロシアなどで使用されている文字の原型となった文字は何か。", "キリル文字", 4], ["07", 127, "貨幣経済の普及にともない、領主は賦役をやめて直営地を農民に貸し与え、地代の形態は労働地代から生産物地代を経て、何に移行したか。", "貨幣地代", 6], ["07", 127, "地代が労働地代から生産物地代・貨幣地代に移るなかで、農奴が封建的束縛から解放されたことを何と呼ぶか。", "農奴解放", 4], ["07", 127, "1348年頃（14世紀半ば）を中心に西欧で大流行し、人口の約3分の1を減少させた疫病は何か。", "黒死病（ペスト）", 7], ["07", 127, "荘園を離れ、みずから保有する土地で農業を営む農民を何と呼ぶか。", "独立自営農民", 5], ["07", 127, "14世紀以降誕生した、農奴身分から解放された独立自営農民をイギリスでは何と呼ぶか。", "ヨーマン", 5], ["07", 127, "貨幣経済の進展で窮乏する領主層が、農民への支配と搾取を再強化しようとしたことを何と呼ぶか。", "封建反動", 2], ["07", 127, "封建反動に対し、1358年に北フランスの農民がおこした反乱は何か。", "ジャックリーの乱", 6], ["07", 127, "1381年にイギリス東南部でおこった農民の反乱は何か。", "ワット＝タイラーの乱", 7], ["07", 127, "ワット＝タイラーの乱の際、「アダムが耕しイヴが紡いだ時、誰が貴族であったか」の言葉を述べた人物は誰か。", "ジョン＝ボール", 7], ["07", 127, "荘園経営のゆきづまりや戦術の変化で没落した中小貴族や騎士がなった、宮廷で働く官僚を何と呼んだか。", "廷臣", 2], ["07", 127, "戦術を変化させ、騎士階級の没落を早めた兵器は何か。", "火砲", 4], ["07", 128, "騎士にかわってその使用が広まった、金銭で雇用された兵士を何と呼ぶか。", "傭兵", 2], ["07", 128, "とくに十字軍以降、キリスト教徒によりゲットーに強制隔離されるなど迫害された人々は誰か。", "ユダヤ人", 3], ["07", 128, "聖職者への課税問題で全国三部会を招集し、さらに教皇と争ったフランス国王は誰か。", "フィリップ4世", 5], ["07", 128, "聖職者課税問題で、フランス国王フィリップ4世と争った教皇は誰か。", "ボニファティウス8世", 6], ["07", 128, "1303年、フランス国王フィリップ4世が教皇ボニファティウス8世をローマ近郊で捕囚したできごとは何と呼ばれるか。", "アナーニ事件", 7], ["07", 128, "フランス国王フィリップ4世の後援を受けて、1309年から教皇と教皇庁が移転した南フランスの都市はどこか。", "アヴィニョン", 7], ["07", 128, "1309～77年のあいだ教皇と教皇庁がローマから南フランスのアヴィニョンに移った事態を、古代ユダヤ教徒の故事になぞらえて何と呼ぶか。", "「教皇のバビロン捕囚」", 6], ["07", 128, "1378～1417年のあいだ、教皇が南フランスの都市とローマに並立し、ローマ教会が分裂した状態を何と呼ぶか。", "教会大分裂（大シスマ）", 6], ["07", 128, "1414～18年に神聖ローマ皇帝ジギスムントの提唱で開かれ、教会大分裂を終わらせた公会議は何か。", "コンスタンツ公会議", 7], ["07", 128, "教会の教理に反する異端を処罰する裁判制度は何か。", "異端審問", 3], ["07", 128, "キリスト教世界で、悪魔の手先とみなされた者におこなわれた裁判を何と呼ぶか。", "魔女裁判", 2], ["07", 128, "イギリスの神学者で、オクスフォード大学神学教授をつとめ、教会大分裂をみて教皇や教会制度を批判し、聖書を英訳するなど宗教改革の先駆者とされる人物は誰か。", "ウィクリフ", 6], ["07", 128, "ベーメンの神学者で、プラハ大学の総長をつとめ、ウィクリフの説に共鳴してカトリックを批判した結果、コンスタンツ公会議で異端として火刑となった人物は誰か。", "フス", 6], ["07", 129, "1419年から、処刑されたフスの説を支持するベーメンの住民が抗議しておこした戦争は何か。", "フス戦争", 6], ["07", 129, "中世末期にヨーロッパ諸国で成立した、身分別の代表が国政を審議する議会を何と呼ぶか。", "身分制議会", 7], ["07", 129, "フランス王の家臣ノルマンディー公ウィリアムがイングランド王になったことで成立したイギリスの王朝は何か。", "ノルマン朝", 4], ["07", 129, "ノルマン朝の初代国王は誰か。", "ウィリアム1世", 2], ["07", 129, "ノルマン朝の断絶後イギリスに進出した、フランス南西部に大領土を保有した大貴族は何伯か。", "アンジュー伯", 3], ["07", 129, "1154年に、アンジュー伯が開いたイギリスの王朝は何か。", "プランタジネット朝", 6], ["07", 129, "プランタジネット朝の創始者（初代国王）は誰か。", "ヘンリ2世", 5], ["07", 129, "プランタジネット朝第2代の王で、第3回十字軍に参加するも、アイユーブ朝サラーフ＝アッディーンに敗れ、聖地奪回に失敗した人物は誰か。", "リチャード1世", 3], ["07", 129, "プランタジネット朝第3代の王で、「欠地王」と呼ばれた人物は誰か。", "ジョン王", 6], ["07", 129, "1215年、失政を続けるジョン王に対して貴族が団結して認めさせた、イギリス立憲政治の基礎となった規定は、何と呼ばれるか。", "大憲章（マグナ＝カルタ）", 6], ["07", 129, "重税を課すなどして大憲章を無視したため、貴族の反乱をまねいたイギリス国王は誰か。", "ヘンリ3世", 3], ["07", 129, "ヘンリ3世に対する反乱を指導し、1265年にイギリス議会の起源とされる議会を王に認めさせた貴族は誰か。", "シモン＝ド＝モンフォール", 6], ["07", 129, "1295年に招集された、高位聖職者・大貴族のほか、各州2名の騎士・各都市2名の市民で構成された議会は何か。", "模範議会", 6], ["07", 129, "模範議会を招集したイギリス国王は誰か。", "エドワード1世", 4], ["07", 130, "イギリスで大貴族と高位聖職者の代表から構成された議院は何と呼ばれるか。", "上院（貴族院）", 5], ["07", 130, "イギリスで各州の騎士と各都市の代表から構成された議院は何と呼ばれるか。", "下院（庶民院）", 5], ["07", 130, "中世末期から近世初頭のイギリスで、騎士や富裕な平民が地主化した階層を、何と呼ぶか。", "ジェントリ（郷紳）", 5], ["07", 130, "パリ伯ユーグ＝カペーに始まるフランスの王朝は何か。", "カペー朝", 5], ["07", 130, "12～13世紀に南欧に広がった、マニ教の影響を受けたキリスト教の異端は、何と総称されるか。", "カタリ派", 6], ["07", 130, "南フランスで広まり、国王による十字軍によって征服された、カタリ派の南フランスにおける地方的呼称は何か。", "アルビジョワ派", 6], ["07", 130, "12世紀末に即位し、第3回十字軍に参加した後、イギリス国王のジョン王と戦ってフランス国内のイギリス王領の大半を奪った、カペー朝の国王は誰か。", "フィリップ2世", 6], ["07", 130, "アルビジョワ十字軍の成功で南フランスに王権を広め、第6回・第7回十字軍をおこなった王は誰か。", "ルイ9世", 6], ["07", 130, "1302年に招集された、聖職者・貴族・平民の代表からなるフランスの身分制議会の名称は何か。", "全国三部会（三部会）", 7], ["07", 130, "聖職者への課税問題で全国三部会を招集し、さらに教皇と争ったフランス国王は誰か。", "フィリップ4世", 7], ["07", 130, "カペー朝の断絶で、1328年に成立したフランスの新王朝は何か。", "ヴァロワ朝", 6], ["07", 130, "カペー朝の断絶に際し、母方の血統からフランス王位継承権を主張したイギリス国王は誰か。", "エドワード3世", 7], ["07", 130, "中世ヨーロッパにおいて毛織物業が盛んであった、現在のベルギーを中心とした地方名は何か。", "フランドル地方", 5], ["07", 130, "1339～1453年におこなわれたイギリス・フランス間の戦争を何と呼ぶか。", "百年戦争", 7], ["07", 131, "百年戦争の勃発の原因の1つとなった、フランス領内にあったイギリス王領の地方（公国）はどこか。", "ギエンヌ（ギュイエンヌ）", 2], ["07", 131, "百年戦争においてはイギリスと組んでフランス王家と対峙した、フランス東部の大封建諸侯は何か。", "ブルゴーニュ公", 2], ["07", 131, "百年戦争のなか、1346年にイギリス王エドワード3世の率いた軍がフランス軍を破った戦いは何か。", "クレシーの戦い", 3], ["07", 131, "1356年、ポワティエの戦いで、フランス軍を破ったイギリス王エドワード3世の長子は誰か。", "エドワード黒太子", 2], ["07", 131, "イギリス軍が駆使し、百年戦争初期にはフランス軍を圧倒した戦闘部隊は何か。", "長弓兵", 3], ["07", 131, "百年戦争中、1429年にイギリス軍に包囲された、フランス中部の小都市はどこか。", "オルレアン", 6], ["07", 131, "神のお告げを受けたとして、包囲されたオルレアンに入り、その解放に成功した農民の娘は誰か。", "ジャンヌ＝ダルク", 7], ["07", 131, "オルレアンの解放後、滞在地からランスに行き、正式に戴冠したフランス王は誰か。", "シャルル7世", 6], ["07", 131, "百年戦争で敗れたイギリスが、唯一確保したフランス北海岸の港市はどこか。", "カレー", 5], ["07", 131, "1455年に勃発した、イギリスの王位継承をめぐる内乱を何と呼ぶか。", "バラ戦争", 7], ["07", 131, "王位継承を争った2つの家のうち、1399年にプランタジネット朝から王位を継承した家はどこか。", "ランカスター家", 6], ["07", 131, "ランカスター家とイギリス王位を争った王族家は何か。", "ヨーク家", 6], ["07", 131, "1485年にバラ戦争をおさめて、新国王となったのは誰か。", "ヘンリ7世", 5], ["07", 131, "1485年にヘンリ7世が開いたイギリスの新王朝は何か。", "テューダー朝", 7], ["07", 131, "エドワード1世の侵攻などイングランドの圧力を受け続け、1536年にヘンリ8世により併合された、大ブリテン島の地域はどこか。", "ウェールズ", 2], ["07", 132, "イベリア半島で8世紀から始まった、イスラーム教徒を駆逐しようとしたキリスト教徒の運動を何と呼ぶか。", "国土回復運動（レコンキスタ）", 6], ["07", 132, "11世紀にイベリア半島の地中海北東沿岸に成立し、国土回復運動の中心の1つとなったキリスト教国はどこか。", "アラゴン王国", 7], ["07", 132, "11世紀にイベリア半島北東部に成立し、国土回復運動の中心の1つとして南部に領域を広げたキリスト教国はどこか。", "カスティリャ王国", 7], ["07", 132, "カスティリャ王女とアラゴン王子の結婚で統合され、1479年に成立した国は何か。", "スペイン（イスパニア）王国", 7], ["07", 132, "成立したスペイン王国の共同統治者となったカスティリャの王女は誰か。", "イサベル", 6], ["07", 132, "成立したスペイン王国の共同統治者となったアラゴンの王子は誰か。", "フェルナンド", 6], ["07", 132, "1492年に滅亡した、イベリア半島最後のイスラーム王朝は何か。", "ナスル朝", 3], ["07", 132, "1492年、スペイン王国が陥落させた、ナスル朝の最後の都はどこか。", "グラナダ", 6], ["07", 132, "12世紀中頃、カスティリャ王国から分離・独立したキリスト教国はどこか。", "ポルトガル王国", 7], ["07", 132, "15世紀後半に貴族の反乱を鎮めて王権を強化する一方、バルトロメウ＝ディアスの航海を援助するなどインド航路の開拓を進めたポルトガル国王は誰か。", "ジョアン2世", 3], ["07", 132, "13～14世紀に、ドイツ地域に約300もあった地方主権国家は何と呼ばれるか。", "領邦", 7], ["07", 132, "歴代の神聖ローマ皇帝がおこなったイタリア介入政策を何と呼ぶか。", "イタリア政策", 5], ["07", 132, "フリードリヒ1世・フリードリヒ2世時代が最盛期で、13世紀半ばに断絶した神聖ローマ皇帝家の王朝名は何か。", "シュタウフェン朝", 4], ["07", 133, "シュタウフェン朝の断絶後、1256～73年まで続いた実質的な皇帝不在の時代を何と呼ぶか。", "「大空位時代」", 6], ["07", 133, "1356年、皇帝選出権を聖俗の7人の選帝侯（七選帝侯）がもつことを認める帝国法が出された。これを何と呼ぶか。", "金印勅書", 7], ["07", 133, "金印勅書を発布した、神聖ローマ皇帝兼ベーメン王は誰か。", "カール4世", 6], ["07", 133, "12～14世紀におこなわれた、ドイツ人のエルベ川以東への入植運動を何と呼ぶか。", "東方植民", 7], ["07", 133, "東方植民を進めるなか12世紀に成立し、15世紀からホーエンツォレルン家領となった小国家はどこか。", "ブランデンブルク辺境伯領", 4], ["07", 133, "ドイツ出身者による騎士団が、バルト海沿岸を開拓して形成した領域を何と呼ぶか。", "ドイツ騎士団領", 5], ["07", 133, "1438年から神聖ローマ皇帝位をほぼ独占することになる、オーストリアを支配した名家は何か。", "ハプスブルク家", 6], ["07", 133, "13世紀以降、ハプスブルク家の支配に対して独立闘争をおこない、15世紀末に13州の独立を事実上達成した国はどこか。", "スイス", 5], ["07", 133, "12世紀のノルマン人の征服以降、パレルモを都にシチリア島と南イタリアを支配したが、13世紀後半にアラゴン家の支配下に入り、半島部と分裂した国は何か。", "シチリア王国", 5], ["07", 133, "13世紀後半の「シチリアの晩鐘」と呼ばれる反乱でシチリア島を追われたアンジュー家が、ナポリを都に成立させた国の通称は何か。", "ナポリ王国", 5], ["07", 133, "「アドリア海の女王」と呼ばれる港市と、その周辺領域からなる都市共和国はどこか。", "ヴェネツィア共和国", 7], ["07", 133, "14～15世紀にもっとも繁栄し、ルネサンスの中心ともなったトスカナ地方の都市共和国はどこか。", "フィレンツェ共和国", 6], ["07", 133, "13～14世紀にヴェネツィア共和国と海上の覇権をめぐって争い敗北した、北イタリアの都市共和国はどこか。", "ジェノヴァ共和国", 6], ["07", 134, "13～15世紀までヴィスコンティ家が専制支配をおこなっていた、北イタリアの公国はどこか。", "ミラノ公国", 4], ["07", 134, "都市の大商人が多かった、ゲルフとも呼ばれるイタリアでの教皇支持派を何と呼ぶか。", "教皇党", 6], ["07", 134, "貴族や領主が多かった、ギベリンとも呼ばれるイタリアでの皇帝支持派を何と呼ぶか。", "皇帝党", 6], ["07", 134, "複数の国家が同一人物を君主として結んだ連合国家の形態を何と呼ぶか。", "同君連合", 4], ["07", 134, "1397年、デンマーク王家の支配下で北欧3国が結成した同君連合を何と呼ぶか。", "カルマル同盟", 6], ["07", 134, "カルマル同盟を成立させ、その実権を握ったデンマークの摂政（事実上の女王）は誰か。", "マルグレーテ", 5], ["07", 134, "1523年、カルマル同盟から離脱・独立した国はどこか。", "スウェーデン", 2], ["07", 134, "東方に起源をもつ、修道士や修道女の修養機関は何か。", "修道院", 7], ["07", 134, "6世紀前半、西方での修道院運動を開始した、イタリア人の修道者は誰か。", "ベネディクトゥス", 7], ["07", 134, "ベネディクトゥスが修道院を創設した、中部イタリアの山はどこか。", "モンテ＝カシノ", 6], ["07", 134, "ベネディクトゥスの修道院が「清貧・純潔・服従」の戒律とともに掲げた、信仰と労働を重視するモットーは何か。", "「祈り、働け」", 5], ["07", 134, "西ヨーロッパの人口増加などを背景に、オランダの干拓やドイツおよび東方地域などで開墾・植民運動が展開されたことから、12～13世紀頃を何時代と呼称するか。", "大開墾時代", 6], ["07", 135, "11世紀末にフランス中部ブルゴーニュ地方に創設され、12世紀以降、開墾運動の中心となった修道会は何か。", "シトー修道会", 6], ["07", 135, "13世紀に修道院の封建領主化と富裕化を批判して誕生し、財産をもたず信者からの施しをよりどころとして清貧をつらぬいた修道会を何と総称するか。", "托鉢修道会", 5], ["07", 135, "中部イタリア、アッシジの富裕な織物商家に生まれたが、回心して清貧に徹し、托鉢修道会を創設した人物は誰か。", "フランチェスコ", 6], ["07", 135, "イタリアのフランチェスコが、13世紀初めに中部イタリアのアッシジに創設した托鉢修道会は何か。", "フランチェスコ修道会", 4], ["07", 135, "南フランスでアルビジョワ派（カタリ派）の改宗に尽力したのち、托鉢修道会を創設したスペイン人聖職者は誰か。", "ドミニコ", 4], ["07", 135, "スペインのドミニコが、13世紀前半フランス南部のトゥールーズに創設した托鉢修道会は何か。", "ドミニコ修道会", 6], ["07", 135, "中世でカトリック教会を中心に、共通の学術語として使用された言語は何か。", "ラテン語", 5], ["07", 135, "中世の学問の中心とされた、キリスト教の教理・信仰・倫理を研究するものは何か。", "神学", 6], ["07", 135, "キリスト教教理とアリストテレス哲学が結びついて体系化された、中世の神学・哲学を何と呼ぶか。", "スコラ学", 6], ["07", 135, "神や普遍という観念が存在すると考える、信仰を優先するスコラ学の立場は何か。", "実在論", 4], ["07", 135, "実在論をとなえ、「スコラ学の父」と呼ばれたカンタベリ大司教は誰か。", "アンセルムス", 4], ["07", 135, "神や普遍という観念は抽象的（名ばかり）にすぎず、実在するものは個々の事物だけとするスコラ学の立場は何か。", "唯名論", 4], ["07", 135, "唯名論を主張したフランスの学者は誰か。", "アベラール", 5], ["07", 136, "スコラ学で、実在論と唯名論の争いを何と呼ぶか。", "普遍論争", 3], ["07", 136, "普遍論争をいちおう解決したとされ、スコラ学の大成者と呼ばれる、13世紀に活躍したパリ大学教授は誰か。", "トマス＝アクィナス", 7], ["07", 136, "スコラ学を体系的に解説したトマス＝アクィナスの著作は何か。", "『神学大全』", 5], ["07", 136, "イスラーム科学の影響を受け、経験と観察を重視し、近代自然科学への道を開いた13世紀のイギリスのスコラ学者は誰か。", "ロジャー＝ベーコン", 6], ["07", 136, "唯名論に立ち、信仰と理性、神学と哲学を区別した、14世紀前半のイギリスのスコラ学者は誰か。", "ウィリアム＝オブ＝オッカム", 4], ["07", 136, "ギリシアの古典がアラビア語訳を通してラテン語に翻訳されたことで、スコラ学の隆盛・大学の誕生・ゴシック様式の創出など一連の知が開花したが、この12世紀におこった西欧の文化復興運動を何と呼ぶか。", "12世紀ルネサンス", 7], ["07", 136, "12世紀以降、多くのアラビア語文献のラテン語への翻訳活動の中心となったイベリア半島の都市はどこか。", "トレド", 5], ["07", 136, "トレドとならび、ギリシアの古典やアラビアの学術書のラテン語翻訳が盛んにおこなわれたシチリア島の都市はどこか。", "パレルモ", 2], ["07", 136, "中世の主要な大学には3学部（神学・法学・医学）があり、それらの各学部の基礎的な教養課程におかれた、文法から音楽までの7つの一般教養料目を何と呼ぶか。", "自由七科", 6], ["07", 136, "11世紀末、北イタリアに設立された世界最古の大学で、法学の研究で有名であったのはどこか。", "ボローニャ大学", 5], ["07", 136, "世界最古の大学の1つで、医学で有名であった南イタリアの大学はどこか。", "サレルノ大学", 3], ["07", 136, "12世紀半ば、パリ大司教を長として、私塾の教師や学生によって結成され、神学の最高権威となった大学はどこか。", "パリ大学", 6], ["07", 136, "12世紀後半、パリ大学を範に設立され、イギリスでの神学の中心となった大学はどこか。", "オクスフォード大学", 6], ["07", 137, "13世紀初め、パリ大学とオクスフォード大学から教師や学生が移って設立された、イギリスの大学はどこか。", "ケンブリッジ大学", 2], ["07", 137, "コレッジとも呼ばれる、オクスフォード大学、ケンブリッジ大学で発展した、独立した自治組織をもつ教育機関は何か。", "学寮", 2], ["07", 137, "11～12世紀に西欧で発達した、「ローマ風」を意味する、厚い石壁に小さな窓をもつ重厚な建築様式は何か。", "ロマネスク様式", 6], ["07", 137, "イタリアにおける、ロマネスク様式の代表的聖堂は何か。", "ピサ大聖堂", 4], ["07", 137, "11世紀に着工され、12世紀半ばに完成した、ドイツ中南部にあるロマネスク様式の代表的聖堂は何か。", "シュパイアー大聖堂", 2], ["07", 137, "12世紀に北フランスからおこった、尖頭アーチに薄い壁と広い窓をもち、大規模な教会建築の主流となった様式は何か。", "ゴシック様式", 6], ["07", 137, "ゴシック様式の教会の窓に使われた、彩色ガラスを何と呼ぶか。", "ステンドグラス", 6], ["07", 137, "12世紀に着工され , ["09", 157, "15世紀中頃全モンゴルを統一した、西北モンゴルを拠点としたモンゴル系の部族連合は何か。", "オイラト（瓦剌）", 6], ["09", 157, "オイラトの部族連合の指導者で、1449年、土木堡で明の第6代皇帝を捕らえた人物は誰か。", "エセン", 4], ["09", 157, "土木堡で捕らえられた明の第6代皇帝は誰か。", "正統帝", 3], ["09", 157, "正統帝が捕らえられたできごとを何と呼ぶか。", "土木の変", 6], ["09", 157, "モンゴル人の侵入が激化した16世紀に修築された建造物は何か。", "万里の長城", 7], ["09", 157, "モンゴル高原東部を拠点に、オイラトが勢力を失ったのち15世紀末から強勢となり、16世紀半ばに最盛期をむかえたモンゴル系諸部族の明側の呼称は何か。", "韃靼（タタール）", 6], ["09", 157, "16世紀半ば以降、たびたび明に侵攻して一時は北京を包囲した、モンゴルの族長は誰か。", "アルタン＝ハーン", 6], ["09", 158, "日本人を主体に朝鮮半島から遼東半島にかけて略奪行為をおこなった、14世紀の倭寇を何と呼ぶか。", "前期倭寇", 7], ["09", 158, "おもに中国人集団が中国沿岸で活動した、16世紀の倭寇を何と呼ぶか。", "後期倭寇", 7], ["09", 158, "五島列島や平戸を拠点に倭寇の頭目として活動した、明の密貿易商人は誰か。", "王直", 5], ["09", 158, "明を苦しめた、北方と南（東）方からの外敵の侵入を何と総称するか。", "北虜南倭", 6], ["09", 158, "明代後半、石見銀山などで産出され、日本から中国に輸出された日本産の銀を何と呼ぶか。", "日本銀", 6], ["09", 158, "16世紀以降、スペインが対アジア貿易に使用したラテンアメリカ産の銀貨を何と呼ぶか。", "メキシコ銀", 5], ["09", 158, "1543年、倭寇の頭目の一人王直が所有したとされる船でポルトガル人が漂着し、日本に鉄砲が伝来した、九州南方の島はどこか。", "種子島", 5], ["09", 158, "長江下流域の水田の一部が綿花や桑などの商品作物の栽培に転換され、生糸や綿織物などの家内制手工業が発達した結果、長江中流域が穀倉地帯の中心となったことを示す言葉は何か。", "「湖広熟すれば天下足る」", 6], ["09", 158, "絹織物業で繁栄した、江蘇省の商工業都市はどこか。", "蘇州", 2], ["09", 158, "大運河南端の要地として絹織物業で繁栄した、浙江省の商工業都市はどこか。", "杭州", 2], ["09", 158, "絹織物に用いるため、加工を施す前の、蚕の繭からとった糸を何と呼ぶか。", "生糸", 7], ["09", 158, "明代に政府直営の窯場がつくられ、中国随一の陶磁器生産地として栄えた江西省の都市はどこか。", "景徳鎮", 5], ["09", 158, "明代に発達した、白磁に赤・緑・黄・黒・青などの釉で文様を描いた装飾技法・陶磁器を何と呼ぶか。", "赤絵", 3], ["09", 159, "明初より、モンゴル勢力と対峙した北辺への軍糧補給と専売塩を扱う政商として活躍し、金融業を中心に全国的に活動した商人たちは、出身地の名から何と呼ばれたか。", "山西商人", 6], ["09", 159, "塩の売買で大きな利益をあげ、その後、金融業でも活躍した、安徽省出身の商人を何と呼んだか。", "徽州（新安）商人", 6], ["09", 159, "徽州（新安）商人や山西商人を代表とする、政府など政治権力と結びついて勢力を築いた商人を何と呼ぶか。", "特権商人", 3], ["09", 159, "商工業関係の同業・同郷者などが、親睦・互助のために都市に建てた施設を何と呼ぶか。", "会館・公所", 6], ["09", 159, "銀の流通増大を背景に、明代後半から清初にかけて実施された、租税と労役をまとめて銀に一本化して納入する新税制は何か。", "一条鞭法", 6], ["09", 159, "科挙を通じて得た資格や官僚経験をもつ地方社会の有力者を何と呼ぶか。", "郷紳", 4], ["09", 159, "元代の原作を明代に編纂した、北宋末の108人の豪傑の武勇を描いた口語小説は何か。", "『水滸伝』", 6], ["09", 159, "元代に歴史物語として発展したものに、元末～明初に羅貫中が加筆して完成させた、三国時代の抗争を英雄豪傑を通して描いた口語の歴史小説は何か。", "『三国志演義』", 6], ["09", 159, "元代に原型が成立し、明代後期に呉承恩が完成させた、玄奘のインド旅行を舞台に、妖怪説話が混入された口語小説は何か。", "『西遊記』", 6], ["09", 159, "『水滸伝』の一部を発展させて、豪商の欲望に満ちた生活を描いた、明末の口語風俗小説は何か。", "『金瓶梅』", 4], ["09", 159, "明末の画家董其昌がとなえた中国絵画の分類で、職業画家による北宗画に対するものとして、文人画系の様式を何と呼んだか。", "南宗画", 1], ["09", 159, "芝居とともに庶民に親しまれた、軍記物語や武勇伝などを、抑揚をつけて語り聞かせる演芸は何か。", "講談", 3], ["09", 159, "明で官学とされた、南宋の朱熹によって体系化された儒教哲学は何か。", "朱子学", 3], ["09", 160, "南宋の陸九淵の「心即理」をとなえる儒学を完成させた、明代の学者・政治家は誰か。", "王守仁（王陽明）", 6], ["09", 160, "陸九淵に始まる儒学は、完成者の名から何と呼ばれるか。", "陽明学", 6], ["09", 160, "本来もっている心そのものが人間の本質に合致すると考える、陽明学の代表的概念を示す言葉は何か。", "心即理", 1], ["09", 160, "陽明学の代表的概念の1つで、朱子学の知識重視に反対する立場から、無学な庶民にも本来そなわっている良知を重視し、良知と行動は一体であるとする考え方は何か。", "知行合一", 4], ["09", 160, "生まれながらの心を「童心」と呼んで欲望を積極的に肯定した、明末の陽明学の急進派を代表する思想家は誰か。", "李贄（李卓吾）", 1], ["09", 160, "明末に生まれた、「経世致用の学」とも呼ばれる、社会に役立つ学問を何と呼ぶか。", "実学", 2], ["09", 160, "明代（1596年）に刊行された、薬物に関する解説書は何か。", "『本草綱目』", 6], ["09", 160, "『本草綱目』の著者は誰か。", "李時珍", 6], ["09", 160, "明代（1639年）に刊行された、農業関係の総合書は何か。", "『農政全書』", 6], ["09", 160, "『農政全書』を編纂し、またキリスト教に入信した明末の政治家・学者は誰か。", "徐光啓", 6], ["09", 160, "明代（1637年）に刊行された、図入りの産業技術書は何か。", "『天工開物』", 6], ["09", 160, "『天工開物』の著者は誰か。", "宋応星", 6], ["09", 160, "1534年、イグナティウス＝ロヨラらによって創設され、積極的な海外布教を展開したカトリック修道会は何か。", "イエズス会(ジェズイット教団)", 6], ["09", 160, "イグナティウス＝ロヨラとともにイエズス会を創立し、初めインド・東南アジアで布教し、のち日本で伝道した宣教師は誰か。", "フランシスコ＝ザビエル", 5], ["09", 160, "利瑪竇の中国名をもち、明の万暦帝時代にイエズス会最初の伝道をおこなった、イタリア出身の宣教師は誰か。", "マテオ＝リッチ", 7], ["09", 160, "マテオ＝リッチの指導のもと作成された、中国最初の漢訳版世界地図は何か。", "「坤輿万国全図」", 7], ["09", 161, "徐光啓の指導下で事業が開始され、アダム＝シャールが完成させた、明末に編纂された暦法書は何か。", "『崇禎暦書』", 6], ["09", 161, "徐光啓の協力を得てマテオ＝リッチが漢訳した、エウクレイデスの数学書の前半部分の漢訳本は何か。", "『幾何原本』", 6], ["09", 161, "マレー半島南西岸のイスラーム王国として繁栄したが、1511年にポルトガルに占領された国はどこか。", "マラッカ（ムラカ）王国", 7], ["09", 161, "1511年のポルトガルによるマラッカ王国の占領後、逃れたマレー人が南下して建設した、マレー半島南部のイスラーム港市国家は何か。", "ジョホール王国", 3], ["09", 161, "15世紀末からスマトラ島北部に建てられ、海洋交易で繁栄したイスラーム国家は何か。", "アチェ王国", 7], ["09", 161, "16世紀前半にジャワ島西部に建てられ、コショウ交易で繁栄したイスラームの港市国家は何か。", "バンテン王国", 3], ["09", 161, "16世紀後半、ジャワ島中・東部に建てられ、稲作と交易で栄えたイスラーム国家は何か。", "マタラム王国", 6], ["09", 161, "コショウ・シナモン・クローヴといった東南アジアやインド産の香辛料を取引する貿易を何と呼ぶか。", "香辛料貿易", 6], ["09", 161, "パガン朝滅亡以来の混乱を終わらせ、16世紀前半～18世紀半ばに存在した、ビルマ人の統一王朝は何か。", "タウングー（トゥングー）朝", 6], ["09", 161, "14世紀半ばに建てられ、カンボジアのアンコール朝やタイ北部のスコータイ朝を支配下に入れ、中国・日本やヨーロッパとの貿易で繁栄したタイの王朝は何か。", "アユタヤ朝", 7], ["09", 161, "タイ語系ラオ人が14世紀に建てたラーンサーン王国に始まる、インドシナ半島内陸山岳地帯の国は何か", "ラオス", 1], ["09", 161, "16～17世紀前半に、ポルトガルとスペインの船によっておこなわれた対日貿易は、何と呼ばれるか。", "南蛮貿易", 5], ["09", 162, "1543年、ポルトガル人が種子島に漂着した際に日本に伝え、戦術や城の構造を一変させた武器は何か。", "鉄砲", 6], ["09", 162, "室町幕府を滅ぼし、全国統一をめざした、尾張出身の戦国大名は誰か。", "織田信長", 6], ["09", 162, "16世紀末、2度の朝鮮侵攻を命じた日本の武将は誰か。", "豊臣秀吉", 7], ["09", 162, "豊臣秀吉の2度にわたる朝鮮侵攻に対する、日本側の呼称は何か。", "文禄・慶長の役", 4], ["09", 162, "豊臣秀吉の2度にわたる朝鮮侵攻に対する、朝鮮側の呼称は何か。", "壬辰・丁酉倭乱", 5], ["09", 162, "朝鮮侵攻の際、日本水軍を撃破した朝鮮の武将は誰か。", "李舜臣", 6], ["09", 162, "李舜臣が改良した、甲板を厚板で覆った軍船は何か。", "亀船（亀甲船）", 2], ["09", 162, "17世紀初め、江戸幕府を開いた人物は誰か。", "徳川家康", 7], ["09", 162, "江戸時代初期、幕府から渡航許可証を与えられて東南アジアとの交易をおこなった船を何と呼ぶか。", "朱印船", 7], ["09", 162, "17世紀初め、東南アジア各地に進出した日本人がつくった集団的居住地を何と呼ぶか。", "日本町", 6], ["09", 162, "1624年にオランダが拠点を築いた、中国南部の福建省対岸の島はどこか。", "台湾", 4], ["09", 162, "1641年に江戸幕府が実施した、キリスト教禁止と貿易統制を目的に、対外通交を極端に制限する政策は何と呼ばれるか。", "「鎖国」", 6], ["09", 162, "中国東北地方に居住し、12世紀初めに金朝を建てたこともあるツングース系民族は何か。", "女真（女直、満洲人）", 7], ["09", 162, "遼東半島の北側に居住した女真の一派は何か。", "建州部", 2], ["09", 162, "遼東半島の北側に居住した建州部出身で、女真の統一に成功した人物は誰か。", "ヌルハチ", 6], ["09", 162, "ヌルハチが建州部を統一して名づけた国の名称であり、のちに女真にかわる民族名としても称するようになった、文殊菩薩に由来するともされる名称は何か。", "満洲", 6], ["09", 163, "中国東北地方全域に支配を拡大したヌルハチが、1616年に建てた国は何か。", "金（後金、アイシン）", 6], ["09", 163, "ヌルハチが編制した、独自の軍事・行政組織は何か。", "八旗", 6], ["09", 163, "八旗に属した武人階級を何と呼ぶか。", "旗人", 2], ["09", 163, "旗人に支給された土地を何と呼ぶか。", "旗地", 1], ["09", 163, "満洲語を表記するため、モンゴル文字をもとにヌルハチの命でつくられた民族文字は何か。", "満洲文字", 7], ["09", 163, "1626年に即位した、金（後金、清）の第2代皇帝は誰か。", "ホンタイジ（太宗）", 6], ["09", 163, "1625年にヌルハチが都とし、ホンタイジが改称した中国東北地方の都市はどこか。", "盛京（瀋陽）", 2], ["09", 163, "1635年、ホンタイジの時に服属した、内モンゴルを支配していたモンゴル系部族は何か。", "チャハル", 4], ["09", 163, "ホンタイジが、1636年に改めた国号は何か。", "清", 7], ["09", 163, "北虜南倭による軍事費増大のため財政難となるなど明が衰退期に入るなか、16世紀後半に幼少で即位した明の第14代皇帝は誰か。", "万暦帝", 3], ["09", 163, "万暦帝の幼少期、10年間にわたって首席内閣大学士として財政再建をはかった政治家は誰か。", "張居正", 5], ["09", 163, "張居正と対立して罷免され、帰郷後、学問所をつくり、激しい政治批判を展開した政治家は誰か。", "顧憲成", 2], ["09", 163, "顧憲成が、江蘇省無錫で再興した学問所の名称は何か。", "東林書院", 4], ["09", 163, "東林書院と密接な関係をもった政治的党派は何と呼ばれるか。", "東林派", 4], ["09", 163, "東林派と対立した、宦官と組んだ政治的党派は何と呼ばれるか。", "非東林派", 4], ["09", 163, "反乱続発のなか、1644年北京を占領されて自殺した、明最後の皇帝は誰か。", "崇禎帝", 1], ["09", 164, "1644年に明を滅ぼした、農民反乱軍の指導者は誰か。", "李自成", 6], ["09", 164, "マルコ＝ポーロがアジアでの経験や伝聞を口述した旅行記の名は何か。", "『世界の記述』（『東方見聞録』）", 5], ["09", 164, "日本は『世界の記述』では何と呼ばれたか。", "ジパング", 4], ["09", 164, "大航海時代にヨーロッパ諸国が東西交易で獲得しようとした、インドやマルク諸島原産のコショウやナツメグの総称は何か。", "香辛料", 6], ["09", 164, "15世紀前半にアフリカ西岸の探検を援助し、アフリカ西北端のセウタを攻略するなど、ポルトガルの海外発展の基礎を築き、「航海王子」とも呼ばれた王子は誰か。", "エンリケ", 6], ["09", 164, "アジア航路（インド航路）の開拓を支援した、15世紀後半のポルトガル王は誰か。", "ジョアン2世", 2], ["09", 164, "ジョアン2世の命で出港し、1488年にアフリカ南端を確認したポルトガルの航海者は誰か。", "バルトロメウ＝ディアス", 6], ["09", 164, "アフリカ南端の地点を、ジョアン2世は何と命名したか。", "喜望峰", 6], ["09", 164, "1498年、イスラーム教徒の水先案内でアジア航路の開拓に成功したポルトガルの航海者は誰か。", "ヴァスコ＝ダ＝ガマ", 7], ["09", 164, "ヴァスコ＝ダ＝ガマが到達したインド西南岸の港市はどこか。", "カリカット", 5], ["09", 164, "香料諸島への中継地として、1505年にポルトガル人が来航し、しだいに支配を固めたインド南端の島はどこか。", "セイロン島（スリランカ）", 3], ["09", 165, "1510年にポルトガルの遠征軍が占領し、総督府をおき、以後アジア進出の本拠地とした港市はどこか。", "ゴア", 6], ["09", 165, "1511年にポルトガルが占領した、マレー半島南西部の港市を拠点とした国家は何か。", "マラッカ（ムラカ）王国", 7], ["09", 165, "1512年のポルトガル、1521年のスペイン勢力の来航後、各国の争奪の的となった香辛料の主産地はどこか。", "マルク（モルッカ・香料）諸島", 4], ["09", 165, "1517年よりポルトガルとの取引が開始された、明の港湾都市はどこか。", "広州", 1], ["09", 165, "1517年の来航後、1557年にポルトガル人が明から居住権を獲得し、対明貿易の拠点となった広州南方の港市はどこか。", "マカオ", 7], ["09", 165, "1550年にポルトガル船が来航して南蛮貿易が開始された、長崎県北西部の島の港はどこか。", "平戸", 4], ["09", 165, "16世紀前半のポルトガルのように、領域を支配せず、海洋ルートの支配で交易独占をはかった国を何と呼ぶか。", "海上交易帝国", 2], ["09", 165, "16世紀を通じて香辛料貿易で繁栄した、ポルトガルの首都はどこか。", "リスボン", 6], ["09", 165, "1492年、スペイン女王の援助を受け、西まわりでのアジア航路開拓に出航したジェノヴァ生まれの航海者は誰か。", "コロンブス", 7], ["09", 165, "コロンブスを援助したスペイン女王は誰か。", "イサベル", 3], ["09", 165, "コロンブスに大きな影響を与えた、フィレンツェ生まれの天文・地理学者は誰か。", "トスカネリ", 5], ["09", 165, "コロンブスに大きな影響を与えた、トスカネリのとなえた説は何か。", "地球球体説", 6], ["09", 165, "第1回西航時にコロンブスの一行が最初に上陸したとされる、バハマ諸島の島はどこか。", "サンサルバドル島", 5], ["09", 166, "大航海時代前に、ヨーロッパ人がインドから日本にかけてのアジア大陸東半分を指して呼んだ名称は何か。", "インディアス", 2], ["09", 166, "コロンブスがインディアスと誤認したため、カリブ海東部の島々を総称するようになった名称は何か。", "西インド諸島", 4], ["09", 166, "コロンブスがインディアスに到達したと誤解したことから生まれた、アメリカ大陸先住民に対する呼称は何か。", "インディオ（インディアン）", 6], ["09", 166, "コロンブスのアジア到達の報に接し、教皇アレクサンデル6世が1493年に設定した、ポルトガル・スペインの勢力分界線を何と呼ぶか。", "教皇子午線", 1], ["09", 166, "ポルトガル・スペイン両国が協議して、1494年に教皇子午線を修正し、境界線を西方に移動した海外領土分割条約は何か。", "トルデシリャス条約", 3], ["09", 166, "イギリス王ヘンリ7世の後援で、ニューファンドランド・北アメリカ沿岸を探検したイタリアの航海者は誰か。", "カボット（父子）", 6], ["09", 166, "フランス王フランソワ1世の命により、現在のカナダ北西部セントローレンス川周辺を探検し、1534年にカナダの地を領有宣言した、フランスの航海者は誰か。", "カルティエ", 3], ["09", 166, "1500年、アジアに向かう航海中に嵐にあい、現在のブラジルに漂着したポルトガルの航海者は誰か。", "カブラル", 6], ["09", 166, "1499年からの数回にわたる探検で、コロンブス到達の地がアジアでないと判定したフィレンツェの航海者は誰か。", "アメリゴ＝ヴェスプッチ", 6], ["09", 166, "ドイツの地理学者がアメリゴ＝ヴェスプッチの名前にちなんで命名した、「新大陸」の名称は何か。", "「アメリカ」", 7], ["09", 166, "1513年にパナマ地峡を横断し、ヨーロッパ人としてはじめて太平洋に到達したスペインの探検家は誰か。", "バルボア", 6], ["09", 166, "1519年にスペイン王の援助を受けて西まわりで出発し、自身はフィリピンで戦死するも、部下が22年に帰港したことで初の世界周航が達成された、ポルトガルの航海者は誰か。", "マゼラン（マガリャンイス）", 7], ["09", 166, "マゼランが命名した「おだやかな海」とは、何を指すか。", "太平洋", 6], ["09", 167, "1571年に初代フィリピン総督のレガスピがルソン島に建設し、その後スペインの対アジア貿易の拠点となった港市はどこか。", "マニラ", 7], ["09", 167, "スペイン語では「コンキスタドール」といい、アメリカ大陸到達後、中南米で征服活動や植民地経営をおこなったスペイン人を何と称するか。", "「征服者」", 5], ["09", 167, "1521年にアステカ王国を滅ぼし、メキシコを征服したスペイン人は誰か。", "コルテス", 6], ["09", 167, "現在のメキシコシティに位置する、アステカ王国の首都はどこか。", "テノチティトラン", 3], ["09", 167, "1533年にインカ帝国を滅ぼし、ペルーを征服したスペイン人は誰か。", "ピサロ", 6], ["09", 167, "アンデス山脈の標高約3400m地帯に位置する、インカ帝国の首都はどこか。", "クスコ", 1], ["09", 167, "16世紀初めよりスペインが採用した、先住民のキリスト教徒化を条件に、植民者に先住民とその土地に対する支配を委託した制度を何と呼ぶか。", "エンコミエンダ制", 6], ["09", 167, "エンコミエンダ制のもとでのインディオの悲惨な状況をスペイン国王に訴えた、ドミニコ会修道士は誰か。", "ラス＝カサス", 7], ["09", 167, "エンコミエンダ制にかわり、17～18世紀に広まった、債務奴隷をおもな労働力とする大農園制を何と呼ぶか。", "アシエンダ制", 2], ["09", 167, "伝染病や酷使によるインディオ人口の激減を補うため、アフリカから、どのような人が労
