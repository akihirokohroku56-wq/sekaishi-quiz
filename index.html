, "デヴシルメと呼ばれる、キリスト教徒の優秀な男子をイスラーム教に改宗させて徴集する制度によって登用された、帝国の官僚・軍団兵士を何と呼ぶか。", "「スルタンの奴隷」（カプクル）", 6], ["10", 171, "「スルタンの奴隷」のうち、鉄炮や大砲などの火器で武装したスルタン直属の常備歩兵軍団を何と呼ぶか。", "イェニチェリ", 7], ["10", 171, "1514年にサファヴィー朝を破り、17年にはエジプトを征服したオスマン帝国のスルタンは誰か。", "セリム1世", 6], ["10", 171, "1517年、セリム1世に滅ぼされ、両聖都メッカ・メディナの保護権を奪われたエジプトのイスラーム王朝は何か。", "マムルーク朝", 6], ["10", 171, "オスマン帝国の全盛期を現出した、16世紀前半から後半にかけての第10代スルタンは誰か。", "スレイマン1世", 7], ["10", 171, "1526年のモハーチの戦いのあと、大半がオスマン帝国の支配下に入った東ヨーロッパの国（地域）はどこか。", "ハンガリー", 5], ["10", 171, "1529年、オスマン帝国がハプスブルク家が支配するオーストリアの都を包囲したできごとを何と呼ぶか。", "第1次ウィーン包囲（戦）", 6], ["10", 171, "1538年、オスマン海軍がギリシア西岸でスペイン・ヴェネツィア・教皇の連合艦隊を破った戦いは何か。", "プレヴェザの海戦", 6], ["10", 171, "スレイマン1世がイスタンブルに建立した、イスラーム建築の代表的モスクは何か。", "スレイマン＝モスク", 6], ["10", 172, "スレイマン＝モスクを建てたことで知られる建築家は誰か。", "シナン（スィナン）", 3], ["10", 172, "1571年、オスマン海軍がギリシア西岸の湾内で、スペイン・ヴェネツィア・教皇の連合艦隊に敗れた戦いは何か。", "レパントの海戦", 5], ["10", 172, "17世紀以降、ティマール制にかわりオスマン帝国で普及・拡大した徴税制度は何か。", "徴税請負制", 4], ["10", 172, "オスマン帝国で18世紀以降、徴税請負権を握り、地方社会の実質的な支配者となった人々を何と呼ぶか。", "アーヤーン", 3], ["10", 172, "シャリーア（イスラーム法）に対して、オスマン帝国で行政・世俗法を指す言葉は何か。", "カーヌーン", 3], ["10", 172, "オスマン帝国では地方行政も担当した、イスラーム世界の裁判官を何と呼ぶか。", "カーディー", 1], ["10", 172, "オスマン帝国から、貢納の代償に信仰や社会制度の維持を認められた非ムスリムの宗教共同体は何と呼ばれるか。", "ミッレト", 6], ["10", 172, "イスタンブルなど都市部の市場でまとまって店や工房を開き、キリスト教徒やユダヤ教徒が加わることもあった、オスマン帝国における同業組合を何と呼ぶか。", "エスナーフ", 2], ["10", 172, "スレイマン1世時代に一般化した慣習にもとづき、1569年にセリム2世がフランスにはじめて公認した、オスマン帝国領内での通商上の恩恵的特権を何と呼ぶか。", "カピチュレーション", 6], ["10", 172, "イスタンブルでは16世紀に専門店舗がつくられ、一般庶民から政府高官までが集い流行した店は何か。", "コーヒーハウス（コーヒー店）", 4], ["10", 172, "イェニチェリとともに従軍し、合奏曲を演奏して軍団の士気を鼓舞した、オスマン帝国の音楽隊は何か。", "軍楽隊（メフテル）", 3], ["10", 172, "16世紀初め、神秘主義教団の指導者によってイランに建てられた王朝は何か。", "サファヴィー朝", 7], ["10", 173, "神秘主義教団の指導者で、トルコ系遊牧民キジルバーシュの支持のもとサファヴィー朝を創始したのは誰か。", "イスマーイール（1世）", 5], ["10", 173, "サファヴィー朝の初期の首都はどこか。", "タブリーズ", 5], ["10", 173, "サファヴィー朝が採用した、「王」を意味するイランの伝統的な王号は何か。", "シャー", 5], ["10", 173, "サファヴィー朝はシーア派のなかの主流を占める穏健派を国教としたが、この穏健派の呼称は何か。", "十二イマーム派", 5], ["10", 173, "1514年にアナトリア東部でおこなわれた、サファヴィー朝の騎馬軍団がオスマン帝国のイェニチェリの鉄砲隊に破れた戦いは何か。", "チャルディラーンの戦い", 3], ["10", 173, "サファヴィー朝の第5代の王で、軍制改革を実施し、オスマン帝国からイラクを奪回するなど、16世紀後半～17世紀前半にかけて王朝の最盛期を現出したのは誰か。", "アッバース1世", 7], ["10", 173, "アッバース1世の時に遷都した、イラン中部の都市はどこか。", "イスファハーン", 7], ["10", 173, "イスファハーンが大いに繁栄した様子を表現する言葉は何か。", "「イスファハーンは世界の半分」", 7], ["10", 173, "アッバース1世の命でイスファハーンに建築された、美しい幾何学文様のタイルが表面をおおったモスクは何か。", "イマームのモスク（王のモスク）", 6], ["10", 173, "サファヴィー朝の貿易拠点として繁栄した港市バンダレ＝アッバースの対岸に位置し、アッバース1世がポルトガルから奪回した、ペルシア湾口の要衝の島はどこか。", "ホルムズ島", 4], ["10", 174, "1526年に成立した、インド史上最大のイスラーム国家は何か。", "ムガル帝国", 7], ["10", 174, "ティムールの子孫で、デリーを都にムガル帝国を建国し、回想録『バーブル＝ナーマ』がトルコ文学の傑作と評されたのは誰か。", "バーブル", 7], ["10", 174, "1526年にバーブルがデリー＝スルタン朝最後のロディー朝を破り、帝国創始のきっかけとなった戦いは何か。", "パーニーパットの戦い", 2], ["10", 174, "バーブルがインド侵攻の拠点とした、アフガニスタン東部の都市はどこか。", "カーブル", 2], ["10", 174, "バーブル死後の混乱から、16世紀後半にムガル帝国を再興した第3代皇帝は誰か。", "アクバル", 7], ["10", 174, "アクバルがデリーから遷都した都市はどこか。", "アグラ", 6], ["10", 174, "アクバルが定めた、すべての官僚に序列をつけ、その位階に応じて給与と保持すべき騎馬の数を決定するという官僚制度は何か。", "マンサブダール制", 6], ["10", 174, "ヒンドゥー教徒との和解やラージプート諸王国との融和を進めるため、アクバルが実施した政策は何か。", "人頭税（ジズヤ）の廃止", 7], ["10", 174, "インド社会で4つのヴァルナの外におかれた下層民を何と呼ぶか。", "不可触民", 3], ["10", 174, "イスラーム神秘主義の影響を受けてヒンドゥー教との融合をはかり、神ラーマへの絶対的帰依（バクティ）を説いた、15世紀後半の宗教改革者は誰か。", "カビール", 3], ["10", 174, "カビールの影響を受けて16世紀初めにヒンドゥー教を改革し、カースト制を否定する新宗教を開いたのは誰か。", "ナーナク", 7], ["10", 174, "ナーナクが開祖の一神教は何か。", "シク教", 6], ["10", 174, "パンジャーブ地方のアムリットサール市にあるシク教の総本山ハリマンディル＝サーヒブは、教典の章句を刻んだ金箔で覆われたことから通称何と呼ばれるか。", "黄金寺院", 5], ["10", 175, "イスラーム地域で発達した、書物の装飾や挿絵に描かれた彩色絵画は何か。", "写本絵画（ミニアチュール、細密画）", 6], ["10", 175, "写本絵画をもとに、ムガル帝国で発展した宮廷絵画を何と呼ぶか。", "ムガル絵画", 2], ["10", 175, "16世紀以降西北インドで栄えた、ヒンドゥー教の神々や庶民的な題材を扱った絵画を何と呼ぶか。", "ラージプート絵画", 2], ["10", 175, "17世紀前半のムガル帝国第5代皇帝で、インド＝イスラーム文化の最盛期を現出した人物は誰か。", "シャー＝ジャハーン", 6], ["10", 175, "シャー＝ジャハーンが、愛妃の死を悲しんでアグラに造営した、インド＝イスラーム建築の廟は何か。", "タージ＝マハル", 7], ["10", 175, "ムガル帝国の公用語は何か。", "ペルシア語", 6], ["10", 175, "インド＝ヨーロッパ語族の言語で、現在のインド共和国のうち北インドの主要な公用語は何か。", "ヒンディー語", 4], ["10", 175, "イスラーム勢力の北インド支配を契機に成立し、アラビア文字で表記する、現在のパキスタンの公用語は何か。", "ウルドゥー語", 4], ["10", 175, "1336～1649年のあいだ、西アジアとの交易や綿花・サトウキビなどの商品作物の栽培などで繁栄し、南インドを支配したヒンドゥー4王朝の総称は何か。", "ヴィジャヤナガル王国", 6], ["10", 175, "17世紀後半、外征に専念して帝国最大の領土を獲得した、ムガル帝国の第6代皇帝は誰か。", "アウラングゼーブ", 7], ["10", 175, "厳格なスンナ派イスラーム教徒のアウラングゼーブが非イスラーム教徒に対して復活させた迫害策は何か。", "人頭税（ジズヤ）の復活", 7], ["10", 175, "アクバル時代、ムガル帝国と平和的関係にあったが、アウラングゼーブの時代に激しく抵抗した、インド西部の古代クシャトリヤの子孫を自称するカースト集団は何か。", "ラージプート", 4], ["10", 175, "17世紀以降、アウラングゼーブの迫害を受けて武装化が進み、パンジャーブ地方でムガル帝国と軍事的に対立するようになったのは、何教の勢力か。", "シク教", 4], ["10", 176, "アウラングゼーブと戦ったマラーター（デカン高原西部のカースト集団）の指導者シヴァージーが、17世紀後半に建てたヒンドゥー教国家は何か。", "マラーター王国", 7], ["10", 176, "18世紀半ば、マラーター王国の実権を握った宰相を頂点に形成された、マラーター諸侯の緩やかな同盟は何か。", "マラーター同盟", 2], ["10", 176, "ヴィジャヤナガル王国の衰退に乗じて、17世紀初め南インドに成立したヒンドゥー王国（18世紀後半に一時イスラーム教国となる）は何か。", "マイソール王国", 2], ["10", 177, "渤海湾にのぞみ、万里の長城の東の起点となった要地の名称は何か。", "山海関", 2], ["10", 177, "山海関で清と対峙していたが、李自成の乱で明が滅亡すると清に降り、清の北京入城を先導した明の武将は誰か。", "呉三桂", 5], ["10", 177, "清に帰順した漢人武将で、中国統一を助け、清朝により各地の王に封ぜられた者を何と呼ぶか。", "藩王", 5], ["10", 177, "1644年の明滅亡を機に山海関をこえて長城内に入り、中国本土の支配を開始した清の第3代皇帝は誰か。", "順治帝", 1], ["10", 177, "1644年の李自成軍追討後、順治帝が盛京（瀋陽）から遷都した都はどこか。", "北京", 7], ["10", 177, "明の滅亡後、清朝と戦いその復活につとめ、1661年にはオランダ勢力を台湾から駆逐した人物は誰か。", "鄭成功", 7], ["10", 177, "鄭成功が南明（明の亡命政権）の王から朱姓を与えられたことから呼ばれた異名は何か。", "国姓爺", 4], ["10", 177, "鄭成功の父で、息子を清朝に降伏させようと説得したが失敗したのは誰か。", "鄭芝竜", 4], ["10", 177, "1661～83年の台湾を、その支配家の名称から何と呼ぶか。", "鄭氏台湾", 7], ["10", 177, "清が台湾の鄭氏一族を孤立させるために強化した、中国沿海の住民に奥地への強制移住を命じた遷界令に代表される海上交易の制限政策は何か。", "海禁政策", 7], ["10", 177, "海禁政策の解除にともない、民間交易を管理するため1685年に開港場に設置された税関を何と呼ぶか。", "海関", 3], ["10", 177, "中国王朝が国境付近に設置した公認の交易場のことで、広義には明朝後期以降の朝貢によらない民間交易体制をさして何と呼ぶか。", "互市", 3], ["10", 177, "1673年から中国南部で呉三桂ら3人の漢人武将がおこした反乱は何か。", "三藩の乱", 6], ["10", 177, "1681年に三藩の乱を、83年に台湾を平定して中国統一を完成させた、清朝の第4代皇帝は誰か。", "康熙帝", 7], ["10", 178, "君主独裁体制を強化した、清朝の第5代皇帝は誰か。", "雍正帝", 7], ["10", 178, "清朝の最大版図を実現し、康熙帝・雍正帝に続いて、18世紀末までの全盛期を現出した第6代皇帝は誰か。", "乾隆帝", 7], ["10", 178, "明の永楽帝が北京に建造し、清代に大改築がおこなわれた、明・清代の皇帝の宮殿は何か。", "紫禁城", 6], ["10", 178, "1689年、康熙帝の時代に南下してきたピョートル1世のロシアと対等な形式で結んだ条約は何か。", "ネルチンスク条約", 7], ["10", 178, "ネルチンスク条約で国境線の1つとされた、黒竜江の支流の名称は何か。", "アルグン川", 2], ["10", 178, "ネルチンスク条約で国境線の1つとされた、東シベリアを東西に走る山脈の名称は何か。", "スタノヴォイ山脈（外興安嶺）", 2], ["10", 178, "1727年、雍正帝の時代にロシアと結んだ、モンゴル方面での国境・通商の条約は何か。", "キャフタ条約", 5], ["10", 178, "康熙帝・雍正帝の親征を受け、その後乾隆帝によって1758年に滅ぼされたオイラトの一部族は何か。", "ジュンガル", 7], ["10", 178, "清が支配した、モンゴル・青海・チベット・新疆を何と総称したか。", "藩部", 7], ["10", 178, "藩部の地域を間接統治した事務機関は何か。", "理藩院", 6], ["10", 178, "雍正帝時代に藩部とされた、チベット高原北東部の山岳地域の名称は何か。", "青海", 5], ["10", 178, "18世紀半ば、乾隆帝時代に征服された、天山山脈以南のムスリム居住地域の名称は何か。", "回部", 1], ["10", 178, "18世紀半ばに征服したジュンガル盆地とタリム盆地を含む東トルキスタンを、清朝は何と命名したか。", "新疆", 7], ["10", 178, "古くから使用されてきたトルコ系有力者の称号は何か。", "ベグ", 4], ["10", 178, "14世紀末～15世紀初め、チベット仏教を改革した人物は誰か。", "ツォンカパ", 4], ["10", 179, "改革で生まれたきびしい戒律を守る一派で、17世紀以降チベット仏教の主流となったものの名称は何か。", "黄帽派（ゲルク派）", 7], ["10", 179, "アルタン＝ハーンが与えた、黄帽派チベット仏教の教主・政治の最高権力者の尊称は何か。", "ダライ＝ラマ", 7], ["10", 179, "チベット仏教で高僧の生まれ変わりとされる、転生ラマを何と呼ぶか。", "活仏", 3], ["10", 179, "7世紀に吐蕃が都として以降発展した、チベットの政治と宗教の中心地の名称は何か。", "ラサ", 4], ["10", 179, "17世紀にラサに建てられた、歴代ダライ＝ラマの宮殿は何か。", "ポタラ宮殿", 5], ["10", 179, "高麗で形成され、朝鮮時代には党争を繰り返した政治・社会の特権的支配階層を何と呼ぶか。", "両班", 7], ["10", 179, "清の中国征服により、朝鮮こそ明を継ぐ正統な中国文化の継承者だとする、朝鮮の思想を何と呼ぶか。", "「小中華」", 7], ["10", 179, "17世紀初め、琉球王国を武力で服属させた、薩摩の大名は何氏か。", "島津氏", 6], ["10", 179, "明・清に朝貢を続ける一方、17世紀初め琉球王国が島津氏に敗れて服属した体制を何と呼ぶか。", "両属体制", 6], ["10", 179, "琉球王国の都はどこか。", "首里", 3], ["10", 179, "徳川家康が江戸に開いた武家政権を何と呼ぶか。", "江戸幕府", 7], ["10", 179, "1641年以後、江戸幕府のもとでオランダ船の来航が許された港市はどこか。", "長崎", 7], ["10", 179, "江戸幕府のもとで、朝鮮外交の実務と貿易の独占を許された対馬の大名は何氏か。", "宗氏", 7], ["10", 179, "おもに将軍の代替わりを慶賀する名目で来日した、朝鮮から日本に派遣された使節は何と呼ばれるか。", "朝鮮通信使", 6], ["10", 180, "おもに北海道から樺太・千島にかけて居住する先住民は何か。", "アイヌ", 5], ["10", 180, "1604年に徳川家康からアイヌとの交易独占権を与えられたことにより形成された蝦夷地の藩は何か。", "松前藩", 5], ["10", 180, "「鎖国」体制下の日本で、海外に向けて開かれた4カ所の窓口（中国・オランダとの長崎、アイヌとの松前、朝鮮との対馬、琉球との薩摩）を何と呼ぶか。", "「四つの口」", 4], ["10", 180, "日本の古典を研究し、儒教・仏教の影響を受ける以前の日本民族固有の精神を明らかにしようとする学問は何か。", "国学", 2], ["10", 180, "オランダ東インド会社がジャワ島進出後、1619年に商館を建てるなどアジア貿易の拠点とした都市はどこか。", "バタヴィア", 6], ["10", 180, "イギリスとの3次にわたるビルマ戦争に敗北し、インド帝国に併合された、ビルマ最後の王朝は何か。", "コンバウン（アラウンパヤー）朝", 6], ["10", 180, "アユタヤ朝を滅したビルマ人勢力を追い出して、18世紀後半にバンコクを都に建てられた現タイ王朝は何か。", "ラタナコーシン（チャクリ）朝", 6], ["10", 180, "清代の人口増加にともない、東南アジアを中心に海外に移住した中国人を何と呼ぶか。", "「華人」（「華僑」）", 6], ["10", 180, "17世紀以降、黎朝が弱体化するとベトナムは二分され、ベトナム北部で実権を握った鄭氏に対して、ベトナム中・南部に広南王国を建てて争った一族は何か。", "阮氏", 2], ["10", 180, "広南王国および阮朝の都とされたベトナム中部の都市はどこか。", "フエ（ユエ）", 2], ["10", 180, "ヌルハチが自民族の兵で編制した軍事組織は何か。", "満洲八旗", 5], ["10", 180, "ホンタイジが、モンゴル兵で組織した軍事組織は何か。", "モンゴル（蒙古）八旗", 5], ["10", 180, "ホンタイジが、漢人で組織した軍事組織は何か。", "漢軍八旗", 5], ["10", 180, "清の北京入城後、明軍を再編して八旗を補完する役割を担った、漢人による清の正規軍は何か。", "緑営", 4], ["10", 181, "雍正帝時代に設けられた軍事行政上の最高機関で、のちに実質的な行政上の最高機関となったのは何か。", "軍機処", 5], ["10", 181, "清朝がとった、重要な役職の定員を偶数とし、満洲人と漢人を同数任命した制度を何と呼ぶか。", "満漢併用制", 7], ["10", 181, "清朝がとった弾圧策の1つで、漢人男性に強制した、満洲人の風習であった髪型を何と呼ぶか。", "辮髪", 7], ["10", 181, "反満・反清的な内容の文章や文字を書いた者を取り締まった、思想弾圧を何と呼ぶか。", "文字の獄", 6], ["10", 181, "反政府的書物の焼き捨てや刊行の禁止などのほか、清朝が統制の対象とした書物を何と呼ぶか。", "禁書", 6], ["10", 181, "康熙帝の命でつくられ完成した漢字字書は何か。", "『康熙字典』", 5], ["10", 181, "康熙帝の命で編纂され、雍正帝の時に完成された、1万巻の類書（百科事典）は何か。", "『古今図書集成』", 3], ["10", 181, "乾隆帝の命で編纂され完成した、古今の書物を集め4部に分類した一大叢書は何か。", "『四庫全書』", 5], ["10", 181, "科挙の合格者、官僚経験者で郷里に隠退した者など、地方社会における実力者は何と呼ばれたか。", "郷紳", 3], ["10", 181, "1757年、清の乾隆帝がヨーロッパ船の来航を1港に制限したが、このとき唯一認められた港はどこか。", "広州", 7], ["10", 181, "清代、広州での対外貿易を認められ独占した、特権商人組合を何と呼ぶか。", "行商（公行）", 6], ["10", 181, "18世紀に激増した人口に対応するため、山間部や荒れ地で栽培されたトウモロコシやサツマイモなどの輸入作物はどこから伝来したか。", "アメリカ大陸", 5], ["10", 181, "一条鞭法にかわり、康熙帝時代に始まり雍正帝時代にほぼ全国で実施された、人頭税を廃止し土地税に一本化した、清代の新税制を何と呼ぶか。", "地丁銀制", 6], ["10", 181, "明末におこった、儒学の経書を研究する際、確実な文献に典拠を求める実証的な学問を何と呼ぶか。", "考証学", 6], ["10", 182, "明の遺臣として清には仕えず、経世実用の学を尊び、『日知録』を著した、考証学の創始者の一人とされる明末清初の思想家は誰か。", "顧炎武", 6], ["10", 182, "反清復明運動につとめたのち、『明夷待訪録』を著すなど学問に没頭した、考証学の先駆者とされる明末清初の思想家は誰か。", "黄宗羲", 3], ["10", 182, "『二十二史考異』などで考証学的な史学研究法を確立した、清代考証学の大家は誰か。", "銭大昕", 4], ["10", 182, "貴族の家庭の栄枯盛衰を描き、全体の3分の2を曹雪芹が著した傑作長編小説は何か。", "『紅楼夢』", 6], ["10", 182, "科挙を風刺し、官吏の腐敗を描いた長編小説は何か。", "『儒林外史』", 4], ["10", 182, "蒲松齢が著した、民間の説話などからとった妖怪の物語などからなる、文語の短編怪異小説集は何か。", "『聊斎志異』", 3], ["10", 182, "湯若望の中国名をもち、明末に徐光啓とともに『崇禎暦書』を作成した、ドイツ出身のイエズス会宣教師は誰か。", "アダム＝シャール", 6], ["10", 182, "南懐仁の中国名をもち、アダム＝シャールを助けて布教や暦法作成・大砲鋳造などにつとめた、ベルギー出身のイエズス会宣教師は誰か。", "フェルビースト", 4], ["10", 182, "白進の中国名をもち、康熙帝に仕えて実測の中国地図を完成させた、フランス出身のイエズス会宣教師は誰か。", "ブーヴェ", 5], ["10", 182, "康熙帝の命により、ブーヴェやレジスらが10年かけて作成した、中国最初の実測地図は何か。", "「皇輿全覧図」", 4], ["10", 182, "郎世寧の中国名をもち、康熙・雍正・乾隆の3帝に仕えて西洋画法を紹介した、イタリア出身のイエズス会宣教師は誰か。", "カスティリオーネ", 6], ["10", 182, "カスティリオーネも設計に加わり北京郊外に造営された、バロック式と中国様式を融合した清朝の離宮は何か。", "円明園", 6], ["10", 182, "イエズス会の布教活動に端を発した、中国での布教方法に関するカトリック諸会派間の論争は何と呼ばれたか。", "典礼問題", 6], ["10", 182, "典礼問題に対して1724年に雍正帝が実施した方策は何か。", "キリスト教布教禁止", 6], ["10", 183, "17～18世紀のヨーロッパで流行した、中国趣味を意味する美術を何と呼ぶか。", "シノワズリ", 5], ["10", 183, "明末清初から河南や江南で頻発した、小作料をめぐる佃戸の地主に対する抵抗運動を何と呼ぶか。", "抗租", 1], ["10", 183, "清末に抗租とともに激化した、政府の税徴収に対する土地所有者の拒否運動を何と呼ぶか。", "抗糧", 1], ["11", 186, "15世紀後半～18世紀後半の、中世と近代のあいだを表すヨーロッパ史の時代区分名は何か。", "近世", 4], ["11", 186, "14世紀にイタリアで始まり、西欧各地に広まった、芸術・科学・思想上の新しい動きを何と呼ぶか。", "ルネサンス", 7], ["11", 186, "ビザンツ帝国やイスラーム圏からもたらされたギリシアの古典がギリシア語・アラビア語からラテン語に翻訳され、西欧の文化が発展した動きを何と呼ぶか。", "12世紀ルネサンス", 7], ["11", 186, "アルプス以北のルネサンスを何と総称するか。", "北方ルネサンス", 2], ["11", 186, "1453年に滅亡し、イタリアに古典文献がもたらされる要因をつくった帝国は何か。", "ビザンツ帝国", 4], ["11", 186, "イタリア＝ルネサンスの最大の中心となったトスカナ地方の都市共和国はどこか。", "フィレンツェ", 7], ["11", 186, "イタリア＝ルネサンス最大の庇護者（パトロン）となった、フィレンツェの富豪一族は何家か。", "メディチ家", 6], ["11", 187, "ルネサンスの理想とされた、絵画のほか自然諸科学や技術にもすぐれた人を何と呼ぶか。", "「万能人」", 3], ["11", 187, "レオナルド＝ダ＝ヴィンチの庇護者となるなど、「フランス＝ルネサンスの父」と呼ばれた国王は誰か。", "フランソワ1世", 3], ["11", 187, "メディチ家出身の教皇で、ローマにおけるルネサンスの最大の庇護者となった人物は誰か。", "レオ10世", 3], ["11", 187, "中世キリスト教的な禁欲主義を離れ、古代ギリシア・ローマのように豊かな人間性を追求するルネサンスの基本的思想は何か。", "人文主義(ヒューマニズム)", 6], ["11", 187, "近代化学成立以前のヨーロッパで流行した、鉛・銅などから金や銀をつくろうとする試みは何か。", "錬金術", 3], ["11", 187, "コロンブスに大きな影響を与えた、フィレンツェ生まれの天文・地理学者は誰か。", "トスカネリ", 2], ["11", 187, "コロンブスが西まわりでのインド到達をめざす根拠となった、トスカネリの説は何か。", "地球球体説", 2], ["11", 187, "地球は宇宙の中心で静止し、そのまわりをほかの天体がまわっているとする説を何と呼ぶか。", "天動説", 4], ["11", 187, "太陽を中心に、そのまわりを地球などの天体がまわっているとする説を何と呼ぶか。", "地動説", 7], ["11", 187, "天体観測にもとづいて地動説を説き、『天球回転論』を著したポーランドの天文学者・聖職者は誰か。", "コペルニクス", 7], ["11", 187, "ルネサンス期に改良が進んだ、中国からイスラーム圏を経てもたらされた火薬を使う、大砲や鉄砲などの武器を何と総称するか。", "火器", 6], ["11", 187, "火器の改良によって、近世ヨーロッパでおこった軍事上の変革を何と呼ぶか。", "軍事革命", 5], ["11", 188, "中国で実用化され、イスラーム圏を経て西欧に伝わり、大洋航海術を大きく前進させた技術は何か。", "羅針盤", 6], ["11", 188, "活字を組み合わせて原版をつくる印刷方法を何と呼ぶか。", "活版印刷術", 7], ["11", 188, "1450年頃、活版印刷術を改良し、実用化したドイツ人は誰か。", "グーテンベルク", 7], ["11", 188, "教会建築においては大円蓋と列柱を特徴とした、この時期の様式を何と呼ぶか。", "ルネサンス様式", 2], ["11", 188, "フィレンツェにあるルネサンス様式の大聖堂の大円蓋を完成させた、初期ルネサンスの建築家は誰か。", "ブルネレスキ", 5], ["11", 188, "「フィレンツェの誇り」と称され、ブルネレスキによる大円蓋で有名な初期ルネサンス様式の大聖堂は何か。", "サンタ＝マリア大聖堂", 4], ["11", 188, "16世紀初め、教皇ユリウス2世の時に新築された、カトリックの総本山の大聖堂の名称は何か。", "サン＝ピエトロ大聖堂", 3], ["11", 188, "ローマにあるサン＝ピエトロ大聖堂新築に際して、最初の設計者となった建築家は誰か。", "ブラマンテ", 2], ["11", 188, "多くの壁画や祭壇画が描かれている、ヴァチカン宮殿内の主要礼拝堂の名称は何か。", "システィナ礼拝堂", 2], ["11", 188, "代表作「聖フランチェスコの生涯」を描いたルネサンス様式絵画の先駆者は誰か。", "ジョット", 5], ["11", 188, "彫刻におけるルネサンス様式を確立した、代表作「聖ジョルジオ像」で知られる人物は誰か。", "ドナテルロ", 3], ["11", 188, "メディチ家の保護を受け、女性美を開放的に描いた作品「春」などで知られる画家は誰か。", "ボッティチェリ", 7], ["11", 188, "「春」とともにボッティチェリの代表作で、海の泡のなかから生まれてくる女神を描いた作品は何か。", "「ヴィーナスの誕生」", 6], ["11", 188, "「万能人」の典型とされ、「モナ＝リザ」などの絵画に加え、科学にもすぐれた功績を残した人物は誰か。", "レオナルド＝ダ＝ヴィンチ", 7], ["11", 188, "レオナルド＝ダ＝ヴィンチがミラノの聖堂の壁画として、受難前夜のキリストと十二使徒との夕食の様子をたくみな遠近法を用いて描いた作品は何か。", "「最後の晩餐」", 7], ["11", 189, "おもにフィレンツェとローマで活躍した、ルネサンスを代表する彫刻家・画家・建築家は誰か。", "ミケランジェロ", 7], ["11", 189, "ミケランジェロの代表的な彫刻作品で、『旧約聖書』の登場人物を力強い裸体の青年で表現し、自由・独立の精神を感じさせる作品は何か。", "「ダヴィデ像」", 6], ["11", 189, "ミケランジェロが描いた、システィナ礼拝堂正面の大祭壇画は何か。", "「最後の審判」", 4], ["11", 189, "「アテネの学堂」や、多くの聖母子像を描いた画家は誰か。", "ラファエロ", 7], ["11", 189, "14世紀末からフランドル地方を中心に活躍した画家たちとその画風を、何と総称するか。", "フランドル派", 3], ["11", 189, "油絵の技法を改良し、ガン（ヘント）の祭壇画などの宗教画や肖像画を多く描いた画家兄弟は誰か。", "ファン＝アイク兄弟", 5], ["11", 189, "「農民の踊り」など、農民の生き生きした姿や、自然を写実的に表現した作品を描いたネーデルラントの画家は誰か。", "ブリューゲル", 7], ["11", 189, "深い精神性を感じさせる多くの版画を残し、また作品「四人の使徒」を描いたドイツの画家は誰か。", "デューラー", 5], ["11", 189, "イギリスに渡りヘンリ8世の宮廷画家となり、またエラスムスらの肖像画を描いたドイツの画家は誰か。", "ホルバイン", 4], ["11", 189, "汎神論と地動説を主張し、宗教裁判で火刑に処された16世紀のイタリアの哲学者は誰か。", "ジョルダーノ＝ブルーノ", 2], ["11", 189, "14世紀前半に大叙事詩を著し、イタリア＝ルネサンスの先駆者と呼ばれるフィレンツェ人は誰か。", "ダンテ", 6], ["11", 189, "ダンテがトスカナ語で書いた、地獄編・煉獄編・天国編の3部からなる大叙事詩は何か。", "『神曲』", 6], ["11", 189, "14世紀のフィレンツェの詩人・人文主義者で、ローマの古典の収集と復活につとめた人物は誰か。", "ペトラルカ", 5], ["11", 189, "ラテン語による詩『アフリカ』と並び、ペトラルカの代表作とされるイタリア語の恋愛詩は何か。", "『叙情詩集』", 4], ["11", 190, "ギリシア古典を研究し、はじめてホメロスをギリシア語からラテン語に翻訳したことでも有名な人物は誰か。", "ボッカチオ", 5], ["11", 190, "14世紀半ばの黒死病流行期のフィレンツェを題材とした、ボッカチオの代表作は何か。", "『デカメロン』", 5], ["11", 190, "ネーデルラント出身で、「16世紀最大の人文主義者」といわれる人物は誰か。", "エラスムス", 7], ["11", 190, "聖職者らの悪徳を痛烈に風刺したエラスムスの著作は何か。", "『愚神礼賛』", 5], ["11", 190, "14世紀のイギリス＝ルネサンスの先駆的作家は誰か。", "チョーサー", 4], ["11", 190, "イギリス版『デカメロン』といわれる、社会風刺に富んだチョーサーの作品は何か。", "『カンタベリ物語』", 4], ["11", 190, "エラスムスの友人で、ヘンリ8世の離婚に反対し処刑された、イギリスの人文主義者は誰か。", "トマス＝モア", 6], ["11", 190, "架空の理想社会を描き、当時イギリスで展開されていた「第1次囲い込み」を批判したトマス＝モアの作品は何か。", "『ユートピア』", 6], ["11", 190, "エリザベス1世時代の、イギリス最大の詩人・劇作家は誰か。", "シェークスピア", 7], ["11", 190, "父王を殺されたデンマーク王子の復讐が内容の、シェークスピアの四大悲劇の1つとされる作品は何か。", "『ハムレット』", 4], ["11", 190, "医師を本業とする、フランス＝ルネサンス期の代表的作家は誰か。", "ラブレー", 5], ["11", 190, "架空の巨大な自然児とその子の正直で素朴な生き方を描いて、社会的因習を風刺したラブレーの作品は何か。", "『ガルガンチュアとパンタグリュエルの物語』", 6], ["11", 190, "合理主義と中庸の思想をもち、ユグノー戦争の調停にも奔走した、フランスの人文主義者は誰か。", "モンテーニュ", 4], ["11", 190, "モンテーニュが公私にわたる生活をかえりみて著した随筆集は何か。", "『エセー』（『随想録』）", 4], ["11", 190, "スペイン社会の矛盾を、ユーモアとペーソス（哀愁）にあふれた作品に表現した作家は誰か。", "セルバンテス", 6], ["11", 191, "正義感あふれる時代錯誤の騎士と現実的な従者の滑稽な冒険を描き、中世の騎士道を風刺したセルバンテスの作品は何か。", "『ドン＝キホーテ』", 6], ["11", 191, "メディチ家出身で、ドイツ宗教改革の直接の原因を生み出した教皇は誰か。", "レオ10世", 3], ["11", 191, "サン＝ピエトロ大聖堂の新築費捻出のため、レオ10世が販売を許可した証明書（符）は何か。", "贖宥状", 7], ["11", 191, "1517年、贖宥状の販売を批判して、ドイツで宗教改革を開始、『キリスト者の自由』を著した人物は誰か。", "ルター", 7], ["11", 191, "当時、ルターが神学教授をしていた大学のあった、ドイツ中部の小都市はどこか。", "ヴィッテンベルク", 3], ["11", 191, "ルターが1517年に発表した、贖宥状の販売を批判する文書は何か。", "「九十五カ条の論題」", 7], ["11", 191, "ルターがとなえた、聖職者は特別な人間ではなく、信徒すべてが聖職者たりうるという主張は何か。", "万人司祭主義", 2], ["11", 191, "神聖ローマ帝国が分裂状態にあったため、ローマ教会から搾取されたことをさげすんだ言葉は何か。", "「ローマの牝牛」", 2], ["11", 191, "1521年、ルターが呼び出され、自説の撤回を求められた帝国議会が開かれた都市はどこか。", "ヴォルムス", 3], ["11", 191, "ヴォルムスでの議会を招集した、神聖ローマ皇帝は誰か。", "カール5世", 5], ["11", 191, "カール5世から弾圧されたルターをヴァルトブルク城にかくまい保護した、反皇帝派の有力諸侯は誰か。", "ザクセン選帝侯フリードリヒ", 3], ["11", 192, "聖書中心主義をとるルターが、保護された城内でドイツ語訳を完成させたものは何か。", "『新約聖書』", 7], ["11", 192, "1524～25年、ドイツ南部・中部の農民が、農奴制や領主制の廃止をめざしておこした反乱は何と呼ばれるか。", "ドイツ農民戦争", 6], ["11", 192, "信仰を社会改革への要求と結びつけ、貧農の側についてドイツ農民戦争を指導した人物は誰か。", "ミュンツァー", 5], ["11", 192, "ドイツ農民戦争の平定後に始まった、諸侯が最高の司教として領内教会の保護支配権を握った制度は何か。", "領邦教会制", 4], ["11", 192, "1529年、ハプスブルク家と対立するオスマン帝国軍が、神聖ローマ帝国の都を包囲した事件は何か。", "第1次ウィーン包囲（戦）", 2], ["11", 192, "1530年にルター派のドイツ諸侯・都市が結成し、皇帝側と戦った同盟は何か。", "シュマルカルデン同盟", 3], ["11", 192, "1555年、ルター派信仰の容認と諸侯のカトリック派かルター派かの選択権を取り決めた、帝国議会の決議を何と呼ぶか。", "アウクスブルクの和議", 7], ["11", 192, "1529年、ルター派公認を取り消した皇帝に対して「抗議文」を提出したことが語源となって生まれた、改革派を総称する名称は何か。", "プロテスタント", 7], ["11", 192, "1523年にスイスで宗教改革を開始したが、保守派との戦いで戦死した人物は誰か。", "ツヴィングリ", 5], ["11", 192, "ツヴィングリが改革運動を開始した都市はどこか。", "チューリヒ", 5], ["11", 192, "フランスで福音主義をとなえたが迫害され、スイスに亡命して改革運動をおこなった神学者は誰か。", "カルヴァン", 7], ["11", 192, "1536年、カルヴァンがスイスの都市バーゼルで出版した主著は何か。", "『キリスト教綱要』", 3], ["11", 192, "『キリスト教綱要』の出版後にまねかれて、カルヴァンが神権政治をおこなった都市はどこか。", "ジュネーヴ", 6], ["11", 193, "カルヴァンが主著で主張した、魂の救済はあらかじめ神によって決められているとする考えを何と呼ぶか。", "予定説", 6], ["11", 193, "カルヴァン派の教会制度で、司教をおかず、牧師と信徒代表（長老）による教会運営を、何と呼ぶか。", "長老主義", 6], ["11", 193, "自営農民やジェントリを支持層とする、イングランドのカルヴァン派の呼称は何か。", "ピューリタン（清教徒）", 7], ["11", 193, "「長老派」を意味する、スコットランドのカルヴァン派の呼称は何か。", "プレスビテリアン", 3], ["11", 193, "フランスのカルヴァン派の呼称は何か。", "ユグノー", 5], ["11", 193, "ネーデルラントのカルヴァン派の呼称は何か。", "ゴイセン", 3], ["11", 193, "イギリス国教会を設立し、国内の修道院を解散させるなどカトリック圏から離脱したイギリス国王は誰か。", "ヘンリ8世", 7], ["11", 193, "ヘンリ8世が1534年に発布し、国教会制度とローマ教皇からの分離独立を確定した法は何か。", "首長法（国王至上法）", 7], ["11", 193, "国王を国内教会の唯一最高の首長とする、イギリスの国定教会を何と呼ぶか。", "イギリス国教会", 7], ["11", 193, "スペイン皇太子と結婚した熱心なカトリック教徒で、プロテスタントを弾圧し、「血まみれのメアリ」と呼ばれた女王は誰か。", "メアリ1世", 4], ["11", 193, "1558年に即位して宗教的混乱を収拾し、イギリス国教会を確立した女王は誰か。", "エリザベス1世", 7], ["11", 193, "エドワード6世が1549年に最初に制定し、エリザベス1世が1559年に3回目の制定をおこなって、国教会の礼拝・祈禱の統一をはかった法は何か。", "統一法", 7], ["11", 193, "台頭するプロテスタントに対抗しておこなわれた、カトリック側の自己革新運動を何と呼ぶか。", "カトリック改革（対抗宗教改革）", 6], ["11", 193, "1534年に設立され、教皇への絶対服従と厳格な規律のもとカトリック改革を展開した修道会は何か。", "イエズス会（ジェズイット教団）", 7], ["11", 194, "イエズス会を創設して初代総長となった、スペインの貴族出身の軍人は誰か。", "イグナティウス＝ロヨラ", 6], ["11", 194, "イグナティウス＝ロヨラとともにイエズス会を設立し、海外伝道で1549年に日本に来航した、スペイン人宣教師は誰か。", "フランシスコ＝ザビエル", 7], ["11", 194, "16世紀後半の万暦帝時代に中国での布教を開始した、イタリア出身のイエズス会宣教師は誰か。", "マテオ＝リッチ", 2], ["11", 194, "1545年から開催されたが、プロテスタント側が出席を拒否したため、カトリック側が教皇の至上権とその教義を再確認した公会議は何か。", "トリエント公会議", 6], ["11", 194, "とくにスペインで盛んに開かれた、異端者を発見・処罰する教会の法廷を何と呼ぶか。", "宗教裁判", 7], ["11", 194, "反カトリックとみなされ、その所持や流布を禁じられた書物と著者のリストを何と呼ぶか。", "禁書目録", 6], ["11", 194, "とくに宗教改革期以降に激化した、悪魔に魂を売った者とみなした人々に対しておこなわれた愚行は何か。", "「魔女狩り」", 7], ["11", 194, "ユリウス暦を修正し、1582年に教皇グレゴリウス13世が導入した暦は何か。", "グレゴリウス暦", 1], ["11", 194, "1494年から始まった、イタリア支配をめぐるフランス王と神聖ローマ皇帝との戦いは何か。", "イタリア戦争", 7], ["11", 194, "15世紀前半から神聖ローマ皇帝位をほぼ独占し、1516年からはスペイン王位をも占めるようになった家柄は何か。", "ハプスブルク家", 6], ["11", 195, "1516年にスペイン国王に即位したカルロス1世は、皇帝選挙で神聖ローマ皇帝となった。皇帝としての名称は何か。", "カール5世", 6], ["11", 195, "1519年、神聖ローマ皇帝選挙でカルロス1世に敗れ、以後彼と激しく衝突したフランス国王は誰か。", "フランソワ1世", 4], ["11", 195, "宗教・道徳から切り離し、現実主義的な政治を進める必要性を説いたフィレンツェの外交官は誰か。", "マキァヴェリ", 6], ["11", 195, "イタリア統一のためには「獅子の勇猛と狐の狡知を兼ねた人物こそが必要」と述べた、マキァヴェリの著作は何か。", "『君主論』", 6], ["11", 195, "イタリア戦争を終結させヨーロッパで主権国家体制が成立する契機となった、1559年の講和条約は何か。", "カトー＝カンブレジ条約", 4], ["11", 195, "明確な国境で囲まれた領域と、確立した主権をもつ近代国家を何と呼ぶか。", "主権国家", 6], ["11", 195, "主権をもつ多くの国家が成立し、それらがたがいに並立・競合して国際政治を展開する体制を何と呼ぶか。", "主権国家体制", 7], ["11", 195, "16～18世紀のヨーロッパで展開された、国王への集権化が進んだ政治体制を、とくに何と呼ぶか。", "絶対王政", 6], ["11", 195, "王の権力は神から授けられた神聖不可侵なものとする思想を何と呼ぶか。", "王権神授説", 7], ["11", 195, "王に従い、行政事務を担う役人集団体制は何か。", "官僚制", 6], ["11", 195, "絶対王政のもと、平時から常置された、傭兵からなる軍隊を何と呼ぶか。", "常備軍", 6], ["11", 195, "貴族・聖職者などの身分、ギルド・大学などの職能団体、都市や農村などの地域的団体といった、国王が国民を支配・統合する際の基本単位となった団体を何と呼ぶか。", "中間団体（社団）", 2], ["11", 195, "絶対王政時代におこなわれた、国家が積極的に経済活動に介入する経済政策は何か。", "重商主義", 7], ["11", 196, "16世紀後半、カルロス1世からスペイン王位を継承し、スペイン絶対王政の最盛期を現出した国王は誰か。", "フェリペ2世", 6], ["11", 196, "フェリペ2世が1571年、ヴェネツィアなどとの連合でオスマン帝国海軍を破った戦いは何か。", "レパントの海戦", 6], ["11", 196, "1580年にスペインが併合した、広大な海外領土をもつ隣国はどこか。", "ポルトガル", 6], ["11", 196, "世界最大の植民地帝国を形成したスペインを形容した呼称は何か。", "「太陽の沈まぬ帝国」", 6], ["11", 196, "中世以来、中継貿易や毛織物生産で繁栄したが、15世紀後半にハプスブルク家領、1556年にはスペイン領となった地域はどこか。", "ネーデルラント", 7], ["11", 196, "ネーデルラントのカルヴァン派が中心となり、スペインの圧政に対して1568年からおこした戦争は何か。", "オランダ独立戦争", 7], ["11", 196, "カトリック教徒が多く、スペインとアラス同盟を結んで独立戦争から離脱した地域（州）はどこか。", "南部10州", 4], ["11", 196, "1579年、北部7州が信仰の自由を獲得するまで戦うことを誓って結成した同盟は何か。", "ユトレヒト同盟", 5], ["11", 196, "北部7州のなかでもっとも有力で、「オランダ」の語源となった州はどこか。", "ホラント州", 3], ["11", 196, "ユトレヒト同盟結成の際の中心的指導者で、初代オランダ総督として1581年に独立宣言を出した人物は誰か。", "オラニエ公ウィレム", 6], ["11", 196, "1581年に独立を宣言し、1648年のウェストファリア条約で国際的に独立が承認された国の正式名は何か。", "ネーデルラント連邦共和国", 5], ["11", 196, "オランダの独立を支持して介入するイギリスと戦うため、1588年にスペインが派遣した艦隊は何と呼ばれていたか。", "無敵艦隊（アルマダ）", 7], ["11", 196, "イギリスの対外進出を進めた、16世紀後半のイギリス女王は誰か。", "エリザベス1世", 6], ["11", 196, "国家から外国船略奪の許可を受け、活動したイギリスの民間武装船を何と呼ぶか。", "私拿捕船（私掠船）", 3], ["11", 197, "イギリス人として初の世界周航に成功し、無敵艦隊との戦いでも副司令官として活躍した人物は誰か。", "ドレーク", 4], ["11", 197, "テューダー朝時代、地方の名望家として要職について地方行政を担った地主層は何と呼ばれるか。", "ジェントリ（郷紳）", 4], ["11", 197, "15世紀末～17世紀半ばに展開された、牧羊のために領主や地主が開放農地を小作人から取り上げて、生垣や塀で囲んだ動きを何と呼ぶか。", "第1次囲い込み（エンクロージャー）", 4], ["11", 197, "14世紀以降に発展した、イギリスの代表的産業は何か。", "毛織物工業", 5], ["11", 197, "1600年、エリザベス1世によって設立され、アジア全域での貿易独占権を与えられた会社は何か。", "東インド会社", 6], ["11", 197, "1607年に北米に建設された、イギリス最初の永続的な植民地はどこか。", "ジェームズタウン", 2], ["11", 197, "幼い国王の母として政治に介入し、フランスを大混乱におとしいれた、メディチ家出身の女性は誰か。", "カトリーヌ＝ド＝メディシス", 2], ["11", 197, "1562年から始まった、フランスの宗教戦争は何か。", "ユグノー戦争", 7], ["11", 197, "1572年、王の妹とナヴァル王との結婚を祝ってパリに集まったユグノーが大量虐殺された事件は何か。", "サンバルテルミの虐殺", 6], ["11", 197, "ユグノー戦争中のフランスで、絶対権力をもつ王が平和と秩序を維持すべきととなえた思想家は誰か。", "ボダン", 1], ["11", 197, "1589年、ヴァロワ朝の断絶で国王に即位し、その後、プロテスタントからカトリックに改宗した人物は誰か。", "アンリ4世", 6], ["11", 197, "アンリ4世の即位によって始まった、フランスの新王朝は何か。", "ブルボン朝", 5], ["11", 197, "1598年にアンリ4世が発布し、ユグノーに信仰の自由を認めて戦争を終結させた王令は何か。", "ナントの王令", 7], ["11", 197, "1618年にドイツで始まり、宗教対立からヨーロッパ諸国間の争いへと拡大した戦争は何か。", "三十年戦争", 7], ["11", 198, "三十年戦争のきっかけとなった、プロテスタント貴族の反乱はどこで発生したか。", "ベーメン（ボヘミア）", 6], ["11", 198, "皇帝軍に雇われ、デンマーク・スウェーデン軍を撃退した傭兵隊長は誰か。", "ヴァレンシュタイン", 4], ["11", 198, "フランスと同盟し、プロテスタント保護を名目として、三十年戦争に介入したスウェーデン王は誰か。", "グスタフ＝アドルフ", 5], ["11", 198, "1648年に締結され、ヨーロッパの主権国家体制を確立したといわれる講和条約は何か。", "ウェストファリア条約", 7], ["11", 198, "ウェストファリア条約が「神聖ローマ帝国の死亡診断書」ともいわれるのはどのような現象によるものか。", "神聖ローマ帝国の形骸化", 6], ["11", 198, "ウェストファリア条約で、ロレーヌ地方の一部とともに、フランスが神聖ローマ帝国から獲得した地域はどこか。", "アルザス", 3], ["11", 198, "ウェストファリア条約で、スウェーデンが神聖ローマ帝国から獲得した、バルト海沿岸のドイツ東北部の地域名は何か。", "西ポンメルン", 3], ["11", 198, "ウェストファリア条約で、独立を国際的に承認された2国はどこか。", "スイス・オランダ", 7], ["11", 198, "ウェストファリア条約で、ドイツ地域で新たに公認された宗派は何派か。", "カルヴァン派", 5], ["11", 198, "15世紀後半からオランダ独立戦争で破壊されるまで、中継貿易と金融業でヨーロッパ経済の中心として繁栄した、現在のベルギー北部の都市はどこか。", "アントウェルペン（アントワープ）", 4], ["11", 199, "オランダが、穀物や材木などを輸入してヨーロッパの産品を輸出する中継貿易で利益を得た海域はどこか。", "バルト海", 4], ["11", 199, "1602年、多くの貿易会社を統合して設立され、おもにアジア貿易を独占したオランダの会社は何か。", "東インド会社", 7], ["11", 199, "アントウェルペンにかわって、17世紀前半、ヨーロッパ経済の中心となったオランダの首都はどこか。", "アムステルダム", 7], ["11", 199, "インドの南東に位置し、1505年にポルトガルが支配下におき、その後17世紀半ばにオランダが支配権を握った島はどこか。", "セイロン島（スリランカ）", 2], ["11", 199, "1511年にポルトガルが、1641年にオランダが占領した、マレー半島南西岸の港市はどこか。", "マラッカ", 2], ["11", 199, "16世紀にポルトガルが、17世紀前半にオランダが勢力下においた、香辛料の大産地であった島々はどこか。", "マルク（モルッカ・香料）諸島", 2], ["11", 199, "オランダは、17世紀初頭にジャワ島西部の都市に商館を建設してアジアにおける拠点としたが、この地は1619年に何と改名されたか。", "バタヴィア", 7], ["11", 199, "1623年、マルク諸島の領有をめぐって、オランダがイギリス勢力をここから追い出した事件は何か。", "アンボイナ事件", 5], ["11", 199, "1624年、東アジア貿易の中継地としてオランダが占領した、中国福建省対岸の島はどこか。", "台湾", 3], ["11", 199, "1652年、オランダがアジア地域と本国との中継地として、アフリカ南端に建設した植民地はどこか。", "ケープ植民地", 5], ["11", 199, "17世紀前半ハドソン川下流域に形成された、オランダの北米植民地の名は何か。", "ニューネーデルラント植民地", 3], ["11", 199, "イギリス＝オランダ（英蘭）戦争で、イギリスがオランダから獲得してニューヨークと改称した都市はどこか。", "ニューアムステルダム", 6], ["11", 199, "1603年、スコットランド王が、テューダー家の血を引くことから、イングランド王に即位したことで成立した新王朝は何か。", "ステュアート朝", 6], ["11", 200, "イングランド王に即位し、王権神授説を信奉し、またピューリタン弾圧策をとった人物は誰か。", "ジェームズ1世", 6], ["11", 200, "ジェームズ1世の子かつつぎのイングランド王で、王権神授の姿勢を強め、専制的な政策をとった人物は誰か。", "チャールズ1世", 7], ["11", 200, "1628年、議会がその同意のない課税や不当逮捕などに反対して、チャールズ1世に提出した請願書を何と呼ぶか。", "権利の請願", 5], ["11", 200, "チャールズ1世による国教会制度の強制に対して、反乱をおこした地域はどこか。", "スコットランド", 4], ["11", 200, "戦費調達をもくろむチャールズ1世が1640年4月に招集し、国王への強い反発のため3週間で解散した議会を何と呼ぶか。", "短期議会", 2], ["11", 200, "チャールズ1世が、賠償金支払いのために1640年秋に招集し、1653年まで続いた議会を何と呼ぶか。", "長期議会", 2], ["11", 200, "1642～49年にかけてのイギリスの政治上の変革を、議会の多数を占めた宗派にちなんで何と呼ぶか。", "ピューリタン革命", 6], ["11", 200, "ピューリタン革命のなかで、おもに貴族・保守的ジェントリ・大商人から構成された、国王支持派は何か。", "王党（宮廷）派", 6], ["11", 200, "ピューリタン革命のなかで、ヨーマン・商工業者が中心となり、共和政を主張した議会（地方）派の一派は何か。", "独立派", 2], ["11", 200, "立憲王政とカルヴァン派の長老派教会を支持する議会派の派閥は何か。", "長老派", 3], ["11", 200, "ジェントリ出身の熱心なピューリタンで、独立派の指導者として王党派を破った軍人・政治家は誰か。", "クロムウェル", 6], ["11", 200, "クロムウェルが創設した、ジェントリとヨーマンを中心に編制した騎兵隊の通称は何か。", "鉄騎隊", 2], ["11", 200, "1649年のチャールズ1世の処刑後、コモンウェルスと呼ばれる政体が実現した。この政体は何か。", "共和政", 7], ["11", 200, "1649年、王党派の追討を口実に、クロムウェルが征服した地域はどこか。", "アイルランド", 6], ["11", 201, "チャールズ1世の息子を王と認めたためにクロムウェルによって征服された地域はどこか。", "スコットランド", 4], ["11", 201, "共和政期の1651年、オランダ船の締め出しを目的として発布された重商主義にもとづく法は何か。", "航海法", 6], ["11", 201, "航海法が原因で発生した、1650年代の第1次、60年代の第2次、70年代の第3次におよぶ戦争は何か。", "イギリス＝オランダ（英蘭）戦争", 7], ["11", 201, "1664年、イギリスはオランダ植民地の中心都市ニューアムステルダムを占領、改名した。改名後の都市名は何か。", "ニューヨーク", 4], ["11", 201, "1653年、議会を解散したのち、クロムウェルが就任した政治・軍事の最高官職は何か。", "護国卿", 4], ["11", 201, "クロムウェルの死後、1660年におこった政体の変化を何と呼ぶか。", "王政復古", 6], ["11", 201, "王政復古により、亡命先から帰国して国王に即位した、チャールズ1世の息子は誰か。", "チャールズ2世", 6], ["11", 201, "1673年、チャールズ2世のカトリック容認政策に反対する議会が制定した、公職就任者を国教徒に限るとした法は何か。", "審査法", 4], ["11", 201, "1679年、議会が国王の専制政治に対抗して制定した、不法な逮捕・投獄を禁じた法は何か。", "人身保護法", 5], ["11", 201, "チャールズ2世の弟の王位継承権を認めた議会内のグループ（党名）は何か。", "トーリ党", 6], ["11", 201, "チャールズ2世の弟の王位継承権を認めなかった議会内のグループ（党名）は何か。", "ホイッグ党", 6], ["11", 201, "1685年に即位した、チャールズ2世の弟で、専制政治の確立とカトリックの復活をはかった国王は誰か。", "ジェームズ2世", 6], ["11", 201, "1688～89年に、議会がジェームズ2世を廃位し王の娘とその夫のオランダ総督をまねいた政変を何と呼ぶか。", "名誉革命", 7], ["11", 201, "1689年、議会は「国王は議会の意思に反した行動をとれない」とする宣言を可決した。この宣言は何か。", "権利の宣言", 3], ["11", 202, "権利の宣言を承認して夫とともにイギリス国王に即位した、ジェームズ2世の娘は誰か。", "メアリ2世", 7], ["11", 202, "権利の宣言を承認して共同君主として即位したオランダ総督オラニエ公ウィレム3世の、イギリス国王としての名前は何か。", "ウィリアム3世", 7], ["11", 202, "1689年12月、カトリック教徒の国王即位を禁じ、王権に対する議会の優越を成文化した法令は何か。", "権利の章典", 7], ["11", 202, "1689年、プロテスタント全般の信仰の自由を保障した議会制定法は何か。", "寛容法", 2], ["11", 202, "名誉革命ののちにイギリスで確立された、君主が憲法などの法律にもとづいておこなう政治は何か。", "立憲君主政", 6], ["11", 202, "1702年に即位した、ステュアート朝最後の王は誰か。", "アン女王", 2], ["11", 202, "1707年、同君連合だったイングランドとスコットランドが合併して成立した国名は何か。", "グレートブリテン王国", 6], ["11", 202, "ステュアート朝の断絶でイギリス国王となった人物は、ドイツでどのような地位についていたか。", "ハノーヴァー選帝侯", 3], ["11", 202, "「王は君臨すれども統治せず」といわれる政治的状況を促進した、1714年に成立したイギリスの新王朝は何か。", "ハノーヴァー朝", 5], ["11", 202, "ハノーヴァー朝の初代国王は誰か。", "ジョージ1世", 3], ["11", 202, "イギリスの初代首相とみなされ、議会政治と内閣制度の基礎を固めた、ホイッグ党の政治家は誰か。", "ウォルポール", 6], ["11", 202, "ハノーヴァー朝のもとで成立した、議会の多数派が内閣を組織して議会に責任を負う制度を何と呼ぶか。", "議院内閣制(責任内閣制)", 6], ["11", 202, "1610年に即位し、絶対王政を確立したフランス国王は誰か。", "ルイ13世", 5], ["11", 202, "フィリップ4世の時代に設立されたが、1614年の招集を最後に1789年まで停止されていた議会は何か。", "全国三部会（三部会）", 4], ["11", 203, "ルイ13世期に宰相となり、大貴族やユグノーの勢力をおさえて王権の絶対化につとめた人物は誰か。", "リシュリュー", 5], ["11", 203, "1635年にリシュリューがフランス語の統一と純化を目的に創設した学術団体は何か。", "アカデミー＝フランセーズ", 3], ["11", 203, "1661年まで事実上の宰相として、幼いルイ14世を助けて中央集権化を進めた人物は誰か。", "マザラン", 5], ["11", 203, "1648年から53年にかけて、王権の伸張に反対する貴族たちがおこした反乱は何か。", "フロンドの乱", 7], ["11", 203, "王令を審査する権限をもち、フロンドの乱では貴族たちの拠点となった最高司法機関の名は何か。", "高等法院", 3], ["11", 203, "17世紀後半に親政を開始して、たびかさなる対外戦争をおこしたフランス王は誰か。", "ルイ14世", 7], ["11", 203, "ルイ14世が財務総監に登用した政治家は誰か。", "コルベール", 6], ["11", 203, "コルベールが重商主義政策の一環として、17世紀後半に改革・国営化した貿易会社は何か。", "東インド会社", 4], ["11", 203, "コルベールが重商主義政策の1つとして、毛織物業などで設立した王立の工場を何と呼ぶか。", "王立（特権）マニュファクチュア", 4], ["11", 203, "ルイ14世の異称は何か。", "「太陽王」", 6], ["11", 203, "ルイ14世の王太子の教育係をつとめ、王権神授説を主張した、宮廷聖職者は誰か。", "ボシュエ", 3], ["11", 203, "ルイ14世の言葉と伝えられる、国王と国家の利害を同一視する彼の政治観を象徴する言葉は何か。", "「朕は国家なり」", 6], ["11", 203, "絶対王政下では、王宮が国王の権力を誇示する場であったが、ルイ14世がパリ西南の地に建築させた、バロック様式の宮殿は何か。", "ヴェルサイユ宮殿", 6], ["11", 203, "カトリックを重視するルイ14世は、1685年にどのような宗教政策を実施したか。", "ナントの王令の廃止", 6], ["11", 203, "隣国の王朝断絶を受け、ルイ14世が孫の継承権を主張して1701年におこした戦争は何か。", "スペイン継承戦争", 6], ["11", 204, "1713年に締結されたスペイン継承戦争の講和条約は何か。", "ユトレヒト条約", 6], ["11", 204, "ユトレヒト条約でイギリスがスペインから獲得した、イベリア半島南端の半島はどこか。", "ジブラルタル", 5], ["11", 204, "ユトレヒト条約でイギリスがフランスから獲得した北米の3つの地域は、ハドソン湾地方・アカディアともう1つどこか。", "ニューファンドランド", 3], ["11", 204, "スペイン継承戦争の終結を目的に、1714年に神聖ローマ皇帝とルイ14世が調印し、南ネーデルラントをハプスブルク家領とした条約は何か。", "ラシュタット条約", 2], ["11", 204, "16世紀以降、オランダ・イギリス・フランスなどの強国は互いに争い、軍事力などにより、地理的に離れた他民族を直接支配下に置くようになったが、支配された地域は何と呼ばれたか。", "植民地", 7], ["11", 204, "1621年に特許状を獲得して設立された、アメリカ大陸とアフリカでの貿易独占権をもつオランダの会社の名前は何か。", "西インド会社", 3], ["11", 204, "北米のニューネーデルラント植民地の中心市として、オランダが建設した町の名前は何か。", "ニューアムステルダム", 6], ["11", 204, "1689～1815年の、英仏の植民地や貿易をめぐる覇権争いを何と称するか。", "第2次英仏百年戦争", 4], ["11", 204, "ヨーロッパでの七年戦争と並行しておこなわれた、北米でのイギリス・フランス間の植民地戦争は何か。", "フレンチ＝インディアン戦争", 5], ["11", 204, "1763年にイギリス・フランス・スペインのあいだで締結された、七年戦争と北米およびインドでの植民地戦争の講和条約の名称は何か。", "パリ条約", 6], ["11", 204, "1640年頃、イギリス東インド会社が商館を築いた、インド南東岸の海港はどこか。", "マドラス", 6], ["11", 204, "1660年代にポルトガルから譲り受け、イギリス東インド会社が商館を築いた、インド西岸の港市はどこか。", "ボンベイ", 5], ["11", 205, "1690年にイギリス東インド会社が商館を築いた、ベンガル地方の要地の大河港市はどこか。", "カルカッタ", 5], ["11", 205, "1670年代にフランスが獲得して商館を築いた、インド南東岸の町はどこか。", "ポンディシェリ", 6], ["11", 205, "1670年代にフランスが獲得して商館を築いた、ベンガル地方の町はどこか。", "シャンデルナゴル", 3], ["11", 205, "17～18世紀を中心に、ヨーロッパ・西アフリカ・アメリカ地域のあいだでおこなわれた貿易を何と呼ぶか。", "（大西洋）三角貿易", 7], ["11", 205, "大西洋三角貿易の一環として西アフリカの住民を、アメリカ大陸での労働力として運んだ貿易を何と呼ぶか。", "奴隷貿易", 5], ["11", 205, "スペイン政府が外国商人と結んだ、黒人奴隷の供給契約を何と呼ぶか。", "アシエント", 5], ["11", 205, "カリブ海地域やアメリカ大陸で発展した、おもに植民地や半植民地でタバコ・砂糖などの輸出用商品作物を生産する大農園制を何と呼ぶか。", "プランテーション", 4], ["11", 205, "17世紀初めに建国されて黒人奴隷貿易で栄え、19世紀末フランスの植民地となったギニア湾岸の国はどこか。", "ダホメ王国", 3], ["11", 205, "13～18世紀にかけて現在のナイジェリア地域に栄え、黒人を捕らえヨーロッパ商人に売った王国はどこか。", "ベニン王国", 4], ["11", 205, "16世紀からブラジルで、17世紀以降西インド諸島でも展開されたのは、おもに何のプランテーションか。", "サトウキビ", 6], ["11", 205, "1780年代以降、アメリカ合衆国南部で展開され、ホイットニーによる綿繰り機の発明で拡大したのは何のプランテーションか。", "綿花", 3], ["11", 205, "1694年に創設された、イギリス資本主義の発展を支えたイギリス中央銀行の名は何か。", "イングランド銀行", 4], ["11", 205, "国家が民間から資金を調達するために発行する債権は何か。", "国債", 5], ["11", 205, "イングランド銀行の設立と、国債制度の確立によるイギリスの金融・財政構造の変化を何と呼ぶか。", "財政革命", 4], ["11", 206, "奴隷貿易により17世紀末頃から発展しはじめた、イングランド北西部の海港都市はどこか。", "リヴァプール", 3], ["11", 206, "16世紀後半に断絶した、リトアニアとポーランドの連合王国の王朝名は何か。", "ヤゲウォ（ヤゲロー）朝", 5], ["11", 206, "ヤゲウォ朝の断絶後、ポーランドの政体はどのように変化したか。", "選挙王政", 6], ["11", 206, "18世紀後半、プロイセン・オーストリア・ロシアがポーランドに対してとった行動を何と呼ぶか。", "ポーランド分割", 7], ["11", 206, "第2回のポーランド分割がおこなわれる前年の1792年から、分割反対闘争を指導したポーランドの愛国者は誰か。", "コシューシコ（コシチューシコ）", 4], ["11", 206, "16世紀、モスクワ大公国の最盛期を現出し、「雷帝」と呼ばれた君主は誰か。", "イヴァン4世", 6], ["11", 206, "イヴァン4世から正式にツァーリの称号を使いはじめたが、ロシア皇帝が強力な専制君主として統治する政治体制は何と呼ばれるか。", "ツァーリズム", 6], ["11", 206, "南ロシアの辺境地帯に住み、自治的な集団を形成していた、騎馬に長じた戦士集団を何と呼ぶか。", "コサック", 6], ["11", 206, "16世紀後半、シベリア西部の探検をおこない、占領地をイヴァン4世に献上した、コサックの族長は誰か。", "イェルマーク", 3], ["11", 206, "1613年、貴族らの全国会議でロシア皇帝に選ばれた人物は誰か。", "ミハイル＝ロマノフ", 3], ["11", 207, "ミハイル＝ロマノフを開祖に成立したロシアの王朝は何か。", "ロマノフ朝", 6], ["11", 207, "1670年からの南ロシアでの農民反乱を指導した、コサックの首領は誰か。", "ステンカ＝ラージン", 5], ["11", 207, "17世紀末～18世紀前半、ロシアで西欧化改革をおこない、近代化・強国化につとめた皇帝は誰か。", "ピョートル1世（大帝）", 6], ["11", 207, "1689年、アルグン川およびスタノヴォイ山脈（外興安嶺）を境に露清間で結ばれた国境画定条約は何か。", "ネルチンスク条約", 6], ["11", 207, "ピョートル1世の治世の時にオスマン帝国から獲得した、黒海北東部の内海の名称は何か。", "アゾフ海", 3], ["11", 207, "バルト海の覇権をめぐって、ロシアが1700年から開始したスウェーデンとの戦争は何か。", "北方戦争", 6], ["11", 207, "北方戦争の時のスウェーデン王は誰か。", "カール12世", 3], ["11", 207, "北方戦争中に建設が開始され、「西欧への窓」として1712年にロシアの首都とされた都市はどこか。", "ペテルブルク", 7], ["11", 207, "ピョートル1世の命でシベリア探検をおこなった人物は誰か。", "ベーリング", 3], ["11", 207, "ベーリングの北米大陸探検で、ロシア領となった地域はどこか。", "アラスカ", 3], ["11", 207, "18世紀後半、クーデタによって夫から帝位を奪ってロシア皇帝となり、啓蒙専制的な政治を一時おこなった女性は誰か。", "エカチェリーナ2世", 7], ["11", 207, "エカチェリーナ2世は、1773年からの農民反乱を鎮圧後、反動化した。この農民反乱は何と呼ばれるか。", "プガチョフの農民反乱", 6], ["11", 207, "エカチェリーナ2世の時代、ロシアがオスマン帝国から獲得した黒海北岸の半島はどこか。", "クリミア半島", 6], ["11", 207, "エカチェリーナ2世の時代にロシアに滅ぼされた、オスマン帝国の宗主権下にあったクリミア半島のイスラーム教国は何か。", "クリミア（クリム）＝ハン国", 1], ["11", 208, "1792年、日本に漂流民を送還し、同時に通商を求めるため根室に派遣されたロシアの軍人は誰か。", "ラクスマン", 4], ["11", 208, "13世紀にドイツ騎士団領をもとに形成された、バルト海沿岸の国は何か。", "プロイセン", 7], ["11", 208, "14世紀半ばの金印勅書で七選帝侯国の1つとされた、ドイツ東北部の国はどこか。", "ブランデンブルク選帝侯国", 5], ["11", 208, "15世紀にブランデンブルク選帝侯国の支配者となった家門はどこか。", "ホーエンツォレルン家", 4], ["11", 208, "ドイツ騎士団領が世俗化して成立し、1618年にはブランデンブルク選帝侯国と合邦して、以後ホーエンツォレルン家が支配した国の名称は何か。", "プロイセン公国", 7], ["11", 208, "15世紀以降、ブランデンブルク選帝侯国の首都となった都市はどこか。", "ベルリン", 2], ["11", 208, "プロイセンの君主で、17世紀に中央集権体制を整備し、ユグノーを受け入れるなどの政策でプロイセンを強大化させた選帝侯は誰か。", "フリードリヒ＝ヴィルヘルム（大選帝侯）", 2], ["11", 208, "プロイセン社会の支配階層の中心勢力である、地主貴族を何と呼ぶか。", "ユンカー", 6], ["11", 208, "スペイン継承戦争に際し、皇帝側に立って参戦することと引きかえに昇格し、プロイセン公国は何と称するようになったか。", "プロイセン王国", 5], ["11", 208, "プロイセン王国の第2代国王で、「兵隊王」の異名をとり、軍国主義的絶対王政の基礎を築いた人物は誰か。", "フリードリヒ＝ヴィルヘルム1世", 4], ["11", 208, "1740年にプロイセン王国の王となり、官僚制と軍隊の強化や学芸の振興にもつとめた啓蒙専制君主は誰か。", "フリードリヒ2世（大王）", 7], ["11", 208, "オーストリアがその典型である、複数の民族が住む地域から構成される国家を何と呼ぶか。", "複合民族国家", 2], ["11", 208, "17世紀末～18世紀半ば、オーストリアのウィーンに建造されたバロック様式の王宮は何か。", "シェーンブルン宮殿", 1], ["11", 209, "1683年にオスマン帝国がオーストリアの都を包囲した軍事行動は何か。", "第2次ウィーン包囲（戦）", 5], ["11", 209, "1699年にオーストリアなど3国がオスマン帝国と結び、オーストリアがハンガリーを獲得した条約は何か。", "カルロヴィッツ条約", 5], ["11", 209, "1740年、ハプスブルク家領を継承した女性は誰か。", "マリア＝テレジア", 6], ["11", 209, "マリア＝テレジアの帝位継承にバイエルン選帝侯らが反発したことからおこった戦争は何か。", "オーストリア継承戦争", 6], ["11", 209, "オーストリア継承戦争の直前にプロイセン王が占領し、戦後も領有に成功したオーストリア領の地域はどこか。", "シュレジエン", 6], ["11", 209, "オーストリア継承戦争の講和条約であるアーヘンの和約で神聖ローマ皇帝と認められた、マリア＝テレジアの夫は誰か。", "フランツ1世", 4], ["11", 209, "シュレジエンの奪回をめざし、オーストリアが宿敵フランスと同盟を策した国際関係の変化は何と呼ばれるか。", "「外交革命」", 6], ["11", 209, "「外交革命」に対し、イギリスの援助を受けたプロイセンの先制攻撃で始まった戦争は何か。", "七年戦争", 7], ["11", 209, "啓蒙思想の影響を受けた君主が、自国の近代化のために様々な改革を推進する体制を何と呼ぶか。", "啓蒙専制主義", 3], ["11", 209, "プロイセンのフリードリヒ2世が文通・接触した、フランスの啓蒙思想家は誰か。", "ヴォルテール", 7], ["11", 209, "啓蒙思想の影響を受けたフリードリヒ2世が述べたとされる言葉は何か。", "「君主は国家第一の僕」", 6], ["11", 209, "マリア＝テレジアの息子で、オーストリアの啓蒙専制君主とされる人物は誰か。", "ヨーゼフ2世", 7], ["11", 209, "ヨーゼフ2世が発布した、非カトリック教徒にも信仰の自由を認める法令は何か。", "宗教寛容令", 4], ["11", 210, "ヨーゼフ2世が1781年に農民に人格的な自由を認めようとしたことを何と呼ぶか。", "農奴解放", 5], ["11", 210, "ローマ帝国時代はウィンドボナと呼ばれ、ハプスブルク家の宮廷がおかれて発展した都市はどこか。", "ウィーン", 3], ["11", 210, "フリードリヒ2世がポツダムに建てた、ロココ様式の代表的な建築は何か。", "サンスーシ宮殿", 7], ["11", 210, "国王が定住し、宮廷および首都が成立したことを背景に、国王や貴族などの上流階級が主導して栄えた文化は何か。", "宮廷文化", 4], ["11", 210, "17～18世紀初めまで西欧で流行した、豪壮・華麗を特色とする美術様式は何か。", "バロック美術", 5], ["11", 210, "宗教・歴史を題材として、バロック様式の大作を残したフランドル派の画家は誰か。", "ルーベンス", 4], ["11", 210, "クレタ島生まれで、16世紀後半からスペインのトレドに住み、宗教画や肖像画を多く残した画家は誰か。", "エル＝グレコ", 4], ["11", 210, "宮廷画家として、光線の表現を工夫した作品を多く残した、17世紀スペインの代表的画家は誰か。", "ベラスケス", 5], ["11", 210, "やわらかく明るい色彩で多くのバロック様式の宗教画を残した、17世紀スペインの画家は誰か。", "ムリリョ", 1], ["11", 210, "イギリスの宮廷画家となり、チャールズ1世などの肖像画を残したフランドル派の画家は誰か。", "ファン＝ダイク", 2], ["11", 210, "18世紀前半から半ばにかけてフランスを中心に流行した、繊細・優美を特色とする美術様式は何か。", "ロココ様式", 5], ["11", 211, "優雅な田園・宮廷画が多い、フランスのロココ様式の代表的な画家は誰か。", "ワトー", 4], ["11", 211, "17世紀フランスを中心に展開した、形式美のもとで理性的な作品を追求した文芸思潮を何と呼ぶか。", "古典主義", 5], ["11", 211, "フランス古典主義文学を創始した、悲劇作家は誰か。", "コルネイユ", 3], ["11", 211, "一時ルイ14世に仕えたことがある、フランス古典主義悲劇を大成した作家は誰か。", "ラシーヌ", 3], ["11", 211, "フランス古典主義文学において、鋭い人間観察にもとづく作品を残した喜劇作家は誰か。", "モリエール", 5], ["11", 211, "「音楽の父」と称される、バロック音楽を大成させたドイツの作曲家は誰か。", "バッハ", 6], ["11", 211, "ドイツ生まれではあるが、後半生はイギリス宮廷音楽家として活躍したバロック音楽家は誰か。", "ヘンデル", 3], ["11", 211, "オーストリアの古典派の作曲家で、交響曲「時計」などで知られ、「交響楽の父」と称されるのは誰か。", "ハイドン", 3], ["11", 211, "オーストリア出身で幼少時より各国宮廷で活躍した、歌劇「魔笛」などで知られる古典派の作曲家は誰か。", "モーツァルト", 6], ["11", 211, "17世紀後半のイギリスで盛んであった、ピューリタンの生き方・心情を主張した文学を何と呼ぶか。", "ピューリタン文学", 3], ["11", 211, "大叙事詩『失楽園』を完成させた詩人は誰か。", "ミルトン", 3], ["11", 211, "寓意物語『天路歴程』の著者は誰か。", "バンヤン", 3], ["11", 211, "17世紀に、近代自然科学が急速に発展したことを何と呼ぶか。", "科学革命", 7], ["11", 211, "1633年、コペルニクスの地動説を擁護し宗教裁判にかけられた、イタリアの天文・物理学者は誰か。", "ガリレイ（ガリレオ＝ガリレイ）", 7], ["11", 211, "17世紀初め、惑星運行の法則を確認し、近代天文学の基礎を築いたドイツの天文学者は誰か。", "ケプラー", 6], ["11", 212, "17世紀前半に、血液の循環を立証したイギリスの生理学者（医者）は誰か。", "ハーヴェー", 4], ["11", 212, "17世紀後半、気体力学の法則を発見し、「近代化学の父」と呼ばれたイギリスの物理・化学者は誰か。", "ボイル", 5], ["11", 212, "万有引力の法則の発見などで、近代物理学の創始者となったイギリスの数学・物理学者は誰か。", "ニュートン", 7], ["11", 212, "ニュートンの主著『自然哲学の数学的原理』の、一般的に知られる略称は何か。", "『プリンキピア』", 5], ["11", 212, "顕微鏡を改良し、観察した結果を『ミクログラフィア』にまとめたイギリスの科学者は誰か。", "フック", 2], ["11", 212, "18世紀に、植物の分類学を確立したスウェーデンの学者は誰か。", "リンネ", 4], ["11", 212, "18世紀後半、燃焼理論を確立し、質量保存の法則を打ち立てたフランスの化学者は誰か。", "ラヴォワジェ", 4], ["11", 212, "18世紀末、種痘法を開発し、予防接種という方法を始めたイギリスの医師は誰か。", "ジェンナー", 4], ["11", 212, "宇宙進化論を説いた、フランスの天文・数学者は誰か。", "ラプラース", 4], ["11", 212, "経験によらなくても、明らかな原理があれば理性を通じて確実な認識に至ることができるという考え方は何か。", "合理主義", 6], ["11", 212, "イギリスで発展した、観察や実験などの経験を重ねることで正しい認識が得られるという考え方は何か。", "経験主義（経験論）", 6], ["11", 212, "16～17世紀にかけて、経験主義の基礎を確立し、『新オルガヌム』を著した哲学者は誰か。", "フランシス＝ベーコン", 5], ["11", 212, "経験主義から懐疑主義に至った18世紀の哲学者は誰か。", "ヒューム", 1], ["11", 212, "主著『方法序説』で合理主義の方法論を説いた、17世紀前半のフランスの数学者・哲学者は誰か。", "デカルト", 6], ["11", 212, "デカルトがその主著で述べた、合理主義哲学の方法を示す有名な言葉は何か。", "「われ思う、ゆえにわれあり」", 3], ["11", 213, "主著『パンセ』『瞑想録』の「人間は考える葦である」という言葉で知られる、フランスの数学者・物理学者・哲学者は誰か。", "パスカル", 6], ["11", 213, "神と万物とは同一と考え、汎神論をとなえたオランダの哲学者は誰か。", "スピノザ", 5], ["11", 213, "微分・積分学を創始し、哲学では単子（モナド）論を説いたドイツの哲学者・数学者は誰か。", "ライプニッツ", 5], ["11", 213, "イギリスと大陸の哲学を統合して、認識能力の限界を究明する批判哲学をとなえたドイツの哲学者は誰か。", "カント", 5], ["11", 213, "1781年に刊行された、カントの主著は何か。", "『純粋理性批判』", 3], ["11", 213, "カントに始まる、合理主義と経験主義の2つの立場を統合して展開された哲学思想は何か。", "ドイツ観念論哲学", 4], ["11", 213, "社会の基盤を構成する、人間の本性にもとづく倫理的・普遍的な法則は何か。", "自然法", 7], ["11", 213, "たがいに敵対する混乱を避けるため、国家に統治の全権をゆだねたと考えたイギリスの思想家は誰か。", "ホッブズ", 6], ["11", 213, "「国家に統治の全権をゆだねる」考えを提唱した、ホッブズの主著は何か。", "『リヴァイアサン』", 4], ["11", 213, "『リヴァイアサン』のなかで、ホッブズが、人間の自然権の行使によっておこるであろう状態を説いた言葉は何か。", "「万人の万人に対する闘い」", 3], ["11", 213, "人民主権の立場から抵抗権（革命権）を認めて、名誉革命を正当化したイギリスの思想家は誰か。", "ロック", 6], ["11", 213, "政府への支配権の委任は人民の財産権や幸福の追求を大前提とすると述べた、ロックの主著は何か。", "『統治二論』（『市民政府二論』）", 5], ["11", 213, "自然法を国家間の関係に適応させ、「国際法の祖」と呼ばれたオランダの法学者は誰か。", "グロティウス", 7], ["11", 213, "グロティウスが国際法の考え方を、貿易・航海の自由に適用させた著作は何か。", "『海洋自由論』", 4], ["11", 213, "グロティウスが三十年戦争の惨禍をみて、戦時でも守るべき国際法規の確立を主張した著作は何か。", "『戦争と平和の法』", 5], ["11", 214, "近世ヨーロッパに広がった、社会の矛盾を変革することでよりよい時代へと進歩していこうとする思想は何か。", "進歩主義", 3], ["11", 214, "理性絶対の立場から社会の諸矛盾を合理的に批判し、民衆を無知から解放しようとする考え方を何と呼ぶか。", "啓蒙思想", 7], ["11", 214, "重商主義を批判し、個人の経済活動の自由を認め、富の源泉は農業生産にあると考えた経済思想を何と呼ぶか。", "重農主義", 4], ["11", 214, "重農主義のフランス人指導者は誰か。", "ケネー", 5], ["11", 214, "富の源泉は農業生産にあるとした、ケネーの主著は何か。", "『経済表』", 3], ["11", 214, "ケネーの弟子で、フランス革命前に財務総監となり、財政再建を試みた人物は誰か。", "テュルゴ", 6], ["11", 214, "経済活動における自由放任主義を受け継ぎ、自由主義経済学を完成させたイギリスの経済学者は誰か。", "アダム＝スミス", 7], ["11", 214, "1776年に刊行され、はじめて資本主義社会を体系的に分析したアダム＝スミスの主著は何か。", "『諸国民の富』（『国富論』）", 6], ["11", 214, "経済活動における国家の干渉や統制の排除をとなえる、自由放任主義の標語は何か。", "「なすに任せよ」（レッセ＝フェール）", 5], ["11", 214, "アダム＝スミスによって創始された自由主義経済学を、「資本主義分析の古典」といった意味から、何と別称するか。", "古典派経済学", 5], ["11", 214, "自然法思想を基礎として、社会も国家も人民相互の契約によって成立すると考える政治学説は何か。", "社会契約説", 5], ["11", 214, "イギリスの議会政治を手本に、権力の分立と王権の制限をとなえたフランスの法律家・思想家は誰か。", "モンテスキュー", 7], ["11", 214, "モンテスキューが1748年に出版した、諸国の社会を考察し政治における権力分立を説いた著書は何か。", "『法の精神』", 6], ["11", 214, "イギリスの文物を賛美するとともに、フランスの後進性を批判したヴォルテールの著書は何か。", "『哲学書簡』", 4], ["11", 215, "きびしい社会批判をおこない、のちのフランス革命にもっとも影響を与えた思想家は誰か。", "ルソー", 7], ["11", 215, "私有財産制が人間の不平等の原因であると考え、絶対王政下のフランス社会を批判したルソーの著書は何か。", "『人間不平等起源論』", 4], ["11", 215, "自然状態を理想化し、人民主権論を強く主張し、フランス社会の現状打破を説いたルソーの著書は何か。", "『社会契約論』", 6], ["11", 215, "フランス啓蒙思想の集大成とされる百科事典は何か。", "『百科全書』", 6], ["11", 215, "『百科全書』の編集の中心になった哲学者は誰か。", "ディドロ", 6], ["11", 215, "ディドロに協力して『百科全書』の編集にたずさわった、フランスの数学者・哲学者は誰か。", "ダランベール", 6], ["11", 215, "17世紀中頃から流行し、ロンドンで世論形成の場となった社交場（飲食店）を何と呼ぶか。", "コーヒーハウス", 7], ["11", 215, "政治・学芸など特定分野に関心をもつ人々が集まって形成した、イギリスの社交・交流組織を何と呼ぶか。", "クラブ", 3], ["11", 215, "17世紀頃から学者・文人・商人などが集まり、世論形成の場となったパリの軽飲食店を何と呼ぶか。", "カフェ", 5], ["11", 215, "17～18世紀にフランスで流行した、上流階級の文化上の社交場を何と呼ぶか。", "サロン", 6], ["11", 215, "17世紀に、おもにニュース報道を定期的に刊行するようになった印刷物を何と呼ぶか。", "新聞", 7], ["11", 215, "新聞や雑誌が盛んに読まれるようになって形成された、多くの人々の共通の考え方を何と呼ぶか。", "世論", 4], ["11", 215, "中世末期には都市の住民を意味したが、近世では有産市民を意味するようになった言葉は何か。", "ブルジョワ", 3], ["11", 215, "17～18世紀のヨーロッパで、アメリカ大陸・アフリカ・アジアなどから新たな商品が流入して、生活様式が大きくかわったことを何と呼ぶか。", "生活革命", 2], ["11", 215, "孤島で1人生きぬく人間の姿と信仰を描いた小説『ロビンソン＝クルーソー』を著したのは誰か。", "デフォー", 4], ["11", 216, "『ガリヴァー旅行記』で、イギリスの現状を鋭く批判・風刺した、アイルランド生まれの小説家は誰か。", "スウィフト", 6], ["11", 216, "光と影の描写にすぐれ、近代油絵画法を完成し、「夜警」に代表されるオランダ全盛期の市民生活を描いた画家は誰か。", "レンブラント", 6], ["11", 216, "「地理学者」「真珠の耳飾りの少女」など光や色彩、明暗を繊細に描いた作品で知られるオランダの画家は誰か。", "フェルメール", 3], ["12", 218, "商業革命で新たに国際商業の中心地となり、バルト海沿岸諸国から穀物を輸入するようになったのはどのような地域の国々か。", "大西洋岸諸国", 7], ["12", 218, "「世界の一体化」にともない東ヨーロッパで広まった、領主が大農場を経営して輸出向け穀物を生産する制度で、農奴制が強化されたことから、再版農奴制とも呼ばれるしくみは何か。", "農場領主制", 5], ["12", 218, "アメリカ大陸からの銀の流入によって、ヨーロッパで急激に物価が上昇した現象を何と呼ぶか。", "価格革命", 7], ["12", 218, "17世紀のヨーロッパが、ペストの流行による人口の減少、経済活動の停滞、戦争・革命などの社会不安に襲われていたことを示す表現は何か。", "「17世紀の危機」", 7], ["12", 218, "18世紀にイギリスの農業生産を拡大させた、農業技術や農業経営の変化を何と呼ぶか。", "農業革命", 6], ["12", 218, "イギリスで始まった、農地を4分し、1年ごとに大麦・クローヴァー・小麦・カブを順に植えていく農法は何か。", "ノーフォーク農法", 3], ["12", 218, "農業革命を推進した、村の共有地を私有地に転換して集約的な農業を可能にした制度改革は何か。", "第2次囲い込み", 6], ["12", 218, "商人が、生産者に原料・道具を前貸しして注文生産をおこない、製品を独占的に買い上げた制度は何か。", "問屋制", 3], ["12", 218, "資本家が工場に労働者を集めて、分業による手工業生産をおこなわせる生産様式は何か。", "マニュファクチュア（工場制手工業）", 3], ["12", 219, "17世紀に人気商品となり、イギリスの主要産業である毛織物業に打撃を与え、18世紀の初めに輸入が禁止されたインド産物品は何か。", "綿織物（キャラコ）", 6], ["12", 219, "ヨーロッパ、アフリカ、アメリカを結ぶ大西洋地域でおこなわれ、イギリスに富をもたらした貿易は何か。", "（大西洋）三角貿易", 5], ["12", 219, "18世紀後半のイギリスで始まった、科学革命を背景とする機械生産の開始とそれにともなう産業・経済・社会の変化を何と呼ぶか。", "産業革命", 7], ["12", 219, "ニューコメンが開発し、ワットが改良して製造業や鉄道に導入されるようになった動力機関は何か。", "蒸気機関", 6], ["12", 219, "イギリスからも産出され、家庭用、製鉄、蒸気機関などの燃料として需要が増大した資源は何か。", "石炭", 4], ["12", 219, "石炭から不純物を取り除いてつくるコークスを用いる製鉄法を発明した製鉄業者の名は何か。", "ダービー", 5], ["12", 219, "新技術の導入で技術革新が始まり、輸入代替工業化が進んだ産業分野は何か。", "綿工業", 4], ["12", 219, "1733年に、織布工程で横糸を巻いた飛び杼（梭）を発明した職工は誰か。", "ジョン＝ケイ", 6], ["12", 219, "1764年頃、1人で8本の糸を紡ぐことができる多軸（ジェニー）紡績機を発明した職工は誰か。", "ハーグリーヴズ", 5], ["12", 219, "1769年に、多軸紡績機を改良して、水力紡績機を発明した人物は誰か。", "アークライト", 6], ["12", 219, "1779年に、多軸紡績機と水力紡績機の長所を取り入れて、ミュール紡績機を発明した紡績工は誰か。", "クロンプトン", 6], ["12", 220, "1785年に力織機を発明して織布工程を機械化した、牧師でもある発明家は誰か。", "カートライト", 6], ["12", 220, "18世紀初めに、蒸気機関を炭坑の排水ポンプの動力として実用化した、技師で発明家は誰か。", "ニューコメン", 5], ["12", 220, "ニューコメンの蒸気機関を改良し、1781年には動力を回転運動にかえることに成功した人物は誰か。", "ワット", 7], ["12", 220, "1814年に蒸気機関車を開発し、1825年にロコモーション号で蒸気機関車の実用化に成功した技師は誰か。", "スティーヴンソン", 7], ["12", 220, "1830年に世界ではじめての旅客鉄道の営業運転が結んだ2つの都市はどこか。", "リヴァプール・マンチェスター", 7], ["12", 220, "1807年に、世界最初の外輪式蒸気船クラーモント号をつくったアメリカ人は誰か。", "フルトン", 5], ["12", 220, "賃金労働者を工場で雇用し、利益の拡大を目的に他者と競争しながら経営をおこなう人を何と呼ぶか。", "産業資本家", 5], ["12", 220, "機械制工場が拡大するなか、工賃の下落や失業を恐れた手工業者や労働者が1810年代に展開した運動は何と呼ばれるか。", "ラダイト運動（機械打ちこわし運動）", 6], ["12", 220, "中世以来、職人たちが飲酒を理由に月曜日の仕事を休んだ一種の慣習で、産業革命期以降、工場労働者が資本家に抵抗するための理由に用いたものは何か。", "「聖月曜日」", 2], ["12", 220, "産業革命によってイギリスで確立した、生産手段を所有する資本家が労働者を雇って商品を生産し、利潤を追求する体制は何か。", "資本主義体制", 7], ["12", 220, "産業革命の結果、綿工業の最大の中心地となり、人口が急増したランカシャー地方の都市はどこか。", "マンチェスター", 7], ["12", 220, "鉄・石炭の産地に近く、製鉄業・機械工業の中心となったイングランド中部の工業都市はどこか。", "バーミンガム", 2], ["12", 220, "18世紀に奴隷貿易で発展し、産業革命以降は綿花の輸入や製品の輸出で栄えた海港都市はどこか。", "リヴァプール", 5], ["12", 221, "19世紀にイギリスが中心となって展開した社会的・政治的変化で、植民地の獲得や自国に有利な貿易体制の強制を通じて、工業生産国がほかの地域を市場や原料供給地に組み込んでいった動きを何というか。", "世界経済の再編成", 3], ["12", 221, "イギリスについで19世紀初頭に産業革命が始まった、1830年に独立し、のちに立憲王国となった国はどこか。", "ベルギー", 5], ["12", 221, "インドでの貿易および統治にたずさわり、植民地化を進めたイギリスの会社は何か。", "東インド会社", 3], ["12", 221, "圧倒的な工業力をもって国際市場で他国を圧した、19世紀半ばのイギリスを何と呼称するか。", "「世界の工場」", 7], ["12", 221, "ジェームズタウンを起源とし、「処女王」エリザベス1世にちなんで名づけられたイギリスの北米植民地で、最初に植民地議会がおかれたのはどこか。", "ヴァージニア", 6], ["12", 221, "17～18世紀前半に、大西洋岸に成立したイギリス植民地を何と総称するか。", "13植民地", 7], ["12", 221, "17世紀初め、フランスが北米植民地経営の拠点として建設した、セントローレンス川河口の町はどこか。", "ケベック", 4], ["12", 221, "ニューファンドランドやハドソン湾などを含む、フランスが植民地とした北米の地域はどこか。", "カナダ", 4], ["12", 221, "17世紀後半、ラ＝サールの探検によってフランス領となった、ミシシッピ川流域の地域名は何か。", "ルイジアナ", 5], ["12", 221, "パリ条約で、北米においていったんスペインからイギリスに割譲されたのはどこか。", "フロリダ", 3], ["12", 222, "1620年、宗教的自由を求めて北アメリカに移住したピューリタンの一団を何と呼ぶか。", "ピルグリム＝ファーザーズ（巡礼始祖）", 4], ["12", 222, "ピルグリム＝ファーザーズが大西洋航路で使用した船の名前は何か。", "メイフラワー号", 4], ["12", 222, "1620年、メイフラワー号が上陸した、北米大西洋岸の場所はどこか。", "プリマス", 2], ["12", 222, "ピルグリム＝ファーザーズ以降、多くのピューリタンが入植して形成された、東北海岸一帯の植民地は何と呼ばれたか。", "ニューイングランド植民地", 5], ["12", 222, "プロテスタントの一派のクウェーカー教徒がウィリアム＝ペンの指導のもとに建てた植民地（州）はどこか。", "ペンシルヴェニア", 1], ["12", 222, "13植民地のうち、1732年、最後に成立した最南部の州はどこか。", "ジョージア", 2], ["12", 222, "各植民地に成立した、住民代表からなる議会は何か。", "植民地議会", 6], ["12", 222, "南部植民地で発達した、タバコ・米・藍などの商品作物を生産する大農園を何と呼ぶか。", "プランテーション", 6], ["12", 222, "プランテーションの労働力としてアフリカから輸入・酷使された人々を何と呼ぶか。", "黒人奴隷", 4], ["12", 222, "イギリスが植民地を重商主義体制に組み込み、規制を強化したのは、ヨーロッパでおこなわれた何という戦争のあとか。", "七年戦争", 6], ["12", 222, "七年戦争の時、イギリス・フランスが北米でおこなった植民地獲得戦争は何か。", "フレンチ＝インディアン戦争", 5], ["12", 222, "書類・刊行物すべてを対象として1765年に出され、植民地側の激しい反対運動を引きおこした法は何か。", "印紙法", 6], ["12", 222, "印紙法に反対した、植民地側の論理を示す言葉は何か。", "「代表なくして課税なし」", 6], ["12", 223, "1773年、ある物産の独占販売権をイギリス東インド会社に与え、独立戦争勃発の引き金となった法は何か。", "茶法", 6], ["12", 223, "茶法に反対する急進派ボストン市民が引きおこした事件を何と呼ぶか。", "ボストン茶会事件", 6], ["12", 223, "第1回が1774年に開かれた、13植民地（州）の代表者からなる連絡会議を何と呼ぶか。", "大陸会議", 6], ["12", 223, "イギリスの北米13植民地が、イギリス本国から独立を勝ちとった戦争を何と呼ぶか。", "アメリカ独立戦争（革命）", 7], ["12", 223, "第1回大陸会議が開かれた、「友愛の町」を意味する、ペンシルヴェニア植民地の中心都市はどこか。", "フィラデルフィア", 5], ["12", 223, "1775年、植民地側民兵軍が本国正規軍と衝突した、独立戦争最初の戦いは、ボストン西北郊外のどこで始まったか。", "レキシントン", 4], ["12", 223, "1775年、イギリス本国軍が武器を接収しようとして武力衝突がおきた、ボストン西北郊外の村はどこか。", "コンコード", 4], ["12", 223, "独立戦争勃発後、第2回大陸会議で植民地軍総司令官に任命された人物は誰か。", "ワシントン", 6], ["12", 223, "イギリス生まれの文筆家で、1776年にパンフレットを出版して独立への気運を高めた人物は誰か。", "トマス＝ペイン", 7], ["12", 223, "独立の正当性と共和国樹立の必要性を平易な文章で訴えた、トマス＝ペインのパンフレットの書名は何か。", "『コモン＝センス』（『常識』）", 7], ["12", 223, "1776年7月4日、フィラデルフィアでの大陸会議で採択された、ロックの自然法思想を基礎にする宣言は何か。", "独立宣言", 7], ["12", 223, "独立宣言の宣言文起草の中心となった、ヴァージニア出身の政治家は誰か。", "トマス＝ジェファソン", 7], ["12", 223, "1777年11月、大陸会議で承認された、各州の大幅な主権と自由を認めた最初の憲法は何か。", "アメリカ連合規約", 3], ["12", 223, "アメリカ連合規約によって発足した、北米13植民地による正式国名は何か。", "アメリカ合衆国", 7], ["12", 224, "アメリカ独立戦争期に、イギリス本国側を支持した植民地人を何と呼ぶか。", "国王派（忠誠派）", 2], ["12", 224, "独立戦争を支持・推進した植民地人を何と呼ぶか。", "愛国派", 2], ["12", 224, "1778年のフランス参戦に大きく貢献した、文筆家・科学者でもあった人物は誰か。", "フランクリン", 5], ["12", 224, "アメリカ独立戦争中の1779年、フランス側について対イギリス戦に参加したブルボン朝の国はどこか。", "スペイン", 6], ["12", 224, "1780年、ロシアのエカチェリーナ2世の提唱で結成され、イギリスの海上封鎖に対抗した同盟は何か。", "武装中立同盟", 6], ["12", 224, "1777～81年に義勇兵としてアメリカ独立軍に参加した、フランスの自由主義貴族は誰か。", "ラ＝ファイエット", 6], ["12", 224, "1776～84年に義勇兵としてアメリカ独立軍に参加した、ポーランドの愛国者・軍人は誰か。", "コシューシコ（コシチューシコ）", 6], ["12", 224, "1781年、アメリカ・フランス連合軍がイギリス軍に大勝し、独立戦争の事実上の勝利を確定した戦いはどこでおこったか。", "ヨークタウン", 6], ["12", 224, "1783年に成立した、アメリカ独立戦争の講和条約は何か。", "パリ条約", 7], ["12", 224, "1783年のパリ条約で、アメリカがイギリスから獲得した地域はどこか。", "ミシシッピ川以東のルイジアナ", 5], ["12", 224, "1787年にワシントンを議長にフィラデルフィアで開催された会議で制定され、翌88年に発効した、世界最初の近代的成文憲法は何か。", "アメリカ合衆国憲法", 6], ["12", 224, "合衆国憲法で定められた、大統領・連邦議会・最高裁判所が、それぞれ行政・立法・司法の権限をもつ体制を何と呼ぶか。", "三権分立", 6], ["12", 224, "合衆国で中央政府の権力強化をめざす考えを何と呼ぶか。", "連邦主義", 4], ["12", 224, "1789年、アメリカ合衆国憲法にもとづいて発足した行政機関の名称は何か。", "アメリカ連邦（中央）政府", 5], ["12", 224, "連邦政府の権限強化を主張し、アメリカ合衆国憲法草案を支持したハミルトンらのグループを何と呼ぶか。", "連邦派", 6], ["12", 225, "州権の尊重を主張し、アメリカ合衆国憲法草案に反対したジェファソンらのグループを何と呼ぶか。", "反連邦派（州権派）", 6], ["12", 225, "1789～99年に展開された、フランス社会を根底から変革することとなった動きを何と呼ぶか。", "フランス革命", 7], ["12", 225, "封建的身分制度が維持されていた、革命前のフランスの社会・政治体制を何と呼ぶか。", "旧体制（アンシャン＝レジーム）", 6], ["12", 225, "革命前のフランスで、聖職者は何という身分に所属していたか。", "第一身分", 6], ["12", 225, "革命前のフランスで、貴族は何という身分に所属していたか。", "第二身分", 6], ["12", 225, "革命前のフランスで、農民と市民階層は何という身分に所属していたか。", "第三身分", 7], ["12", 225, "第三身分出身の聖職者で、1789年にパンフレットを著し、特権身分を激しく攻撃した人物は誰か。", "シェイエス", 4], ["12", 225, "シェイエスが「第三身分とはすべてである」と主張した、パンフレットの書名は何か。", "『第三身分とは何か』", 4], ["12", 225, "ルイ15世の孫で、フランス革命勃発時のフランス王は誰か。", "ルイ16世", 6], ["12", 225, "オーストリアのマリア＝テレジアの娘で、ルイ16世の妃であった女性は誰か。", "マリ＝アントワネット", 2], ["12", 225, "1774年に財務総監となり、穀物取引の自由化などの改革で財政再建を試みた重農主義経済学者は誰か。", "テュルゴ", 6], ["12", 226, "1788年に2度目の財務総監となり、特権身分への課税を主張したスイス生まれの銀行家は誰か。", "ネッケル", 6], ["12", 226, "1789年5月、175年ぶりに招集された身分制議会は何か。", "全国三部会（三部会）", 7], ["12", 226, "全国三部会で、免税特権廃止に反対する聖職者・貴族が主張した、伝統的な議決方法は何か。", "身分別議決", 3], ["12", 226, "1789年6月、第三身分代表が全国三部会から分離して結成し、特権身分の一部も合流した議会名は何か。", "国民議会", 6], ["12", 226, "国民議会の議員が、憲法制定まで解散しないことを誓ったことを何と呼ぶか。", "球戯場（テニスコート）の誓い", 4], ["12", 226, "全国三部会に第三身分代表として選出されて以来、国民議会の中心となった貴族出身の政治家は誰か。", "ミラボー", 4], ["12", 226, "1789年7月14日、パリ市民がどこを襲撃して、フランス革命が開始されたか。", "バスティーユ牢獄", 7], ["12", 226, "1789年8月4日、農民の蜂起（「大恐怖」）に脅威を感じた国民議会が、貴族の提案で決定・発布した宣言は何か。", "封建的特権の廃止", 6], ["12", 226, "1789年8月26日に国民議会で採択された、フランス革命の理念を示した宣言の一般的な名称は何か。", "人権宣言", 7], ["12", 226, "一貫して立憲君主政の立場をとったが、人権宣言の起草者の1人となった自由主義貴族は誰か。", "ラ＝ファイエット", 7], ["12", 226, "1789年10月、食料の高騰に苦しむパリの女性らが、ヴェルサイユ宮殿に乱入した事件を何と呼ぶか。", "ヴェルサイユ行進", 4], ["12", 226, "フランス革命中の1790年、聖職者を政府から俸給を受け取る役人としたことを何と呼ぶか。", "聖職者の公務員化（聖職者市民法）", 2], ["12", 226, "主権国家の成立後に出てきた、「1つの国民（民族）」という観念のもとに形成される国家を、一般に何と呼ぶか。", "国民国家", 6], ["12", 226, "フランス革命期から始まる、みずからの民族的な価値を強く意識し強化しようとする考えを何と呼ぶか。", "ナショナリズム", 2], ["12", 226, "1790年に国民議会が度量衡単位として宣言し、99年に正式に採用された、長さの単位を定めた法は何か。", "メートル法", 4], ["12", 227, "1791年6月、国王一家がオーストリアへの逃亡を企て、失敗に終わった事件を何と呼ぶか。", "ヴァレンヌ逃亡事件", 6], ["12", 227, "1791年9月、立憲君主政・制限選挙・一院制などを内容とする、国民議会が採択した憲法を何と呼ぶか。", "1791年憲法", 7], ["12", 227, "「半ズボンをはかない者」という意味で、都市の下層民を指し、革命の急進化をうながした人々は何と呼ばれたか。", "サンキュロット", 6], ["12", 227, "1791年に『女性の権利宣言』を刊行したが、のちに恐怖政治のなかで処刑された、フェミニズムの先駆者は誰か。", "オランプ＝ド＝グージュ", 4], ["12", 227, "制限選挙の結果、1791年10月に成立した議会は何か。", "立法議会", 6], ["12", 227, "立法議会で保守派を構成した、立憲君主主義者たちのグループを何と呼ぶか。", "フイヤン派", 4], ["12", 227, "立法議会では多数派で左派を構成した、穏健な共和主義者のグループ名は何か。", "ジロンド派", 5], ["12", 227, "ジロンド派の指導者で、国王退位を求める請願書を起草した人物は誰か。", "ブリッソ", 1], ["12", 227, "1792年4月、ジロンド派の内閣はどこの国に対して宣戦したか。", "オーストリア", 6], ["12", 227, "パリに入ったマルセイユ義勇軍団が歌ったことに由来し、のちにフランス国歌とされた革命歌の名称は何か。", "「ラ＝マルセイエーズ」", 3], ["12", 227, "1792年8月、サンキュロットと国民衛兵（義勇兵）がテュイルリー宮殿を襲撃した事件を何と呼ぶか。", "8月10日事件", 5], ["12", 227, "8月10日事件によって何が宣言されたか。", "王権の停止", 5], ["12", 227, "ヴァルミーの戦いに勝利した翌9月21日、最初の男性普通選挙によって成立した一院制の議会を何と呼ぶか。", "国民公会", 6], ["12", 227, "国民公会で宣言されて1804年5月まで続いた、フランス最初の共和政体を何と呼ぶか。", "第一共和政", 6], ["12", 227, "1792年秋以降、山岳派が中心となった、国民公会を主導した急進的共和主義者のグループは何か。", "ジャコバン派", 6], ["12", 228, "フランス軍のベルギー占領とルイ16世の処刑を機に、1793年2月に結成された対フランス軍事同盟は何か。", "対仏大同盟", 6], ["12", 228, "対仏大同盟の結成を提唱した、イギリス首相は誰か。", "ピット", 4], ["12", 228, "国民公会による大規模な募兵に反発し、1793年3月、フランス西部の貧しい農村地帯でおこった農民反乱は何か。", "ヴァンデーの反乱", 4], ["12", 228, "1793年4月、国民公会内に設置された政治・軍事の最高指導機関で、事実上の政府だった委員会を何と呼ぶか。", "公安委員会", 6], ["12", 228, "1793年6月に国民公会からジロンド派を追放し、山岳派が開始した独裁政治は何と呼ばれるか。", "恐怖政治", 7], ["12", 228, "ルソーの思想的影響を強く受け、1794年5月から事実上の個人独裁をおこなった山岳派のリーダーは誰か。", "ロベスピエール", 7], ["12", 228, "山岳派右派の指導者で、恐怖政治の強化に反対し、1794年4月に処刑された人物は誰か。", "ダントン", 2], ["12", 228, "理性の崇拝を推進したがロベスピエールと対立し、1794年3月に処刑された山岳派の人物は誰か。", "エベール", 1], ["12", 228, "1793年5月に公布され、9月に対象を拡大した物価統制法は何と呼ばれるか。", "最高価格令", 4], ["12", 228, "1793年6月に国民公会で採択され、男性普通選挙制などを認めたが、結局、実施に至らなかった憲法は何か。", "1793年憲法", 4], ["12", 228, "1793年7月、山岳派政権がおこなった、農民解放を一応完了させたといわれる施策は何か。", "封建地代の無償廃止", 4], ["12", 228, "対外戦争に対処するため、山岳派政権下で決定・実施された兵制上の改革は何か。", "徴兵制の実施", 5], ["12", 228, "1793年秋から、エベール派が非キリスト教化運動の一環として実施した宗教祭典を何と呼ぶか。", "理性の崇拝", 2], ["12", 228, "1793年10月に採用された、グレゴリウス暦を廃止して、共和政開始の1792年9月22日を起点とした暦は何か。", "革命暦", 6], ["12", 228, "フランス革命の影響からカリブ海のハイチで黒人奴隷の反乱が発生したことなどを受けて、1794年国民公会が出した宣言は何か。", "黒人奴隷解放宣言", 1], ["12", 229, "1794年7月、国民公会の反ロベスピエール派によるクーデタで山岳派の独裁が打倒され、革命の急進化が終結したことを何というか。", "テルミドールの反動", 6], ["12", 229, "1795年8月に制定され、財産資格による制限選挙制が復活したブルジョワジー中心の憲法を何と呼ぶか。", "1795年憲法（共和国第3年憲法）", 4], ["12", 229, "1795年憲法にもとづく選挙で1795年10月に成立した、ブルジョワ共和派による政府を何と呼ぶか。", "総裁政府", 6], ["12", 229, "私有財産制の廃止をとなえ、民衆による蜂起計画が発覚して、1796年5月に逮捕された革命家は誰か。", "バブーフ", 4], ["12", 229, "1795年10月の王党派の反乱を鎮圧し、総裁政府のもとで名声を高めていったコルシカ島出身の軍人は誰か。", "ナポレオン＝ボナパルト", 7], ["12", 229, "1796～97年の、ナポレオン＝ボナパルトが遠征軍司令官に起用され、オーストリア軍を撃破して一躍名声を高めた遠征先はどこか。", "イタリア", 6], ["12", 229, "1798～99年、地中海を支配してイギリスとインドとの連絡を断つ目的でナポレオン＝ボナパルトがおこなった軍事遠征先はどこか。", "エジプト", 7], ["12", 229, "ナポレオン＝ボナパルトのエジプト遠征を機に、イギリスがロシア・オーストリアなどと結んだ軍事同盟は何か。", "第2回対仏大同盟", 2], ["12", 229, "1799年11月、エジプトから帰国したナポレオン＝ボナパルトがフランス革命を終了させた軍事クーデタを何と呼ぶか。", "ブリュメール18日のクーデタ", 6], ["12", 229, "ブリュメール18日のクーデタのあとに成立した、名目上は共和政、事実上はナポレオンの軍事独裁である政府は何か。", "統領政府", 6], ["12", 229, "統領政府でナポレオンが就任した役職は何か。", "第一統領", 4], ["12", 229, "1800年、国家財政を担うため、ナポレオンによって設立された中央銀行は何か。", "フランス銀行", 4], ["12", 229, "1801年、ナポレオンが、革命によって断絶していたローマ教皇との関係を修復した和約を何と呼ぶか。", "宗教（政教）協約（コンコルダート）", 6], ["12", 230, "第2回対仏大同盟を解消させた、1802年にイギリスとフランスのあいだで結ばれた和約は何か。", "アミアンの和約", 5], ["12", 230, "アミアンの和約の締結成功を背景に、ナポレオンが国民投票で就任した地位は何か。", "終身統領", 6], ["12", 230, "革命で確立された法原理を盛り込んで、1804年3月に制定されたフランス民法典は、一般に何と呼ばれるか。", "ナポレオン法典", 7], ["12", 230, "1804年5月からの、ナポレオン1世の皇帝即位に始まる軍事独裁の政体を何と呼ぶか。", "第一帝政", 6], ["12", 230, "ナポレオンのイギリス上陸作戦を断念させた、地中海出入口の西北沖で戦われた海戦は何か。", "トラファルガーの海戦", 7], ["12", 230, "トラファルガーの海戦で戦死したが、イギリスを勝利させた提督は誰か。", "ネルソン", 3], ["12", 230, "1805年12月、ナポレオンがロシア・オーストリア両軍を撃破し、三帝会戦とも呼ばれた戦いは何か。", "アウステルリッツの戦い", 4], ["12", 230, "1806年、ナポレオンを盟主として成立した、西南ドイツ諸邦の同盟は何か。", "ライン同盟", 5], ["12", 230, "ライン同盟が脱退を宣言したため名実ともに消滅した、962年から続いてきた帝国は何か。", "神聖ローマ帝国", 6], ["12", 230, "1806年11月、イギリスに経済的打撃を与える目的でナポレオンが出したベルリン勅令は、内容から何と呼ばれるか。", "大陸封鎖令", 7], ["12", 230, "1807年7月、ナポレオンがプロイセン・ロシアと結んだ講和条約は何か。", "ティルジット条約", 3], ["12", 230, "ティルジット条約により旧ポーランド領に設立された、ナポレオンの傀儡国家は何か。", "ワルシャワ大公国", 4], ["12", 230, "ナポレオンの兄ジョゼフの国王即位に抗議して、1808年から各地でゲリラ戦を展開した国はどこか。", "スペイン", 4], ["12", 231, "ナポレオン軍に抵抗するマドリード市民が銃殺される様子を描いた、ゴヤの絵画の題名は何か。", "「1808年5月3日」", 6], ["12", 231, "ナポレオン軍占領下のベルリンで、ドイツの民族意識を高揚させる連続講演をおこなった哲学者は誰か。", "フィヒテ", 4], ["12", 231, "フィヒテによるこの連続講演の題名は何か。", "「ドイツ国民に告ぐ」", 4], ["12", 231, "ティルジット条約によって広大な領土を失い、高額な賠償金を課されながら、「上からの近代化」を実施した国はどこか。", "プロイセン", 4], ["12", 231, "ティルジット条約締結後、ともに首相となり、農民解放や行政機構の改革、営業の自由化など、プロイセンの近代化を推進した2人の政治家は誰か。", "シュタイン・ハルデンベルク", 5], ["12", 231, "1812年、イギリスへの穀物輸出再開に対する制裁として、ナポレオンが大遠征をおこない失敗した国はどこか。", "ロシア", 7], ["12", 231, "1813～14年、ヨーロッパ諸国が参加しておこなわれた、ナポレオン体制打倒の戦争の総称は何か。", "解放戦争（諸国民戦争）", 6], ["12", 231, "1814年に退位したナポレオンが移った小島はどこか。", "エルバ島", 4], ["12", 231, "ナポレオンの退位を受けて帰国し、国王に即位したルイ16世の弟は誰か。", "ルイ18世", 5], ["12", 231, "ルイ18世の即位によりブルボン朝が復活したことを何というか。", "復古王政", 7], ["12", 231, "1815年6月、皇帝に復位したナポレオンが連合軍に完敗した最後の戦いは何か。", "ワーテルローの戦い", 6], ["12", 231, "1815年3～6月の、エルバ島を脱して復位したナポレオンの一時的支配を何と呼ぶか。", "百日天下", 4], ["12", 231, "再退位後にナポレオンが流された、南大西洋上のイギリス領の孤島はどこか。", "セントヘレナ", 4], ["12", 232, "18世紀後半～19世紀前半に環大西洋地域でおこった、アメリカ独立革命・フランス革命・ラテンアメリカの独立・産業革命などの一連の変革を何と呼ぶか。", "環大西洋革命", 7], ["12", 232, "フランス領サン＝ドマングでは、黒人奴隷の反乱が独立運動に発展し、1804年にハイチとして独立した（06年に共和国）。この一連の運動を何と呼ぶか。", "ハイチ革命", 5], ["12", 232, "ハイチ革命を指導し、「黒いジャコバン」と呼ばれた黒人指導者は誰か。", "トゥサン＝ルヴェルチュール", 6], ["12", 232, "ハイチ革命をうけて、1794年に、フランス本国は世界ではじめて何の廃止を決定したか。", "奴隷制", 1], ["12", 232, "ラテンアメリカ地域で独立運動の中心となった、おもに地主階級の、植民地生まれの白人を何と呼ぶか。", "クリオーリョ", 7], ["12", 232, "コロンブスが「インド」と誤解したことに由来する、アメリカ大陸先住民の呼称は何か。", "インディオ（インディアン）", 5], ["12", 232, "独立運動に協力した、ラテンアメリカにおける白人とインディオの混血者を何と呼ぶか。", "メスティーソ", 5], ["12", 232, "ラテンアメリカにおける白人と黒人の混血者を何と呼ぶか。", "ムラート", 4], ["12", 232, "「ラテンアメリカ独立の父」と称される、大コロンビア（ベネズエラ・コロンビア・エクアドル）・ボリビアなどの独立の指導者は誰か。", "シモン＝ボリバル", 6], ["12", 232, "アルゼンチン・チリ・ペルーなど、ラテンアメリカ南部の諸国を独立させた指導者は誰か。", "サン＝マルティン", 5], ["12", 232, "1810年、メキシコで最初の独立蜂起を指導した、クリオーリョ出身の司祭は誰か。", "イダルゴ", 3], ["12", 233, "1822年、ポルトガル王子が皇帝に即位して独立した国はどこか。", "ブラジル", 6], ["12", 233, "独立後のラテンアメリカ諸国で広くおこなわれた、単一の商品作物をつくる農業経営は何と呼ばれたか。", "モノカルチャー", 5], ["12", 233, "アメリカ合衆国第5代大統領が、ヨーロッパ諸国とアメリカ大陸諸国との相互不干渉を主張した、1823年の教書は何と呼ばれるか。", "モンロー宣言", 6], ["12", 233, "ラテンアメリカ諸国の独立を援助したのち、1825年からギリシア独立を支援したイギリス外相は誰か。", "カニング", 4], ["13", 236, "1814年9月～15年6月、フランス革命とナポレオンによる戦争の処理のために開かれた国際会議は何か。", "ウィーン会議", 7], ["13", 236, "ウィーン会議を主催し、議長として戦後秩序の形成につとめた、当時のオーストリア外相は誰か。", "メッテルニヒ", 7], ["13", 236, "フランス革命前の王朝と体制を正統とみなすとした、ウィーン会議の基本原則は何か。", "正統主義", 7], ["13", 236, "正統主義を提唱したフランス外相は誰か。", "タレーラン", 5], ["13", 236, "ウィーン会議のもう1つの原則となった、一国の強大化を防ぎ、各国の力の均衡をはかる外交思想は何か。", "勢力均衡", 5], ["13", 236, "正統主義・勢力均衡の考えを原則として調印された、ウィーン会議の最終条約の名称は何か。", "ウィーン議定書", 5], ["13", 236, "ウィーン議定書でイギリスがオランダから獲得した、アフリカ南端の地域はどこか。", "ケープ植民地", 6], ["13", 236, "ウィーン議定書でイギリスがオランダから獲得した、インド南端の島はどこか。", "セイロン島（スリランカ）", 6], ["13", 236, "ナポレオンによる征服後、1801年にイギリスが占領しウィーン会議で承認された、シチリア島南方の島はどこか。", "マルタ島", 2], ["13", 236, "ウィーン議定書で独立を回復し、南ネーデルラントを併合して成立した、オランダの国名は何か。", "オランダ王国", 2], ["13", 236, "ウィーン議定書でオーストリアが獲得した、北イタリアの2つの地域はどこか。", "ロンバルディア・ヴェネツィア", 5], ["13", 236, "ウィーン会議で認められた、オーストリアを議長に、35君主国と4自由市から構成されたドイツ地域の国家連合名は何か。", "ドイツ連邦", 6], ["13", 237, "ウィーン議定書でプロイセンが獲得した、工業地帯のあるライン中流域の地域名は何か。", "ラインラント", 3], ["13", 237, "旧ワルシャワ大公国地域に形成され、ロシア皇帝が国王を兼ね、事実上ロシア領となった王国はどこか。", "ポーランド王国", 5], ["13", 237, "ウィーン議定書でロシアがスウェーデンから獲得した地域はどこか。", "フィンランド", 3], ["13", 237, "1812年にロシアがオスマン帝国から獲得し、ウィーン議定書で領有が確認された地域はどこか。", "ベッサラビア", 2], ["13", 237, "ウィーン議定書で永世中立国として承認された国はどこか。", "スイス", 6], ["13", 237, "ウィーン会議によって成立した、19世紀前半のヨーロッパの国際的反動体制を何と呼ぶか。", "ウィーン体制", 7], ["13", 237, "ウィーン体制を補強するために成立した、キリスト教的友愛精神にもとづく君主間の精神的盟約は何か。", "神聖同盟", 6], ["13", 237, "神聖同盟の結成を提唱したロシア皇帝は誰か。", "アレクサンドル1世", 5], ["13", 237, "1815年11月、イギリス・ロシア・オーストリア・プロイセンのあいだに成立した軍事的・政治的同盟は何か。", "四国同盟", 6], ["13", 237, "国際政治において力をふるう強国の協議によって、勢力均衡と平和を維持するしくみを何と呼ぶか。", "列強体制", 2], ["13", 237, "現行の政治・社会体制を維持するために、これに対する批判や改革を否定する考え方や運動は何か。", "保守主義", 2], ["13", 237, "1815年、ドイツの自由と統一を求めて結成された、大学生の組合（ドイツ学生同盟）は何と呼ばれるか。", "ブルシェンシャフト", 5], ["13", 237, "19世紀初め、イタリアの独立・統一や自由主義改革を目的に、南イタリアで結成された秘密結社は何か。", "カルボナリ", 5], ["13", 237, "1812年のカディス憲法を復活させたが、1823年にフランス軍の干渉で立憲革命が挫折した国はどこか。", "スペイン", 5], ["13", 238, "1825年、十二月党員のロシアの青年貴族士官が、自由主義的改革を要求しておこした反乱は何か。", "デカブリストの乱", 6], ["13", 238, "1821～29年、バルカン地域でオスマン帝国からの独立を求めて戦われた戦争は何か。", "ギリシア独立戦争", 6], ["13", 238, "1829年、ギリシア独立を支援したロシアと、オスマン帝国とのあいだで結ばれた講和条約は何か。", "アドリアノープル条約", 1], ["13", 238, "1830年に開かれ、イギリス・フランスなどがギリシアの独立を承認した会議は何か。", "ロンドン会議", 4], ["13", 238, "ルイ18世の弟で、1824年に即位し、亡命貴族に賠償金を与えるなど、反動政治を推し進めた国王は誰か。", "シャルル10世", 7], ["13", 238, "1830年5～7月、国民の不満を外にそらすため、シャルル10世が出兵を強行した北アフリカの地域はどこか。", "アルジェリア", 5], ["13", 238, "1830年7月、パリ市民が蜂起して復古王政を打倒したできごとは何か。", "七月革命", 7], ["13", 238, "七月革命のあと、自由主義的貴族として推され、国王に即位した人物（公爵）は誰か。", "ルイ＝フィリップ", 6], ["13", 238, "七月革命で成立した、制限選挙にもとづく立憲君主政を何と呼ぶか。", "七月王政", 6], ["13", 238, "ルイ14世の弟が祖である、ルイ＝フィリップの家系は何か。", "オルレアン家", 5], ["13", 238, "七月革命を題材として描いたドラクロワの作品名は何か。", "「民衆を導く自由の女神」", 7], ["13", 238, "七月革命の影響下、1830年にオランダから独立を宣言し、翌年に立憲王政が成立した国はどこか。", "ベルギー", 6], ["13", 238, "七月革命の影響下、ロシアによる支配からの離脱を求めて蜂起したが、鎮圧されて失敗に終わった国はどこか。", "ポーランド", 6], ["13", 238, "1818年からプロイセンを中心に結成され、1834年には3つの組織を統合して発足した同盟は何か。", "ドイツ関税同盟", 6], ["13", 239, "個人の自由な活動を重視し、参政権の拡大や経済活動の自由などをめざす思想は何か。", "自由主義", 5], ["13", 239, "1824年に廃止されたことで、イギリスでの労働組合の結成の公認が実現した法律は何か。", "団結禁止法", 3], ["13", 239, "1828年に廃止されたことで、プロテスタント非国教徒の公職就任が保証されることになった法律は何か。", "審査法", 4], ["13", 239, "1829年に成立した、カトリック教徒の公職就任を可能にしてイギリスでの宗教的差別を撤廃した法律は何か。", "カトリック教徒解放法", 4], ["13", 239, "カトリック教徒解放法の制定に尽力したアイルランド人は誰か。", "オコネル（オコンネル）", 3], ["13", 239, "1807年、植民地地主が猛反対するなか、ウィルバーフォースらの努力によってイギリスで実現された法令の内容は何か。", "奴隷貿易の廃止", 5], ["13", 239, "1832年にホイッグ党内閣のもとで実施され、産業資本家の参政権獲得が実現した自由主義的改革は何か。", "第1回選挙法改正", 7], ["13", 239, "第1回選挙法改正で廃止された人口の都市集中で有権者が激減したにもかかわらず、地域有力者の支配下におかれたままの選挙区を何と呼ぶか。", "腐敗選挙区", 6], ["13", 239, "第1回選挙法改正ののち、1837年頃より都市労働者が開始した、選挙権獲得運動を何と呼ぶか。", "チャーティスト運動", 7], ["13", 239, "チャーティスト運動で、都市労働者たちが掲げた6カ条からなる請願書を何と呼ぶか。", "人民憲章", 4], ["13", 239, "産業革命後、産業資本家が強く求めた、対外取引に関して国家の管理や統制を排除する方針は何か。", "自由貿易主義", 7], ["13", 239, "自由貿易主義の実現に向けて、1833年に東インド会社の何の廃止が定められたか。", "中国貿易独占権", 6], ["13", 239, "1812年に制定され、安価な大陸産穀物の流入による国産穀物の値下がりを阻止して地主の利益を守ろうとした法律は何か。", "穀物法", 5], ["13", 240, "穀物法の廃止に向けた運動の中心として活躍した、2人の政治家・経営者は誰か。", "コブデン、ブライト", 5], ["13", 240, "穀物法の廃止運動のため、1839年にコブデン・ブライトらが結成して、マンチェスターに本部がおかれた全国的組織は何か。", "反穀物法同盟", 4], ["13", 240, "自由貿易主義の実現に向けて1849年に廃止された、貿易に関する法律は何か。", "航海法", 7], ["13", 240, "産業革命期の工場で大量に雇用され、長時間労働や劣悪な勤務環境などを強いられたのは、どのような人々か。", "女性・子ども", 3], ["13", 240, "生産手段の公有（国有）化によって、社会全体の経済的平等を実現しようとする思想は何か。", "社会主義（思想）", 7], ["13", 240, "ニューラナークの紡績工場などを経営し、労働者の福祉向上につとめたイギリスの初期社会主義者は誰か。", "オーウェン", 7], ["13", 240, "賃金労働者が、労働条件や生活の維持・向上のために結成する組織は何か。", "労働組合", 5], ["13", 240, "オーウェンらの指導で発展した、労働者らが生活の向上をはかるために結成し、経済活動を協同でおこなう相互扶助組織は何か。", "協同組合", 3], ["13", 240, "オーウェンの提言も反映された、数次にわたって出された労働者保護のための法を何と総称するか。", "工場法", 7], ["13", 240, "人の能力が自由に発揮できる産業社会の実現を求めた、フランスの初期社会主義者は誰か。", "サン＝シモン", 7], ["13", 240, "協同組合的理想社会の実現のための団体設立を主張した、フランスの初期社会主義者は誰か。", "フーリエ", 4], ["13", 240, "二月革命ののち、労働者を代表する形で臨時政府に入閣した社会主義者は誰か。", "ルイ＝ブラン", 6], ["13", 240, "私有財産を否定し、さらに無政府主義の思想を広めたフランスの社会主義者は誰か。", "プルードン", 5], ["13", 241, "資本主義社会の分析を通じて、社会主義への移行の必然性を説いたドイツの社会主義者は誰か。", "マルクス", 7], ["13", 241, "マルクスの協力者として、社会主義の確立と普及や実践活動をおこなったドイツの社会主義者は誰か。", "エンゲルス", 7], ["13", 241, "1848年2月、マルクス・エンゲルスがロンドンで出版し、「万国の労働者よ、団結せよ」の言葉で有名な著書は何か。", "『共産党宣言』", 7], ["13", 241, "マルクスに始まる、資本主義社会には矛盾があるため、労働者階級が立ち上がって社会主義社会を実現すべきであるという主張は何か。", "マルクス主義", 3], ["13", 241, "マルクスが資本主義のしくみを詳細に分析・批判し、彼の死後はエンゲルスによって編集・刊行された著作は何か。", "『資本論』", 7], ["13", 241, "産業革命の進展を背景に、七月王政下のフランスでは、中小資本家や労働者が、何の拡大を求める運動を展開したか。", "選挙権", 6], ["13", 241, "1848年2月、パリの市民・労働者・学生らが蜂起して七月王政を打倒した革命を何と呼ぶか。", "二月革命", 7], ["13", 241, "二月革命によって樹立された政体は何と呼ばれるか。", "第二共和政", 6], ["13", 241, "二月革命後に実施され、社会主義者が大敗した男性普通選挙を何と呼ぶか。", "四月普通選挙", 3], ["13", 241, "1848年6月、国立作業場の廃止などに反発した、社会主義者や労働者のおこした事件を何と呼ぶか。", "六月蜂起", 6], ["13", 241, "第二共和政期の1848年12月に実施された大統領選挙で、当選した人物は誰か。", "ルイ＝ナポレオン", 6], ["13", 241, "1851年クーデタ後、国民投票での圧倒的支持を背景に皇帝となったルイ＝ナポレオンは何と称したか。", "ナポレオン3世", 7], ["13", 241, "1852～70年のフランスの政体は何か。", "第二帝政", 6], ["13", 242, "二月革命の影響で、ウィーン・ベルリンなどドイツ各地でおこった革命を何と呼ぶか。", "三月革命", 7], ["13", 242, "1848年3月にオーストリアに憲法改正を認めさせ、49年4月に独立宣言を出したが鎮圧された、マジャール人の国（地域）はどこか。", "ハンガリー", 6], ["13", 242, "ハンガリー民族運動のなかで、1849年4月に独立宣言を出したが、敗れて亡命した政治家は誰か。", "コシュート", 5], ["13", 242, "プラハを中心に、1848年6月にチェック人がオーストリアからの独立を求めて蜂起した地域はどこか。", "ベーメン（ボヘミア）", 6], ["13", 242, "1848年6月に、オーストリア帝国内のスラヴ人の結束と自立を目的にプラハで開催された会議は何か。", "スラヴ民族会議", 2], ["13", 242, "1848年5月、ドイツ統一と憲法制定を話し合うために、ドイツ最初の国民議会が招集された都市はどこか。", "フランクフルト", 7], ["13", 242, "二月革命に始まり自由主義・国民主義の運動がヨーロッパ各地で高揚した、1848年革命の別称は何か。", "「諸国民の春」", 6], ["13", 242, "1850年にプロイセン国王によって一方的に発布された、王政原理を強調した憲法は何か。", "プロイセン欽定憲法", 3], ["13", 242, "1850年代にオーストリアでとられた、王朝的正統主義の回復をめざした反動的体制は何と呼ばれるか。", "新絶対主義", 1], ["13", 242, "デカブリストの乱を鎮圧して専制政治を強行し、1853年からオスマン帝国と戦争を開始したロシア皇帝は誰か。", "ニコライ1世", 3], ["13", 242, "南下政策をとるロシアが、聖地イェルサレムの管理権問題を背景に、オスマン帝国内の正教徒保護を口実として1853年に始めた国際戦争は何か。", "クリミア戦争", 7], ["13", 243, "クリミア戦争で最大の激戦が展開された、ロシアの要塞かつ軍港であった場所はどこか。", "セヴァストーポリ", 4], ["13", 243, "1856年に締結された、クリミア戦争の講和条約は何か。", "パリ条約", 6], ["13", 243, "パリ条約で中立化が決められた海域はどこか。", "黒海", 5], ["13", 243, "クリミア戦争ののち、事実上の独立が認められ、のちにルーマニアとなった連合公国はどこか。", "モルダヴィア・ワラキア", 1], ["13", 243, "クリミア戦争での惨敗を機に、1861年より自由主義的改革を開始したロシアの皇帝は誰か。", "アレクサンドル2世", 6], ["13", 243, "1861年、改革のためアレクサンドル2世が発布した勅令は何か。", "農奴解放令", 7], ["13", 243, "農奴解放令でも「買い戻し金」を完納するまで農民が縛られ続けた、ロシアの農村共同体を何と呼ぶか。", "ミール", 5], ["13", 243, "1863年、アレクサンドル2世の自由主義的改革に乗じて反乱をおこしたが、鎮圧された国はどこか。", "ポーランド", 5], ["13", 243, "ロシア社会の後進性を痛感し、体制への批判や変革の先頭に立った知識人階級を何と呼ぶか。", "インテリゲンツィア", 6], ["13", 243, "1870年代に学生や青年に広がった、農民の啓蒙とその決起によって、農村共同体をもとに平等な社会の実現をめざした人々を何と呼ぶか。", "ナロードニキ（人民主義者）", 5], ["13", 243, "ナロードニキの呼称の起源ともなったスローガンは何か。", "「ヴ＝ナロード（人民のなかへ）」", 6], ["13", 243, "ナロードニキの運動が失敗したのち、彼らの一部が、暗殺や暴力で自己の主張の実現をめざした考え方を何と呼ぶか。", "テロリズム（暴力主義）", 6], ["13", 243, "産業革命にともない、交通環境が飛躍的に進歩したことを何と呼ぶか。", "交通革命", 6], ["13", 244, "19世紀半ば頃の、イギリスが圧倒的な経済力と軍事力をもつ国際情勢を表した言葉は何か。", "パクス＝ブリタニカ", 7], ["13", 244, "「パクス＝ブリタニカ」と呼ばれる大英帝国の黄金時代に在位した女王（位1837～1901）は誰か。", "ヴィクトリア女王", 6], ["13", 244, "海底電信ケーブルの設置など、電信技術の発達によっておこった通信上の変化を何というか。", "通信革命", 2], ["13", 244, "19世紀初頭から世界の基軸通貨となった、イギリスの通貨単位は何か。", "ポンド", 2], ["13", 244, "ロンドン郊外の天文台の所在地で、19世紀後半からそこを基準に世界標準時が定められた場所はどこか。", "グリニッジ", 3], ["13", 244, "産業・技術・製品を展示する国際的な博覧会として1851年にロンドンで始まり、その後も各国の国威発揚の場となった催しは何か。", "万国博覧会", 6], ["13", 244, "トーリ党の後身で、第1回選挙法改正以降に使われはじめた名称は何か。", "保守党", 6], ["13", 244, "ホイッグ党の後身で、第1回選挙法改正以降に使われはじめた名称は何か。", "自由党", 6], ["13", 244, "ヴィクトリア時代の保守党を代表する政治家で、帝国主義的外交を推進した人物は誰か。", "ディズレーリ", 6], ["13", 244, "ヴィクトリア時代の自由党を代表する政治家で、内政改革を重視した人物は誰か。", "グラッドストン", 6], ["13", 244, "1867年、保守党ダービー内閣のもとで成立し、都市部の労働者に選挙権を与えた改革は何か。", "第2回選挙法改正", 6], ["13", 244, "1870年、グラッドストン内閣が、初等教育をおこなう公立学校の増設を決定した法は何か。", "教育法", 2], ["13", 244, "1871年、グラッドストン内閣が、労働組合に法的な地位を認めた法は何か。", "労働組合法", 2], ["13", 244, "1884年、グラッドストン内閣のもとで成立し、農村部の労働者と鉱業労働者に選挙権を与えた改革は何か。", "第3回選挙法改正", 6], ["13", 245, "1801年の併合以降、イギリス統治下のアイルランドで生じた土地・宗教・政治問題などを何と総称するか。", "アイルランド問題", 3], ["13", 245, "1801年のアイルランドの併合にともなう、イギリス地域の国名は何か。", "グレートブリテン＝アイルランド連合王国", 3], ["13", 245, "1840年代半ばの凶作により、アイルランドで多数の餓死者や移民を出したできごとは何と呼ばれるか。", "ジャガイモ飢饉", 6], ["13", 245, "アイルランド国民党が自由党内閣に提出させたが、19世紀末、2度にわたって否決された法案は何か。", "アイルランド自治法案", 4], ["13", 245, "19世紀のイギリス自由貿易主義が、広大な周辺部世界に植民地としての従属を強要する帝国主義を並存させていたことを定義した用語は何か。", "自由貿易帝国主義", 2], ["13", 245, "自由貿易主義にもとづき、1860年にイギリスとフランスが結んだ条約を何と呼ぶか。", "英仏通商条約", 3], ["13", 245, "フランスがオスマン帝国側について参戦して勝利し、ナポレオン3世の名声が高まった戦争は何か。", "クリミア戦争", 7], ["13", 245, "第二帝政下の1856～60年、フランスがイギリスとともに中国に対しておこなった侵略戦争は何か。", "第2次アヘン戦争（アロー戦争）", 7], ["13", 245, "ナショナリズムの擁護者を自称するナポレオン3世が、密約を結んだサルデーニャを支援して1859年に参戦した戦争は何か。", "イタリア統一戦争", 4], ["13", 245, "第二帝政下の1858～67年、フランスの東南アジア植民地化の基礎を築いた出兵先の地域はどこか。", " 領", 6], ["13", 247, "1870年の統一後、イタリア王国ではトリエステ・南チロルなどオーストリア領に残った地域を何と呼んだか。", "「未回収のイタリア」", 6], ["13", 247, "ドイツ統一に関して、オーストリア内のドイツ人地域とベーメンを含めようとする考え方を何と呼ぶか。", "大ドイツ主義", 6], ["13", 247, "ドイツ統一に関して、オーストリアを排除して、プロイセン中心に進めようとする考え方を何と呼ぶか。", "小ドイツ主義", 6], ["13", 247, "プロイセンの高級官僚・軍人を独占した保守的な地主貴族層を何と称したか。", "ユンカー", 6], ["13", 247, "1861年プロイセン王となり兵制改革をおこなって軍備拡張を強行し、ドイツ帝国成立後に初代皇帝となった人物は誰か。", "ヴィルヘルム1世", 6], ["13", 248, "ヴィルヘルム1世から首相に登用され、ドイツ統一を進めた人物は誰か。", "ビスマルク", 7], ["13", 248, "ビスマルクが演説した、「現在の大問題は議会の演説や多数決ではなく、鉄（兵器）と血（兵士）によって解決される」との軍備拡張のための政策を何と呼ぶか。", "鉄血政策", 7], ["13", 248, "1864年のデンマーク戦争の原因となった、2つの地域名をあげよ。", "シュレスヴィヒ・ホルシュタイン", 5], ["13", 248, "デンマーク戦争で獲得した2つの地域の所属・領有問題から、1866年におきた戦争は何か。", "プロイセン＝オーストリア（普墺）戦争", 7], ["13", 248, "1867年、プロイセン王を首長として22カ国で成立した連邦国家は何か。", "北ドイツ連邦", 6], ["13", 248, "プロイセン＝オーストリア戦争で敗れたオーストリアが、マジャール人の自立を認めて成立した同君連合国家は何か。", "オーストリア＝ハンガリー帝国", 6], ["13", 248, "1867年にオーストリアとハンガリーとのあいだで結ばれた協定は、「妥協」を意味して何と呼ばれるか。", "アウスグライヒ", 2], ["13", 248, "1870年、ビスマルクの挑発にのったナポレオン3世の宣戦布告で始まった戦争は何か。", "ドイツ＝フランス（独仏）戦争（プロイセン＝フランス戦争）", 7], ["13", 248, "ドイツ＝フランス戦争勃発の背景となった、ヨーロッパの国際政治上の問題は何か。", "スペイン王位継承問題", 3], ["13", 248, "ドイツ＝フランス戦争中の1870年9月、ナポレオン3世が包囲されて降伏した国境の町はどこか。", "スダン（セダン）", 3], ["13", 248, "1871年5月、ドイツ＝フランス戦争の講和条約でドイツがフランスから獲得した2つの地域はどこか。", "アルザス・ロレーヌ", 6], ["13", 248, "プロイセンの軍備拡張政策と結びつきドイツ最大の鉄鋼軍需コンツェルンとなった企業は何か。", "クルップ社", 2], ["13", 249, "1871年1月、ヴィルヘルム1世がヴェルサイユ宮殿で皇帝に即位し成立した、統一ドイツ国家は何か。", "ドイツ帝国", 7], ["13", 249, "ドイツ帝国の憲法で規定された、22君主国と3自由市の代表で構成される議会は何か。", "連邦参議院", 2], ["13", 249, "ドイツ帝国の憲法で規定された、全ドイツの25歳以上の男性普通選挙で選ばれた議員で構成される議会は何か。", "帝国議会", 5], ["13", 249, "ドイツ帝国宰相となったビスマルクが、国家統合のために進めた、反プロイセン的な南ドイツのカトリック勢力および政党との争いを何と呼ぶか。", "文化闘争", 6], ["13", 249, "1875年に成立してのちに社会民主党と改称した、世界最初の社会主義政党名は何か。", "ドイツ社会主義労働者党", 4], ["13", 249, "1878年、皇帝狙撃事件を契機にビスマルクが制定した、社会主義運動を弾圧するための法は何か。", "社会主義者鎮圧法", 6], ["13", 249, "ビスマルクが、社会主義運動からの労働者の切り離しと国民国家の形成を目的に実施した、社会保険制度の導入などの政策は何か。", "社会政策", 7], ["13", 249, "1879年に制定された、工業製品と農産物の輸入品に関税を課す法律は何か。", "保護関税法", 3], ["13", 249, "18～19世紀にロシアが展開した、黒海の制海権を獲得し、さらに地中海進出をはかる政策は何か。", "南下政策", 6], ["13", 249, "1873年、ドイツ・オーストリア・ロシア3国の皇帝が締結した同盟は何か。", "三帝同盟", 5], ["13", 249, "スラヴ民族の連帯と統一をめざした思想・運動を、何と呼ぶか。", "パン＝スラヴ主義", 3], ["13", 249, "1875年のボスニア・ヘルツェゴヴィナの反乱以降、オスマン帝国がスラヴ民族を弾圧したことを理由に、1877年にロシアから宣戦した戦争は何か。", "ロシア＝トルコ（露土）戦争", 6], ["13", 249, "1878年、ロシアとオスマン帝国が結んだ講和条約は何か。", "サン＝ステファノ条約", 6], ["13", 250, "サン＝ステファノ条約で独立が承認され、つづくベルリン条約でその独立が国際的に認められた国を三つ答えよ。", "（A）ルーマニア　（B）セルビア　（C）モンテネグロ", 6], ["13", 250, "サン＝ステファノ条約で領土が拡大され、自治国としてロシアの保護下におかれた国はどこか。", "ブルガリア", 4], ["13", 250, "サン＝ステファノ条約締結ののち、ビスマルクが調停に立って開かれた国際会議は何か。", "ベルリン会議", 7], ["13", 250, "ベルリン会議でサン＝ステファノ条約を破棄して結ばれた条約は何か。", "ベルリン条約", 4], ["13", 250, "1878年のベルリン会議と同時期に、イギリスが行政権を獲得した東地中海の島はどこか。", "キプロス島", 3], ["13", 250, "1878年のベルリン条約で、オーストリアが管理権を認められた、スラヴ系住民の多く居住する地域はどこか。", "ボスニア・ヘルツェゴヴィナ", 5], ["13", 250, "1882年、ドイツ・オーストリア・イタリアが結んだ軍事的相互援助同盟は何か。", "三国同盟", 5], ["13", 250, "三帝同盟の崩壊ののち、1887年にドイツとロシアが結んだ秘密軍事条約は何か。", "再保障条約", 5], ["13", 250, "フランスの孤立とヨーロッパの勢力均衡を目的にビスマルクがつくりあげた1870年代～90年までの国際体制を何と呼ぶか。", "ビスマルク体制", 5], ["13", 251, "北ヨーロッパ地域において、ナポレオンによる一連の戦争中にロシアが併合した国はどこか。", "フィンランド", 3], ["13", 251, "フィンランドをロシアに割譲した代償に、ウィーン会議でデンマークからノルウェーを獲得した国はどこか。", "スウェーデン", 4], ["13", 251, "同君連合のスウェーデン領となったが、以後、独立運動を続け、1905年に平和的に独立を達成した国はどこか。", "ノルウェー", 5], ["13", 251, "1864年の戦争でシュレスヴィヒ・ホルシュタインの2州を失ったのち、農業改革と社会福祉につとめた国はどこか。", "デンマーク", 4], ["13", 251, "1864年にロンドンでマルクスらを中心に結成されたが、マルクスと無政府主義者バクーニンの対立などのため、1876年に解散した世界初の国際的な労働者の大衆組織は何か。", "第1インターナショナル", 6], ["13", 251, "クリミア戦争の際、イスタンブルの病院におもむき、傷病兵の看護に活躍したイギリスの女性は誰か。", "ナイティンゲール", 5], ["13", 251, "スイス人デュナンの提唱で、1863年に設立された団体は何か。", "国際赤十字", 7], ["13", 251, "スポーツを通じた国際親善の促進をめざして、1896年に第1回大会がアテネで開かれたものは何か。", "国際オリンピック大会", 2], ["13", 251, "1875年に成立した国際郵便のための組織は何か。", "万国郵便連合", 4], ["13", 251, "1865年にフランスで設立された、電信に関する国際機関は何か。", "万国電信連合（国際電信連合）", 4], ["13", 251, "ロシア皇帝ニコライ2世の呼びかけで、1899年と1907年にオランダのハーグで開かれた国際会議は何か。", "ハーグ万国平和会議", 1], ["13", 252, "1801年に、第3代アメリカ大統領に就任した州権主義者は誰か。", "トマス＝ジェファソン", 3], ["13", 252, "トマス＝ジェファソン大統領の任期中の1803年に、アメリカがフランスから買収 , "共和党", 7], ["13", 254, "1860年の大統領選挙に共和党から出馬して当選し、翌年、第16代大統領に就任した人物は誰か。", "リンカン", 7], ["13", 254, "リンカンの大統領当選後、1861年に南部11州がアメリカ合衆国から脱退して結成した国家は何か。", "アメリカ連合国（南部連合）", 6], ["13", 254, "1861年4月から始まり、アメリカ史上最多の死者を出した内戦は何か。", "南北戦争", 7], ["13", 254, "1862年、西部農民の北部支持を獲得しようとリンカンが出した、公有地に5年間定住し開墾した者に、土地160エーカーを無償で与えるとした法は何か。", "ホームステッド法（自営農地法）", 6], ["13", 254, "南北戦争中にリンカンが発表し北部の戦争目的を正当化した、反乱地域の奴隷を自由にするという宣言は何か。", "奴隷解放宣言", 7], ["13", 254, "1863年、南北戦争における最大の激戦がおこなわれ、北軍が勝利をおさめた戦場はどこか。", "ゲティスバーグ", 6], ["13", 254, "1863年11月、ゲティスバーグでの戦没者追悼集会でのリンカンの演説で、民主主義の本質を示す一節は何か。", "「人民の、人民による、人民のための政治」", 5], ["13", 254, "1865年に陥落した、アメリカ連合国の首都はどこか。", "リッチモンド", 2], ["13", 254, "奴隷制廃止後の南部に出現した、黒人の多くを小作人とし、収穫の約半分を地主がとった制度は何か。", "シェアクロッパー", 4], ["13", 255, "南北戦争後の1860年代半ばにテネシー州で結成され、黒人を迫害した秘密結社の名称は何か。", "クー＝クラックス＝クラン（KKK）", 5], ["13", 255, "アメリカ南部で制定された、人種隔離などの黒人差別法を何と総称するか。", "ジム＝クロウ法", 2], ["13", 255, "1869年に開通した、アメリカ合衆国の東部と太平洋岸を結ぶ交通網は何か。", "大陸横断鉄道", 7], ["13", 255, "1890年に消失したとされる、アメリカ西部における開拓地と未開拓地との境界地域を何と呼ぶか。", "フロンティア", 6], ["13", 255, "19世紀末に合衆国は世界最大の工業国となったが、その工業発展を支えた、他国から到来した労働力は何か。", "移民", 7], ["13", 255, "1886年に結成された、熟練労働者の職業別組織から構成される、アメリカ合衆国の全国的労働組合連合を何と呼ぶか。", "アメリカ労働総同盟（AFL）", 3], ["13", 255, "1880年代以降に急増した、東欧・南欧からアメリカ合衆国への移民を何と呼ぶか。", "新移民", 5], ["13", 255, "1880年代以降に急増した新移民のうち、中国人・インド人を中心とするアジア系移民に対する蔑称は何か。", "クーリー（苦力）", 5], ["13", 255, "1853年に東インド艦隊を率いて浦賀に来航したアメリカ海軍軍人ペリーは翌1854年に何を締結し、日本を開国させたか。", "日米和親条約", 6], ["13", 255, "1867年、アメリカ合衆国がロシアから買収した地域はどこか。", "アラスカ", 4], ["13", 255, "市民層が担い手となって発展した文化を何と呼ぶか。", "市民文化", 3], ["13", 256, "国民性や民族性を表現し、国民に国家の一員としての自覚を与えて国家統合をうながす役割を果たした文化は何か。", "国民文化", 2], ["13", 256, "技術革新の成果や諸国家の国民文化が統合されて形成された、ヨーロッパ中心主義的見方をとって近代世界の基準とされた文明を何と呼ぶか。", "ヨーロッパ近代文明", 2], ["13", 256, "ドイツで疾風怒濤運動の先頭に立ち、『ファウスト』などの作品を残した文豪は誰か。", "ゲーテ", 5], ["13", 256, "ゲーテとともに疾風怒濤運動の先頭に立ち、『群盗』などの作品を残したドイツの詩人・劇作家は誰か。", "シラー", 3], ["13", 256, "個性や感情を重視し、歴史や民族文化の伝統を尊重した、ウィーン体制期の中心的な文芸思潮は何か。", "ロマン主義", 7], ["13", 256, "『グリム童話集』で有名な、ドイツの言語学者兄弟は誰か。", "グリム兄弟", 5], ["13", 256, "代表作『歌の本』を書き、マルクスとも親交をもち、「革命詩人」とも呼ばれるユダヤ系ドイツ人は誰か。", "ハイネ", 6], ["13", 256, "代表作『レ＝ミゼラブル』で知られる、フランスのロマン派最大の作家・詩人は誰か。", "ヴィクトル＝ユゴー", 5], ["13", 256, "ギリシア独立戦争に義勇兵として参加したが病没した、イギリスのロマン派詩人は誰か。", "バイロン", 4], ["13", 256, "「近代ロシア文学の父」とも呼ばれ、『オネーギン』などの作品で知られるロマン派の詩人・作家は誰か。", "プーシキン", 3], ["13", 256, "19世紀半ばのフランスで生まれた、社会や人間を客観的にありのままに描こうとする文芸思潮は何か。", "写実主義（リアリズム）", 5], ["13", 256, "代表作『赤と黒』で知られ、心理描写にすぐれたフランス写実主義の先駆的作家は誰か。", "スタンダール", 5], ["13", 256, "「人間喜劇」で知られる、フランスの作家は誰か。", "バルザック", 5], ["13", 256, "『ボヴァリー夫人』を書いた、フランス写実主義文学の確立者は誰か。", "フロベール", 2], ["13", 257, "『二都物語』などヒューマニズムにあふれた傑作を残した、イギリスの写実主義作家は誰か。", "ディケンズ", 4], ["13", 257, "『猟人日記』や『父と子』で、農奴制の矛盾とインテリゲンツィアの姿を描いたロシアの作家は誰か。", "トゥルゲーネフ", 3], ["13", 257, "『罪と罰』や『カラマーゾフの兄弟』などの大作で、人間の魂の救済をテーマに描いたロシアの作家は誰か。", "ドストエフスキー", 5], ["13", 257, "ナポレオン戦争期を題材とした『戦争と平和』など、人道主義的な作品で知られるロシアの作家は誰か。", "トルストイ", 5], ["13", 257, "19世紀後半に生まれた、写実主義を進め、社会や人間の抱える問題を、科学的に分析し表現しようとした文芸思潮は何か。", "自然主義", 6], ["13", 257, "代表作『居酒屋』のほか、ドレフュス事件での被告弁護でも活躍した、フランスの自然主義作家は誰か。", "ゾラ", 5], ["13", 257, "『女の一生』で知られる、フランスの自然主義作家は誰か。", "モーパッサン", 4], ["13", 257, "『人形の家』で女性の目覚めと家庭からの解放を描いた、ノルウェーの自然主義劇作家は誰か。", "イプセン", 5], ["13", 257, "自然主義に反発し、美の享受は人生に価値と意義を与えてくれると主張した19世紀末の文芸思潮は何か。", "耽美主義", 3], ["13", 257, "科学的実証主義への反感から、何か別のものを象徴として代行させ、事物の内面を表現しようとした思潮は何か。", "象徴主義", 3], ["13", 257, "詩集『悪の華』があり、ひたすら美を追求する耽美主義を代表し、象徴主義の先駆ともされる、フランスの詩人・文学者は誰か。", "ボードレール", 5], ["13", 257, "ナポレオン軍の侵入に抵抗する市民を「1808年5月3日」で描いた、スペインの画家は誰か。", "ゴヤ", 3], ["13", 257, "ナポレオン1世の宮廷画家をつとめた、フランスの古典主義画家は誰か。", "ダヴィド", 7], ["13", 257, "七月革命を題材とした「民衆を導く自由の女神」や、「キオス島の虐殺」で知られるロマン主義の画家は誰か。", "ドラクロワ", 5], ["13", 258, "「晩鐘」など農民生活をテーマとした風景画を描いた、フランスの自然主義画家は誰か。", "ミレー", 6], ["13", 258, "代表作「石割り」で知られ、パリ＝コミューンに参加して投獄された経歴をもつフランスの写実主義画家は誰か。", "クールベ", 5], ["13", 258, "「草上の昼食」などの作品で知られ、印象派を支援したことから「印象派の父」とも呼ばれるフランスの画家は誰か。", "マネ", 3], ["13", 258, "19世紀後半に生まれた、光と色彩を重視して、対象から受ける直接的な印象を表現しようとした流派は何か。", "印象派", 6], ["13", 258, "「印象・日の出」が印象派の語源となり、連作「睡蓮」が有名な、フランスの印象派を代表する画家は誰か。", "モネ", 5], ["13", 258, "印象派から出発し、その後、情感豊かな色彩美を追求する画風で女性を多く描いた、フランスの画家は誰か。", "ルノワール", 6], ["13", 258, "19世紀末に印象派の影響を受けつつ、さらに自己の感覚や感受性を重視しようとした画家たちは、何と総称されるか。", "ポスト印象派", 3], ["13", 258, "代表作「サント＝ヴィクトワール山」で知られる、ポスト印象派の指導的な画家は誰か。", "セザンヌ", 4], ["13", 258, "晩年はタヒチで暮らし、未開社会を描くことで文明社会を批判したフランスのポスト印象派の画家は誰か。", "ゴーガン", 4], ["13", 258, "「ひまわり」など、強烈な色彩とタッチを特徴とする画風を確立した、オランダ生まれのポスト印象派の画家は誰か。", "ゴッホ", 5], ["13", 258, "「考える人」で有名な、フランスの彫刻家は誰か。", "ロダン", 5], ["13", 258, "19世紀末に始まった、波状の曲線や動植物をモチーフとした装飾が特徴的な、新芸術様式を何と呼ぶか。", "アール＝ヌーヴォー", 1], ["13", 258, "古典派音楽を集大成し、ロマン主義音楽への道を開いた、交響曲「運命」「第九番」などで有名な作曲家は誰か。", "ベートーヴェン", 5], ["13", 258, "「冬の旅」などで近代歌曲の創始者とも呼ばれる、オーストリアのロマン派作曲家は誰か。", "シューベルト", 5], ["13", 259, "「ピアノの詩人」と呼ばれる、ポーランドのロマン派作曲家は誰か。", "ショパン", 5], ["13", 259, "代表作「ニーベルングの指環」で知られる、楽劇を創始したドイツのロマン派作曲家は誰か。", "ヴァーグナー", 5], ["13", 259, "「椿姫」「アイーダ」などを残した、イタリアのロマン派オペラの作曲家は誰か。", "ヴェルディ", 1], ["13", 259, "代表作「わが祖国」で知られる、1848年のプラハ蜂起にも加わったチェコ国民楽派の創始者は誰か。", "スメタナ", 3], ["13", 259, "「白鳥の湖」「くるみ割り人形」などを残し、ロシア音楽を普遍的芸術にまで高めた作曲家は誰か。", "チャイコフスキー", 3], ["13", 259, "音そのものがもつ情感を豊かに表現する印象派音楽を創始した、フランスの作曲家は誰か。", "ドビュッシー", 4], ["13", 259, "ドイツ観念論哲学の創始者ともいわれる人物は誰か。", "カント", 6], ["13", 259, "ナポレオン占領下のベルリンで「ドイツ国民に告ぐ」の講演をおこなった哲学者は誰か。", "フィヒテ", 3], ["13", 259, "ヘーゲルが提唱した、観念論を体系化した哲学は何か。", "弁証法哲学", 5], ["13", 259, "弁証法的唯物論の立場から歴史の発展法則を解明しようとした、マルクスの歴史観を何と呼ぶか。", "史的唯物論", 5], ["13", 259, "「最大多数の最大幸福」を実現することが社会の発展につながるとした、イギリスの哲学を何と呼ぶか。", "功利主義", 6], ["13", 259, "「最大多数の最大幸福」の標語で有名な、イギリスの哲学者は誰か。", "ベンサム", 5], ["13", 259, "第2回選挙法改正の実現に努力し、功利主義を発展させて社会改良主義を説いたイギリスの哲学者は誰か。", "ジョン＝ステュアート＝ミル", 4], ["13", 259, "功利主義と進化論を結合して社会進化論を提唱した、イギリスの哲学者は誰か。", "スペンサー", 4], ["13", 260, "実証主義哲学を創始し、「社会学の祖」とされるフランスの哲学者は誰か。", "コント", 2], ["13", 260, "『人口論』で人口の増加が貧困化をまねくと説いた、イギリスの古典派経済学者は誰か。", "マルサス", 6], ["13", 260, "労働価値説や分配論・地代論などを大成し、古典派経済学を確立したイギリスの学者は誰か。", "リカード", 5], ["13", 260, "19世紀のドイツを中心に発展した、経済発展を歴史的に考察しようとする経済学を何と呼ぶか。", "歴史学派経済学", 3], ["13", 260, "歴史学派経済学を確立し、保護貿易主義を主張して、ドイツ関税同盟の結成にも尽力した経済学者は誰か。", "リスト", 6], ["13", 260, "資本主義経済を分析した、マルクスの主著は何か。", "『資本論』", 7], ["13", 260, "厳密な史料批判により、実証的・科学的叙述をおこなう近代歴史学を確立したドイツの歴史家は誰か。", "ランケ", 6], ["13", 260, "電磁気学の基礎を築いた、イギリスの学者は誰か。", "ファラデー", 5], ["13", 260, "エネルギー保存の法則を発見した、2人のドイツ人学者は誰か。", "マイヤー、ヘルムホルツ", 5], ["13", 260, "X線を発見した、ドイツの物理学者は誰か。", "レントゲン", 5], ["13", 260, "ラジウムを発見した、フランスの科学者夫妻は誰か。", "キュリー夫妻", 6], ["13", 260, "進化論をとなえ、諸科学に影響を与えた人物は誰か。", "ダーウィン", 7], ["13", 260, "1859年刊行の、生物進化に関するダーウィンの主著は何か。", "『種の起源』", 6], ["13", 260, "遺伝の法則を発見した、オーストリアの学者は誰か。", "メンデル", 4], ["13", 260, "狂犬病の予防接種に成功するなど、伝染病の予防・治療に貢献したフランスの学者は誰か。", "パストゥール", 6], ["13", 260, "結核菌やコレラ菌を発見した、ドイツの細菌学者は誰か。", "コッホ", 6], ["13", 260, "ダイナマイトを発明した、スウェーデン人技術者は誰か。", "ノーベル", 6], ["13", 260, "電信機を発明した、アメリカの発明家は誰か。", "モース（モールス）", 5], ["13", 261, "電話機を発明した、アメリカの発明家は誰か。", "ベル", 7], ["13", 261, "白熱電灯や映画を発明した、アメリカ人「発明王」は誰か。", "エディソン", 5], ["13", 261, "無線電信を発明した、イタリア人電気技術者は誰か。", "マルコーニ", 4], ["13", 261, "1851年に英仏間、その後大西洋やインド洋にも敷設され、情報による「世界の一体化」を進めた技術は何か。", "海底電信ケーブル", 3], ["13", 261, "1883年に自動車エンジンの原型となる内燃機関を発明し、86年にガソリン自動車を完成させたドイツ人は誰か。", "ダイムラー", 3], ["13", 261, "19世紀末に燃料消費の少ないエンジンを発明したドイツ人は誰か。", "ディーゼル", 3], ["13", 261, "20世紀初め、動力飛行機の初飛行に成功した兄弟は誰か。", "ライト兄弟", 5], ["13", 261, "17世紀中頃、オーストラリア・ニュージーランドに到達したオランダ人航海者は誰か。", "タスマン", 2], ["13", 261, "18世紀に太平洋のほぼ全域を探検したイギリスの探検家は誰か。", "クック", 5], ["13", 261, "北極点の初到達に成功した、アメリカ人探検家は誰か。", "ピアリ", 5], ["13", 261, "南極点の初到達に成功した、ノルウェー人探検家は誰か。", "アムンゼン", 6], ["13", 261, "アムンゼンと南極点の初到達を競った、イギリス人探検家は誰か。", "スコット", 3], ["13", 261, "19世紀末から中央アジアを探検したスウェーデンの探検家は誰か。", "ヘディン", 3], ["13", 261, "劣悪な都市環境がコレラの流行をうながすことから、公衆衛生のための上下水道の建設や、治安対策のためのスラム街の一掃など、第二帝政下のフランスで、オスマンが推進した、首都の全面的な都市改造を何と呼ぶか。", "パリ改造", 6], ["13", 261, "1863年にロンドン市内ではじめて開通してから、都市交通網として各地に普及していった運輸機関は何か。", "地下鉄", 1], ["13", 262, "エディソンの発明を経て、1895年、フランスのリュミエール兄弟による上映で誕生したものは何か。", "映画", 3], ["13", 262, "1852年にパリで開店した「ボン＝マルシェ」や58年にニューヨークで開店した「メイシーズ」のような店舗は何と呼ばれるか。", "デパート", 3], ["14", 264, "オーストリアとポーランドの連合軍に敗退し、オスマン帝国衰退のきっかけとなった1683年の遠征は何か。", "第2次ウィーン包囲（戦）", 5], ["14", 264, "1699年に締結され、オスマン帝国が東欧における覇権を失った条約は何か。", "カルロヴィッツ条約", 6], ["14", 264, "カルロヴィッツ条約で、ハ  ["15", 295, "民族の独立、民権の伸張、民生の安定を内容とした、中国革命へ向けての基本理念を何と呼ぶか。", "三民主義", 6], ["15", 295, "梁啓超ら、清朝に立憲君主制を導入しようとした勢力を何と呼ぶか。", "立憲派", 4], ["15", 295, "民族資本家を中心に展開されていた、利権の回収と民族資本による産業の発展をめざす運動は何か。", "利権回収運動", 3], ["15", 296, "民族運動や独立運動の初期にその推進主体にもなった、従属国や植民地の人々の資本を何と呼んだか。", "民族資本", 4], ["15", 296, "1911年5月、外国からの借款によって鉄道建設をはかるため、清朝政府が出した政策は何か。", "幹線鉄道国有化", 6], ["15", 296, "幹線鉄道国有化に反対して、1911年9月におこった民衆の武装蜂起はどこで発生したか。", "四川省", 7], ["15", 296, "1911年10月10日、湖北新軍が挙兵した都市はどこか。", "武昌", 7], ["15", 296, "武昌での新軍の挙兵が発端となった、1911～12年の革命は何か。", "辛亥革命", 7], ["15", 296, "1912年1月1日、南京を首都に成立した国は何か。", "中華民国", 7], ["15", 296, "中華民国の樹立後、孫文が就任した地位は何か。", "臨時大総統", 7], ["15", 296, "辛亥革命の勃発後、清朝が総理大臣に任命した人物は誰か。", "袁世凱", 7], ["15", 296, "袁世凱の統轄下にあった新軍は、とくに何と呼ばれたか。", "北洋軍", 2], ["15", 296, "1912年2月、退位した清朝最後の皇帝は誰か。", "宣統帝（溥儀）", 7], ["15", 296, "1912年3月に中華民国で発布された、憲法制定までの暫定基本法は何か。", "臨時約法", 2], ["15", 296, "1912年8月、宋教仁らが中国同盟会を中心に、選挙に備えて結成した政党は何か。", "国民党", 6], ["15", 296, "第二革命失敗後、孫文が亡命先の日本（東京）で結成した革命的秘密結社は何か。", "中華革命党", 5], ["15", 296, "1915年末、袁世凱が復活を宣言し、第三革命の発端となった政体は何か。", "帝政", 5], ["15", 296, "袁世凱の死後、北京政府の実権をめぐって争った、各地に割拠する軍事的指導者の私的集団を国民党側は批判的に何と呼んだか。", "軍閥", 4], ["15", 296, "辛亥革命勃発を機に、1911年12月に独立を宣言した藩部の地域はどこか。", "外モンゴル", 7], ["15", 297, "1920年、スヘバートルらを中心に結成されたモンゴル解放の中心組織は何か。", "モンゴル人民革命党", 6], ["15", 297, "1924年、外モンゴルで成立した国の名称は何か。", "モンゴル人民共和国", 7], ["15", 297, "スヘバートルの盟友で、1939年にモンゴル人民共和国の首相に就任した人物は誰か。", "チョイバルサン", 4], ["15", 297, "1913年にチベット独立の布告を発した、当時のチベット仏教教主の名前は何か。", "ダライ＝ラマ13世", 4], ["15", 297, "残された妻が、夫の火葬の火にとびこんで殉死するヒンドゥー教の風習を何と呼んだか。", "サティー（寡婦殉死）", 5], ["15", 297, "1810年代にサティーの廃止の運動を進めたり、ヒンドゥー教の偶像崇拝を批判した社会改革運動家は誰か。", "ラーム＝モーハン＝ローイ", 2], ["15", 297, "インド東北部のアッサム地方やセイロン島などのプランテーションで生産・輸出された商品作物は何か。", "茶", 3], ["15", 297, "インド帝国において、とくにインド人の資本によって成長がみられた産業分野は何か。", "綿紡績業", 3], ["15", 297, "1885年、対英協調を求めるイギリスの支援で創設され、ボンベイで第1回大会が開かれた組織は何か。", "インド国民会議", 7], ["15", 297, "1905年、民族運動の分断をねらってイギリスが出した、ある州を宗教別にわけようとした法令は何か。", "ベンガル分割令", 6], ["15", 297, "1906年、ベンガル分割令に反対するインド国民会議が4綱領を採択したのは、どこの都市での大会か。", "カ
